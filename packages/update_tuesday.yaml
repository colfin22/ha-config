shell_command:
  generate_update_report: >
    ssh -i /config/.ssh/ha_to_addon
    -o StrictHostKeyChecking=no
    -o BatchMode=yes
    -o ConnectTimeout=10
    root@172.30.33.0
    "setsid nohup bash /config/scripts/update_tuesday.sh </dev/null >/dev/null 2>&1 &"

  # HA kills a shell_command after 60 s, and the report takes ~60 s, so the line above only
  # launches it detached. The automation waits, then runs this: OK if last_run.log was written
  # in the last 10 min AND reached "=== Complete", otherwise FAIL. (HA runs
  # commands without a shell, hence sh -c.)
  check_update_report: >-
    sh -c 'find /config/infra_private/update_tuesday/last_run.log -mmin -10 | grep -q .
    && grep -q "=== Complete" /config/infra_private/update_tuesday/last_run.log
    && echo OK || echo FAIL'

  # infra dashboard: generate the post-maintenance applied-report on node1 (fire-and-forget;
  # the report scp's itself back to /config/infra_private/update_tuesday/ when done)
  generate_applied_report: !secret applied_report_command

  # ha-config #32: sync maintenance mode into Zabbix + Uptime Kuma maintenance windows
  # (fail-soft on node1 — never blocks; 12h auto-expiry is the forget-to-turn-off net)
  maint_sync_on: !secret maint_sync_on_command
  # ha-config #42: collect the IP inventory on demand from the dashboard's IPs tab
  # (fire-and-forget - the run takes ~50s incl. the ping sweep; the 60s regen picks the JSON up)
  # flock -n: concurrent webhook posts race past the automation's mode:single, so the lock -
  # not the automation - is what guarantees one collector at a time (and an intact JSON)
  refresh_ip_inventory: !secret ip_inventory_refresh_command

  maint_sync_off: !secret maint_sync_off_command
