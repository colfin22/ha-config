command_line:
  - sensor:
      name: "Frigate CCTV Disk Usage"
      unique_id: frigate_cctv_disk_usage
      unit_of_measurement: "%"
      command: !secret frigate_ssh_df_command
      scan_interval: 300
      value_template: "{{ value.split()[-2] | replace('%', '') | int }}"

  - sensor:
      name: "Frigate Overnight Person Count"
      unique_id: frigate_overnight_person_count
      icon: mdi:motion-sensor
      scan_interval: 300
      command: !secret frigate_ssh_events_command
      value_template: >
        {% set ns = namespace(n=0) %}
        {% for e in value_json %}
          {% if e.data and e.data.max_severity == 'alert' %}
            {% set ns.n = ns.n + 1 %}
          {% endif %}
        {% endfor %}
        {{ ns.n }}

  - sensor:
      name: "Frigate Overnight Best Camera"
      unique_id: frigate_overnight_best_camera
      icon: mdi:cctv
      scan_interval: 300
      command: !secret frigate_ssh_events_command
      value_template: >
        {% set ns = namespace(cam='', ts=0) %}
        {% for e in value_json %}
          {% if e.data and e.data.max_severity == 'alert' and e.start_time | float(0) > ns.ts %}
            {% set ns.cam = e.camera | replace('_', ' ') %}
            {% set ns.ts = e.start_time | float(0) %}
          {% endif %}
        {% endfor %}
        {{ ns.cam }}

  - sensor:
      name: "Frigate Overnight Best Time"
      unique_id: frigate_overnight_best_time
      icon: mdi:clock
      scan_interval: 300
      command: !secret frigate_ssh_events_command
      value_template: >
        {% set ns = namespace(ts=0) %}
        {% for e in value_json %}
          {% if e.data and e.data.max_severity == 'alert' and e.start_time | float(0) > ns.ts %}
            {% set ns.ts = e.start_time | float(0) %}
          {% endif %}
        {% endfor %}
        {{ ns.ts }}

  - sensor:
      name: "Frigate Overnight Camera Count"
      unique_id: frigate_overnight_camera_count
      icon: mdi:cctv
      scan_interval: 300
      command: !secret frigate_ssh_events_command
      value_template: >
        {% set ns = namespace(cams=[]) %}
        {% for e in value_json %}
          {% if e.data and e.data.max_severity == 'alert' and e.camera not in ns.cams %}
            {% set ns.cams = ns.cams + [e.camera] %}
          {% endif %}
        {% endfor %}
        {{ ns.cams | length }}

# CCTV tab (13-11-2026): last Frigate ALERT per camera, for the map on smart-home/cctv.
# Fed by MQTT frigate/reviews (severity alert). cctv/seed only used once to fill them at build time.
template:
  - triggers:
      - trigger: mqtt
        topic: frigate/reviews
      - trigger: mqtt
        topic: cctv/seed
    conditions:
      - condition: template
        value_template: >-
          {{ trigger.payload_json.after is defined
             and trigger.payload_json.after.camera == 'Front_Van'
             and trigger.payload_json.after.severity == 'alert' }}
    sensor:
      - name: CCTV Last Alert Front Van
        unique_id: cctv_last_alert_front_van
        device_class: timestamp
        icon: mdi:cctv
        state: "{{ trigger.payload_json.after.start_time | as_datetime }}"
        attributes:
          review_id: "{{ trigger.payload_json.after.id }}"
          camera: Front_Van
          objects: "{{ trigger.payload_json.after.data.objects | join(', ') }}"
          event_id: "{{ (trigger.payload_json.after.data.detections or [''])[0] }}"
  - triggers:
      - trigger: mqtt
        topic: frigate/reviews
      - trigger: mqtt
        topic: cctv/seed
    conditions:
      - condition: template
        value_template: >-
          {{ trigger.payload_json.after is defined
             and trigger.payload_json.after.camera == 'Doorbell'
             and trigger.payload_json.after.severity == 'alert' }}
