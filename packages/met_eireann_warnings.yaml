rest:
  # 09-10-2026: met.ie retired warning_IRELAND.json (404 from 06-10) and now
  # sends level in lowercase, so compares are case-insensitive and the level
  # is re-capitalised for consumers (banners, push automation).
  - resource: "https://www.met.ie/Open_Data/json/warning_ALL.json"
    scan_interval: 300
    sensor:
      - name: "Met Éireann Active Warnings"
        unique_id: met_eireann_active_warnings
        value_template: >
          {% set roscommon = ['EI24'] %}
          {% set ns = namespace(best='none', score=0) %}
          {% for w in value_json %}
            {% if now() < as_datetime(w.expiry) and w.regions is defined and 'Blight' not in w.headline %}
              {% set hit = namespace(found=false) %}
              {% for r in w.regions %}
                {% if r in roscommon %}{% set hit.found = true %}{% endif %}
              {% endfor %}
              {% if hit.found %}
                {% if (w.level | lower) == 'red' %}{% set s = 3 %}
                {% elif (w.level | lower) == 'orange' %}{% set s = 2 %}
                {% elif (w.level | lower) == 'yellow' %}{% set s = 1 %}
                {% else %}{% set s = 0 %}{% endif %}
                {% if s > ns.score %}
                  {% set ns.score = s %}
                  {% set ns.best = w.level | lower | capitalize %}
                {% endif %}
              {% endif %}
            {% endif %}
          {% endfor %}
          {{ ns.best }}
      # The three sensors below re-run the same pick as the level above so
      # headline/expiry/severity always describe the warning that set the
      # level — NOT array position 0, which bit us on 06-07-2026 when a
      # Blight advisory sat first while a real Weather Advisory triggered.
      - name: "Met Éireann Warning Headline"
        unique_id: met_eireann_warning_headline
        value_template: >
          {% set roscommon = ['EI24'] %}
          {% set ns = namespace(val='none', score=0) %}
          {% for w in value_json %}
            {% if now() < as_datetime(w.expiry) and w.regions is defined and 'Blight' not in w.headline %}
              {% set hit = namespace(found=false) %}
              {% for r in w.regions %}
                {% if r in roscommon %}{% set hit.found = true %}{% endif %}
              {% endfor %}
              {% if hit.found %}
                {% if (w.level | lower) == 'red' %}{% set s = 3 %}
                {% elif (w.level | lower) == 'orange' %}{% set s = 2 %}
                {% elif (w.level | lower) == 'yellow' %}{% set s = 1 %}
                {% else %}{% set s = 0 %}{% endif %}
                {% if s > ns.score %}
                  {% set ns.score = s %}
                  {% set ns.val = w.headline %}
                {% endif %}
              {% endif %}
            {% endif %}
          {% endfor %}
          {{ ns.val }}
      - name: "Met Éireann Warning Expiry"
        unique_id: met_eireann_warning_expiry
        value_template: >
          {% set roscommon = ['EI24'] %}
          {% set ns = namespace(val='none', score=0) %}
          {% for w in value_json %}
            {% if now() < as_datetime(w.expiry) and w.regions is defined and 'Blight' not in w.headline %}
              {% set hit = namespace(found=false) %}
              {% for r in w.regions %}
                {% if r in roscommon %}{% set hit.found = true %}{% endif %}
              {% endfor %}
              {% if hit.found %}
                {% if (w.level | lower) == 'red' %}{% set s = 3 %}
                {% elif (w.level | lower) == 'orange' %}{% set s = 2 %}
                {% elif (w.level | lower) == 'yellow' %}{% set s = 1 %}
                {% else %}{% set s = 0 %}{% endif %}
                {% if s > ns.score %}
                  {% set ns.score = s %}
                  {% set ns.val = w.expiry %}
                {% endif %}
              {% endif %}
            {% endif %}
          {% endfor %}
          {{ ns.val }}
      - name: "Met Éireann Warning Severity"
        unique_id: met_eireann_warning_severity
        value_template: >
          {% set roscommon = ['EI24'] %}
          {% set ns = namespace(val='none', score=0) %}
          {% for w in value_json %}
            {% if now() < as_datetime(w.expiry) and w.regions is defined and 'Blight' not in w.headline %}
              {% set hit = namespace(found=false) %}
              {% for r in w.regions %}
                {% if r in roscommon %}{% set hit.found = true %}{% endif %}
              {% endfor %}
              {% if hit.found %}
                {% if (w.level | lower) == 'red' %}{% set s = 3 %}
                {% elif (w.level | lower) == 'orange' %}{% set s = 2 %}
                {% elif (w.level | lower) == 'yellow' %}{% set s = 1 %}
                {% else %}{% set s = 0 %}{% endif %}
                {% if s > ns.score %}
                  {% set ns.score = s %}
                  {% set ns.val = w.severity %}
                {% endif %}
              {% endif %}
            {% endif %}
          {% endfor %}
          {{ ns.val }}

      - name: "Met Éireann Warning Kind"
        unique_id: met_eireann_warning_kind
        value_template: >
          {% set roscommon = ['EI24'] %}
          {% set ns = namespace(val='none', score=0) %}
          {% for w in value_json %}
            {% if now() < as_datetime(w.expiry) and w.regions is defined and 'Blight' not in w.headline %}
              {% set hit = namespace(found=false) %}
              {% for r in w.regions %}
                {% if r in roscommon %}{% set hit.found = true %}{% endif %}
              {% endfor %}
              {% if hit.found %}
                {% if (w.level | lower) == 'red' %}{% set s = 3 %}
                {% elif (w.level | lower) == 'orange' %}{% set s = 2 %}
                {% elif (w.level | lower) == 'yellow' %}{% set s = 1 %}
                {% else %}{% set s = 0 %}{% endif %}
                {% if s > ns.score %}
                  {% set ns.score = s %}
                  {% set ns.val = 'Advisory' if (w.type | lower) == 'advisory' else 'Warning' %}
                {% endif %}
              {% endif %}
            {% endif %}
          {% endfor %}
          {{ ns.val }}

template:
  - sensor:
      - name: "Met Éireann Warning Level"
        unique_id: met_eireann_warning_level
        state: "{{ states('sensor.met_eireann_active_warnings') }}"
        icon: >
          {% set s = states('sensor.met_eireann_active_warnings') %}
          {% if s == 'Yellow' %}mdi:alert{% elif s == 'Orange' %}mdi:alert-circle{% elif s == 'Red' %}mdi:alert-octagon{% else %}mdi:weather-cloudy{% endif %}
