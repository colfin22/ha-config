# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes
#  extra_module_url:
#    - /local/card-mod.js  

recorder:
  purge_keep_days: 7
  exclude:
    entity_globs:
      - image.*
      - binary_sensor.*_occupancy
      - sensor.lxc_*
      - sensor.qemu_*
      - sensor.datasets_*
      - sensor.node_proxmox*
      - sensor.mikrotik_*
      - sensor.pi_hole_*
      - sensor.truenas_disks_*
      - sensor.nextcloud_*

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
sensor: !include_dir_list entities/sensors/
template: !include template.yaml

# Turns on the API so that Daire can do dev stuff
api:

#dashboard
lovelace:
#  resource_mode: yaml
  dashboards:
    lovelace:
      mode: yaml
      filename: ui-lovelace.yaml
      title: Overview
      icon: mdi:view-dashboard
      show_in_sidebar: true

http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 10.0.0.249

homeassistant:
  packages: !include_dir_named packages 
  media_dirs:
    llmvision: /config/media/llmvision


rest:
  - resource_template: "http://10.0.0.246:5000/api/events?label=person&after={{ today_at('00:00') | as_timestamp | int }}&has_snapshot=1&limit=100"
    scan_interval: 300
    sensor:
      - name: "Frigate Overnight Person Count"
        unique_id: frigate_overnight_person_count
        value_template: >
          {% set ns = namespace(n=0) %}
          {% for e in value_json %}
            {% if e.data and e.data.max_severity == 'alert' %}
              {% set ns.n = ns.n + 1 %}
            {% endif %}
          {% endfor %}
          {{ ns.n }}
        icon: mdi:motion-sensor
      - name: "Frigate Overnight Best Camera"
        unique_id: frigate_overnight_best_camera
        value_template: >
          {% set ns = namespace(cam='', ts=0) %}
          {% for e in value_json %}
            {% if e.data and e.data.max_severity == 'alert' and e.start_time | float(0) > ns.ts %}
              {% set ns.cam = e.camera | replace('_', ' ') %}
              {% set ns.ts = e.start_time | float(0) %}
            {% endif %}
          {% endfor %}
          {{ ns.cam }}
        icon: mdi:cctv
      - name: "Frigate Overnight Best Time"
        unique_id: frigate_overnight_best_time
        value_template: >
          {% set ns = namespace(ts=0) %}
          {% for e in value_json %}
            {% if e.data and e.data.max_severity == 'alert' and e.start_time | float(0) > ns.ts %}
              {% set ns.ts = e.start_time | float(0) %}
            {% endif %}
          {% endfor %}
          {{ ns.ts }}
        icon: mdi:clock
      - name: "Frigate Overnight Camera Count"
        unique_id: frigate_overnight_camera_count
        value_template: >
          {% set ns = namespace(cams=[]) %}
          {% for e in value_json %}
            {% if e.data and e.data.max_severity == 'alert' and e.camera not in ns.cams %}
              {% set ns.cams = ns.cams + [e.camera] %}
            {% endif %}
          {% endfor %}
          {{ ns.cams | length }}
        icon: mdi:cctv

command_line:
  - sensor:
      name: "Frigate CCTV Disk Usage"
      unique_id: frigate_cctv_disk_usage
      unit_of_measurement: "%"
      command: "ssh -i /config/.ssh/frigate_sensor -o StrictHostKeyChecking=no -o BatchMode=yes hassio@10.0.0.246 df /cctv_clips"
      scan_interval: 300
      value_template: "{{ value.split()[-2] | replace('%', '') | int }}"

shell_command:
  generate_update_report: >
    ssh -i /config/.ssh/ha_to_addon
    -o StrictHostKeyChecking=no
    -o BatchMode=yes
    -o ConnectTimeout=10
    root@172.30.33.0
    "bash /config/scripts/update_tuesday.sh"

logger:
  default: warning
  logs:
    urllib3.connectionpool: error
    homeassistant.components.rest.util: error

input_boolean:
  heating_away_mode_active:
    name: "Heating Away Mode Active"
    icon: mdi:thermostat

input_number:
  solar_top_5_1st_kwh:
    name: "Solar Top 5 — 1st kWh"
    min: 0
    max: 100
    step: 0.001
    unit_of_measurement: kWh
    icon: mdi:solar-power
  solar_top_5_2nd_kwh:
    name: "Solar Top 5 — 2nd kWh"
    min: 0
    max: 100
    step: 0.001
    unit_of_measurement: kWh
    icon: mdi:solar-power
  solar_top_5_3rd_kwh:
    name: "Solar Top 5 — 3rd kWh"
    min: 0
    max: 100
    step: 0.001
    unit_of_measurement: kWh
    icon: mdi:solar-power
  solar_top_5_4th_kwh:
    name: "Solar Top 5 — 4th kWh"
    min: 0
    max: 100
    step: 0.001
    unit_of_measurement: kWh
    icon: mdi:solar-power
  solar_top_5_5th_kwh:
    name: "Solar Top 5 — 5th kWh"
    min: 0
    max: 100
    step: 0.001
    unit_of_measurement: kWh
    icon: mdi:solar-power

input_text:
  solar_top_5_1st_date:
    name: "Solar Top 5 — 1st Date"
    max: 100
    icon: mdi:calendar
  solar_top_5_2nd_date:
    name: "Solar Top 5 — 2nd Date"
    max: 100
    icon: mdi:calendar
  solar_top_5_3rd_date:
    name: "Solar Top 5 — 3rd Date"
    max: 100
    icon: mdi:calendar
  solar_top_5_4th_date:
    name: "Solar Top 5 — 4th Date"
    max: 100
    icon: mdi:calendar
  solar_top_5_5th_date:
    name: "Solar Top 5 — 5th Date"
    max: 100
    icon: mdi:calendar

