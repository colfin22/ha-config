tts_announce:
  alias: TTS Announce
  description: Saves volume, ramps to 100%, plays TTS, waits for playback, restores
    volume. Queued so concurrent calls don't overlap.
  icon: mdi:bullhorn
  mode: queued
  max: 5
  fields:
    message:
      description: The message to announce
      required: true
      example: Motion detected at the front door
      selector:
        text: {}
    target_player:
      description: Media player to announce on. Defaults to home audio group.
      required: false
      default: media_player.home_audio_group_cast
      example: media_player.kitchen_display_cast
      selector:
        entity:
          domain: media_player
  sequence:
  - variables:
      resolved_player: '{{ target_player | default(''media_player.home_audio_group_cast'')
        }}'
      prior_volume: '{{ state_attr(target_player | default(''media_player.home_audio_group_cast''),
        ''volume_level'') | float(0.5) }}'
  - action: media_player.volume_set
    target:
      entity_id: '{{ resolved_player }}'
    data:
      volume_level: 1
  - action: tts.cloud_say
    target:
      entity_id: '{{ resolved_player }}'
    data:
      message: '{{ message }}'
      cache: false
  - delay:
      seconds: 8
  - action: media_player.volume_set
    target:
      entity_id: '{{ resolved_player }}'
    data:
      volume_level: '{{ prior_volume | float(0.5) }}'
strobe_lights:
  alias: Strobe Lights
  description: Snapshots light state, strobes lights a set number of times, then restores
    previous state.
  icon: mdi:alarm-light
  mode: single
  fields:
    lights:
      description: Light entity or list of lights to strobe
      required: true
      example: light.sitting_room
      selector:
        target:
          entity:
            domain: light
    count:
      description: Number of flash cycles
      required: false
      default: 10
      example: 10
      selector:
        number:
          min: 1
          max: 50
          mode: box
    brightness_pct:
      description: Brightness percentage when on
      required: false
      default: 100
      example: 100
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: '%'
    on_seconds:
      description: Seconds lights stay on per cycle
      required: false
      default: 1.5
      example: 1.5
      selector:
        number:
          min: 0.1
          max: 10
          step: 0.1
          mode: box
    off_seconds:
      description: Seconds lights stay off per cycle
      required: false
      default: 1.5
      example: 1.5
      selector:
        number:
          min: 0.1
          max: 10
          step: 0.1
          mode: box
    while_entity:
      description: If set, strobe runs while this entity is in while_state instead
        of using count
      required: false
      example: alarm_control_panel.alarmo
      selector:
        entity: {}
    while_state:
      description: State to keep strobing while (used with while_entity)
      required: false
      default: triggered
      example: triggered
      selector:
        text: {}
  sequence:
  - action: scene.create
    data:
      scene_id: strobe_lights_snapshot
      snapshot_entities: '{{ lights }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ while_entity | default('''') != '''' }}'
      sequence:
      - repeat:
          while:
          - condition: template
            value_template: '{{ is_state(while_entity, while_state | default(''triggered''))
              }}'
          sequence:
          - action: light.turn_on
            target:
              entity_id: '{{ lights }}'
            data:
              brightness_pct: '{{ brightness_pct | default(100) | int }}'
          - delay:
              seconds: '{{ on_seconds | default(1.5) }}'
          - action: light.turn_off
            target:
              entity_id: '{{ lights }}'
          - delay:
              seconds: '{{ off_seconds | default(1.5) }}'
    default:
    - repeat:
        count: '{{ count | default(10) | int }}'
        sequence:
        - action: light.turn_on
          target:
            entity_id: '{{ lights }}'
          data:
            brightness_pct: '{{ brightness_pct | default(100) | int }}'
        - delay:
            seconds: '{{ on_seconds | default(1.5) }}'
        - action: light.turn_off
          target:
            entity_id: '{{ lights }}'
        - delay:
            seconds: '{{ off_seconds | default(1.5) }}'
  - action: scene.turn_on
    target:
      entity_id: scene.strobe_lights_snapshot
