tts_announce:
  alias: TTS Announce
  description: Plays a TTS announcement at full volume. For the home audio group it
    boosts each MEMBER speaker after playback starts (a Google cast group's master
    volume does NOT cascade to members), then restores them to 50%. For a single speaker
    it saves/boosts/restores that player. Queued so concurrent calls don't overlap.
  icon: mdi:bullhorn
  mode: queued
  max: 5
  fields:
    message:
      description: The message to announce
      required: true
      example: Motion detected at the front door
      selector:
        text: {}
    target_player:
      description: Media player to announce on. Defaults to home audio group.
      required: false
      default: media_player.home_audio_group_cast
      example: media_player.kitchen_display_cast
      selector:
        entity:
          domain: media_player
  sequence:
  - variables:
      resolved_player: '{{ target_player | default(''media_player.home_audio_group_cast'')
        }}'
      is_group: '{{ (target_player | default(''media_player.home_audio_group_cast''))
        == ''media_player.home_audio_group_cast'' }}'
      prior_volume: '{{ state_attr(target_player | default(''media_player.home_audio_group_cast''),
        ''volume_level'') | float(0.5) }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ is_group }}'
      sequence:
      - action: tts.cloud_say
        target:
          entity_id: media_player.home_audio_group_cast
        data:
          message: '{{ message }}'
          cache: false
      - delay:
          seconds: 1
      - action: media_player.volume_set
        target:
          entity_id:
          - media_player.kitchen_display_cast
          - media_player.sitting_room_speaker_cast
          - media_player.office_speaker_cast
          - media_player.colm_bedroom_speaker_cast
        data:
          volume_level: 1
      - delay:
          seconds: 1
      - action: media_player.volume_set
        target:
          entity_id:
          - media_player.kitchen_display_cast
          - media_player.sitting_room_speaker_cast
          - media_player.office_speaker_cast
          - media_player.colm_bedroom_speaker_cast
        data:
          volume_level: 1
      - delay:
          seconds: 6
      - action: media_player.volume_set
        target:
          entity_id:
          - media_player.kitchen_display_cast
          - media_player.sitting_room_speaker_cast
          - media_player.office_speaker_cast
          - media_player.colm_bedroom_speaker_cast
        data:
          volume_level: 0.5
    default:
    - action: media_player.volume_set
      target:
        entity_id: '{{ resolved_player }}'
      data:
        volume_level: 1
    - action: tts.cloud_say
      target:
        entity_id: '{{ resolved_player }}'
      data:
        message: '{{ message }}'
        cache: false
    - delay:
        seconds: 8
    - action: media_player.volume_set
      target:
        entity_id: '{{ resolved_player }}'
      data:
        volume_level: '{{ prior_volume | float(0.5) }}'
strobe_lights:
  alias: Strobe Lights
  description: Snapshots light state, strobes lights a set number of times (optionally
    in a colour for colour-capable lights), then restores previous state.
  icon: mdi:alarm-light
  mode: single
  fields:
    lights:
      description: Light entity or list of lights to strobe
      required: true
      example: light.sitting_room
      selector:
        target:
          entity:
            domain: light
    count:
      description: Number of flash cycles
      required: false
      default: 10
      example: 10
      selector:
        number:
          min: 1
          max: 50
          mode: box
    brightness_pct:
      description: Brightness percentage when on
      required: false
      default: 100
      example: 100
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: '%'
    rgb_color:
      description: Optional RGB colour. Colour-capable lights flash this colour; the
        rest just brighten. Omit for a plain brightness strobe (e.g. the alarm).
      required: false
      example: '[0, 0, 255]'
      selector:
        color_rgb:
    on_seconds:
      description: Seconds lights stay on per cycle
      required: false
      default: 1.5
      example: 1.5
      selector:
        number:
          min: 0.1
          max: 10
          step: 0.1
          mode: box
    off_seconds:
      description: Seconds lights stay off per cycle
      required: false
      default: 1.5
      example: 1.5
      selector:
        number:
          min: 0.1
          max: 10
          step: 0.1
          mode: box
    while_entity:
      description: If set, strobe runs while this entity is in while_state instead
        of using count
      required: false
      example: alarm_control_panel.alarmo
      selector:
        entity: {}
    while_state:
      description: State to keep strobing while (used with while_entity)
      required: false
      default: triggered
      example: triggered
      selector:
        text: {}
  sequence:
  - variables:
      has_colour: '{{ true if (rgb_color is defined and rgb_color) else false }}'
      bright: '{{ brightness_pct | default(100) | int }}'
      colour_lights: '{% set ns=namespace(x=[]) %}{% for e in expand(lights) %}{%
        if (e.attributes.supported_color_modes | default([]) | select(''in'',[''rgb'',''rgbw'',''rgbww'',''hs'',''xy''])
        | list | length) > 0 %}{% set ns.x = ns.x + [e.entity_id] %}{% endif %}{%
        endfor %}{{ ns.x }}'
      plain_lights: '{% set ns=namespace(y=[]) %}{% for e in expand(lights) %}{% if
        (e.attributes.supported_color_modes | default([]) | select(''in'',[''rgb'',''rgbw'',''rgbww'',''hs'',''xy''])
        | list | length) == 0 %}{% set ns.y = ns.y + [e.entity_id] %}{% endif %}{%
        endfor %}{{ ns.y }}'
  - action: scene.create
    data:
      scene_id: strobe_lights_snapshot
      snapshot_entities: '{{ expand(lights) | map(attribute=''entity_id'') | list
        }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ while_entity | default('''') != '''' }}'
      sequence:
      - repeat:
          while:
          - condition: template
            value_template: '{{ is_state(while_entity, while_state | default(''triggered''))
              }}'
          sequence:
          - choose:
            - conditions:
              - condition: template
                value_template: '{{ has_colour }}'
              sequence:
              - if:
                - condition: template
                  value_template: '{{ colour_lights | count > 0 }}'
                then:
                - action: light.turn_on
                  target:
                    entity_id: '{{ colour_lights }}'
                  data:
                    brightness_pct: '{{ bright }}'
                    rgb_color: '{{ rgb_color }}'
              - if:
                - condition: template
                  value_template: '{{ plain_lights | count > 0 }}'
                then:
                - action: light.turn_on
                  target:
                    entity_id: '{{ plain_lights }}'
                  data:
                    brightness_pct: '{{ bright }}'
            default:
            - action: light.turn_on
              target:
                entity_id: '{{ lights }}'
              data:
                brightness_pct: '{{ bright }}'
          - delay:
              seconds: '{{ on_seconds | default(1.5) }}'
          - action: light.turn_off
            target:
              entity_id: '{{ lights }}'
          - delay:
              seconds: '{{ off_seconds | default(1.5) }}'
    default:
    - repeat:
        count: '{{ count | default(10) | int }}'
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ has_colour }}'
            sequence:
            - if:
              - condition: template
                value_template: '{{ colour_lights | count > 0 }}'
              then:
              - action: light.turn_on
                target:
                  entity_id: '{{ colour_lights }}'
                data:
                  brightness_pct: '{{ bright }}'
                  rgb_color: '{{ rgb_color }}'
            - if:
              - condition: template
                value_template: '{{ plain_lights | count > 0 }}'
              then:
              - action: light.turn_on
                target:
                  entity_id: '{{ plain_lights }}'
                data:
                  brightness_pct: '{{ bright }}'
          default:
          - action: light.turn_on
            target:
              entity_id: '{{ lights }}'
            data:
              brightness_pct: '{{ bright }}'
        - delay:
            seconds: '{{ on_seconds | default(1.5) }}'
        - action: light.turn_off
          target:
            entity_id: '{{ lights }}'
        - delay:
            seconds: '{{ off_seconds | default(1.5) }}'
  - action: scene.turn_on
    target:
      entity_id: scene.strobe_lights_snapshot
cycle_scenes:
  alias: Cycle Scenes
  description: Cycles a light group through an ordered list of scenes from a dimmer's
    on button. First press from off turns the group on (last state); each further
    press advances to the next scene, wrapping. Next-scene index stored in an input_number.
  icon: mdi:playlist-play
  mode: queued
  max: 10
  fields:
    light:
      description: Light group entity_id (e.g. light.kitchen)
      required: true
      example: light.kitchen
    scenes:
      description: Ordered list of scene entity_ids to cycle through
      required: true
      example: '[scene.kitchen_night, scene.kitchen_bright]'
    index_helper:
      description: input_number entity_id that stores the next scene index
      required: true
      example: input_number.kitchen_scene_index
  sequence:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ not is_state(light, ''on'') }}'
      sequence:
      - action: light.turn_on
        target:
          entity_id: '{{ light }}'
      - action: input_number.set_value
        target:
          entity_id: '{{ index_helper }}'
        data:
          value: 0
    default:
    - variables:
        n: '{{ scenes | length }}'
        i: '{{ (states(index_helper) | int(0)) % (scenes | length) }}'
    - action: scene.turn_on
      target:
        entity_id: '{{ scenes[i] }}'
    - action: input_number.set_value
      target:
        entity_id: '{{ index_helper }}'
      data:
        value: '{{ (i + 1) % n }}'
