#template:
- trigger:
    - trigger: state
      entity_id: event.front_door_chime
      not_from:
        - unknown
        - unavailable
  binary_sensor:
    - name: front_doorbell_motion_detected
      unique_id: front_doorbell_motion_detected
      auto_off: 15
      state: 'true'

# Grid import/export power, split out of the single signed Solis meter sensor.
# sensor.solis_meter_active_power: POSITIVE = export, NEGATIVE = import
# (inverted vs the old sensor.myenergi_eddi_power_import/_export these replace).
# Verified 431/536 paired 5-min buckets, and 30/31 net-direction agreement above 500 W.
- sensor:
    - name: Grid Import Power
      unique_id: grid_import_power
      unit_of_measurement: W
      device_class: power
      state_class: measurement
      icon: mdi:transmission-tower-export
      availability: >-
        {{ states('sensor.solis_meter_active_power') not in
           ['unknown', 'unavailable', 'none', ''] }}
      state: >-
        {{ [0, 0 - (states('sensor.solis_meter_active_power') | float(0))] | max | round(0) }}
    - name: Grid Export Power
      unique_id: grid_export_power
      unit_of_measurement: W
      device_class: power
      state_class: measurement
      icon: mdi:transmission-tower-import
      availability: >-
        {{ states('sensor.solis_meter_active_power') not in
           ['unknown', 'unavailable', 'none', ''] }}
      state: >-
        {{ [0, states('sensor.solis_meter_active_power') | float(0)] | max | round(0) }}

# Signed battery flow, reconstructed from the two direction-specific Solis sensors.
# sensor.solis_battery_power is an UNSIGNED MAGNITUDE (never negative, whichever way the
# battery is moving) and sensor.solis_energy_dashboard_solis_battery_power is exactly -|flow|,
# so NEITHER carries direction. input/output are mutually exclusive and do.
# POSITIVE = CHARGING, NEGATIVE = DISCHARGING - the same convention as the old Autarco
# sensor.battery_flow_now this badge used for 14 months (measured 3,462 vs 186 hours, 94.9%).
- sensor:
    - name: Battery Flow Now
      unique_id: battery_flow_now
      unit_of_measurement: W
      device_class: power
      state_class: measurement
      icon: mdi:battery-charging
      availability: >-
        {{ states('sensor.solis_battery_input_energy') not in
           ['unknown', 'unavailable', 'none', ''] and
           states('sensor.solis_battery_output_energy') not in
           ['unknown', 'unavailable', 'none', ''] }}
      state: >-
        {{ ((states('sensor.solis_battery_input_energy') | float(0))
            - (states('sensor.solis_battery_output_energy') | float(0))) | round(0) }}

# Display-only mirror of sensor.battery_flow_now with the sign flipped, so the Energy
# view's header badge reads consistently with the helios-card (positive while discharging).
# NOT a source of truth - battery_flow_now stays positive=charging for its 14mo history.
    - name: Battery Flow Display
      unique_id: battery_flow_display
      unit_of_measurement: W
      device_class: power
      state_class: measurement
      icon: >-
        {{ 'mdi:battery-arrow-up' if states('sensor.battery_flow_now')|float(0) < 0
           else 'mdi:battery-arrow-down' if states('sensor.battery_flow_now')|float(0) > 0
           else 'mdi:battery' }}
      availability: >-
        {{ states('sensor.battery_flow_now') not in ['unknown', 'unavailable', 'none', ''] }}
      state: >-
        {{ (states('sensor.battery_flow_now') | float(0)) * -1 | round(0) }}
