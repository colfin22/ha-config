        'hail': '\U0001F9CA', 'exceptional': '\U0001F321️'} %}{{ icons.get(condition,
        '\U0001F324️') }}"
      color: '{% set colors = {''sunny'': ''#FFA500'', ''clear-night'': ''#191970'',
        ''partlycloudy'': ''#87CEEB'', ''cloudy'': ''#708090'', ''rainy'': ''#4169E1'',
        ''pouring'': ''#1E3A8A'', ''snowy'': ''#00BFFF'', ''snowy-rainy'': ''#4682B4'',
        ''lightning'': ''#FFD700'', ''lightning-rainy'': ''#FF8C00'', ''windy'': ''#20B2AA'',
        ''windy-variant'': ''#2E8B57'', ''fog'': ''#A9A9A9'', ''hail'': ''#B0E0E6'',
        ''exceptional'': ''#FF4500''} %}{{ colors.get(condition, ''#1a73e8'') }}'
  - variables:
      notif_title: '{{ icon }} Tomorrow – {{ (now() + timedelta(days=1)).strftime(''%A
        %-d %B'') }}'
      notif_message: "{{ icon }} {{ condition | replace('-', ' ') | title }}\n\n\U0001F321️
        \ High {{ fc.temperature | default(0) | round | int }}°C  ·  Low {{ fc.templow
        | default(0) | round | int }}°C\n\U0001F327️  Rain: {% set mm = fc.precipitation
        | default(0) | float %}{{ 'None' if mm == 0 else 'Low' if mm < 1 else 'Likely'
        if mm < 5 else 'Heavy' if mm < 10 else 'Very heavy' }} · {{ mm | round(1)
        }}mm\n\U0001F4A8  Wind: {{ fc.wind_speed | default(0) | round | int }} km/h"
  - if:
    - condition: template
      value_template: '{{ someone_away }}'
    then:
    - action: input_number.set_value
      target:
        entity_id: input_number.away_lat
      data:
        value: '{{ away_lat }}'
    - action: input_number.set_value
      target:
        entity_id: input_number.away_lon
      data:
        value: '{{ away_lon }}'
    - action: rest_command.get_away_location_name
      data:
        lat: '{{ away_lat }}'
        lon: '{{ away_lon }}'
      response_variable: geocode_resp
    - variables:
        away_name: '{% set addr = geocode_resp.content.address %}{% set city = addr.get(''city'',
          addr.get(''town'', addr.get(''village'', addr.get(''municipality'', ''Unknown''))))
          %}{{ city }}, {{ addr.get(''country'', '''') }}'
    - action: input_text.set_value
      target:
        entity_id: input_text.away_location_name
      data:
        value: '{{ away_name }}'
    - action: homeassistant.update_entity
      target:
        entity_id: sensor.away_weather_forecast
    - delay: 00:00:05
    - variables:
        away_icon: "{% set p = state_attr('sensor.away_weather_forecast', 'precipitation_probability_max')[1]
          | int(0) %}{% if p > 70 %}\U0001F327️{% elif p > 40 %}⛅{% elif p > 20 %}\U0001F324️{%
          else %}☀️{% endif %}"
        notif_message: "{{ notif_message }}\n\n─────────────\n\U0001F4CD {{ away_name
          }}\n{{ away_icon }} {{ away_person_name }}'s location\n\n\U0001F321️  High
          {{ state_attr('sensor.away_weather_forecast', 'temperature_2m_max')[1] |
          round | int }}°C  ·  Low {{ state_attr('sensor.away_weather_forecast', 'temperature_2m_min')[1]
          | round | int }}°C\n\U0001F327️  Rain: {{ state_attr('sensor.away_weather_forecast',
          'precipitation_probability_max')[1] | round | int }}%  ({{ state_attr('sensor.away_weather_forecast',
          'precipitation_sum')[1] | round(1) }}mm)\n\U0001F4A8  Wind: {{ state_attr('sensor.away_weather_forecast',
          'wind_speed_10m_max')[1] | round | int }} km/h"
  - action: notify.send_message
    target:
      entity_id: notify.np3
    data:
      title: '{{ notif_title }}'
      message: '{{ notif_message }}'
  - action: notify.send_message
    target:
      entity_id: notify.pixel_6a
    data:
      title: '{{ notif_title }}'
      message: '{{ notif_message }}'
  mode: single
  variables:
    colm_dist: '{{ distance(''person.colm_finn'', ''zone.home'') | float(0) }}'
    olivia_dist: '{{ distance(''person.olivia_finn'', ''zone.home'') | float(0) }}'
