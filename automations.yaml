- id: '1778187447645'
  alias: Frigate - Disk Space Warning
  description: Alert when Frigate LXC disk usage exceeds 85%
  triggers:
  - platform: numeric_state
    entity_id: sensor.frigate_cctv_disk_usage
    above: 85
    for:
      minutes: 5
  conditions: []
  actions:
  - variables:
      alert_time: '{{ as_local(trigger.to_state.last_changed).strftime(''%H:%M'')
        }}'
  - if:
    - condition: time
      after: 07:00:00
      before: '22:00:00'
    then:
    - data:
        title: Frigate - Disk Space Warning
        message: Frigate CCTV disk is at {{ states('sensor.frigate_cctv_disk_usage')
          }}%. Check recording retention before storage fills up.
      action: notify.send_message
      target:
        entity_id: notify.np3
    else:
    - wait_for_trigger:
      - platform: time
        at: 07:00:00
    - data:
        title: Frigate - Disk Space Warning (triggered {{ alert_time }})
        message: Frigate CCTV disk is at {{ states('sensor.frigate_cctv_disk_usage')
          }}%. Check recording retention before storage fills up.
      action: notify.send_message
      target:
        entity_id: notify.np3
  mode: single
- id: '1778187449238'
  alias: Frigate - System Offline
  description: Alert when the Frigate LXC container goes offline
  triggers:
  - platform: state
    entity_id: binary_sensor.lxc_docker_frigate_107_status
    from: 'on'
    to: 'off'
