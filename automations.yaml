  description: Controls office ceiling light based on presence sensor. Turns on when
    occupied, dims after 2 minutes of no presence then turns off.
  use_blueprint:
    path: MajorLazer2142/Clean_and_Simple_Universal_Occupancy_Lighting_for_PIR_and_Radar_Sensors.yaml
