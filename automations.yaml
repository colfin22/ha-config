  actions:
  - variables:
      level: '{{ trigger.to_state.state }}'
      headline: '{{ states(''sensor.met_eireann_warning_headline'') }}'
      expiry: '{{ states(''sensor.met_eireann_warning_expiry'') }}'
      severity: '{{ states(''sensor.met_eireann_warning_severity'') }}'
      kind: '{{ states(''sensor.met_eireann_warning_kind'') }}'
