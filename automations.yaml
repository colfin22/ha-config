- id: '1738945275489'
  alias: Bins Out Notification
  description: Notify which bins to put out the night before collection, listing all
    bin types due that day
  triggers:
  - platform: calendar
    event: start
    offset: '-2:0:0'
    entity_id: calendar.panda_waste
  conditions: []
  actions:
  - action: calendar.get_events
    target:
      entity_id: calendar.panda_waste
    data:
      start_date_time: '{{ (now() + timedelta(hours=2)).strftime(''%Y-%m-%d'') }}T00:00:00'
      end_date_time: '{{ (now() + timedelta(hours=2)).strftime(''%Y-%m-%d'') }}T23:59:59'
    response_variable: collections
  - variables:
      bins: '{{ collections[''calendar.panda_waste''][''events''] | map(attribute=''summary'')
        | list | join('' & '') }}'
  - action: notify.send_message
    target:
      entity_id:
      - notify.np3
      - notify.pixel_6a
    data:
      title: Bins Out Tonight
      message: '{{ bins }} collection tomorrow morning — put the bins out before you
        go to bed.'
  mode: single
- id: '1767011232807'
  alias: Brother Printer Auto Power Cycle
  description: Checks every 15 minutes (07:00–21:00) if the Brother printer is offline.
    If so, power-cycles the socket with a 10s delay to reboot it.
  triggers:
  - minutes: '15'
    platform: time_pattern
  conditions:
  - condition: time
    after: 07:00:00
    before: '21:00:00'
    weekday:
    - mon
    - tue
    - wed
    - thu
    - fri
    - sat
    - sun
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: binary_sensor.brother_printer
        state: 'on'
      sequence: []
    - conditions:
      - condition: state
        entity_id: binary_sensor.brother_printer
        state: 'off'
      sequence:
      - target:
          entity_id: switch.brother_printer_socket
        action: switch.turn_off
      - delay: 00:00:10
      - target:
          entity_id: switch.brother_printer_socket
        action: switch.turn_on
  mode: single
- id: '1767042274860'
