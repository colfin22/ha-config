    a fanfare and announce his return on all speakers.
  triggers:
  - id: frigate
    platform: state
    entity_id: sensor.frigate_colm_last_camera
    to: Doorbell
  - id: arrived_home
    platform: state
    entity_id: person.colm_finn
    from: not_home
    to: home
  conditions:
  - condition: or
    conditions:
    - condition: and
      conditions:
      - condition: trigger
        id: frigate
      - condition: state
        entity_id: person.colm_finn
        state: not_home
      - condition: template
