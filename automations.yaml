        | default(0) | round | int }}°C\n\U0001F327️  Rain: {{ fc.precipitation_probability
        | default(0) | round | int }}%  ({{ fc.precipitation | default(0) | round(1)
        }}mm)\n\U0001F4A8  Wind: {{ fc.wind_speed | default(0) | round | int }} km/h"
  - if:
    - condition: template
      value_template: '{{ someone_away }}'
    then:
    - action: input_number.set_value
      target:
        entity_id: input_number.away_lat
      data:
        value: '{{ away_lat }}'
    - action: input_number.set_value
      target:
        entity_id: input_number.away_lon
      data:
        value: '{{ away_lon }}'
    - action: rest_command.get_away_location_name
      data:
        lat: '{{ away_lat }}'
