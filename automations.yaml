        {% if expiry not in [''none'',''unknown'',''unavailable'',''''] %}Expires:
        {{ as_local(as_datetime(expiry)).strftime(''%H:%M %d/%m/%Y'') }}{% endif %}'
      data:
        clickAction: https://www.met.ie/warnings
        url: https://www.met.ie/warnings
        notification_icon: mdi:weather-lightning-rainy
  - action: notify.mobile_app_pixel_6a
    data:
      title: ⚠️ Met Éireann {{ level }} {{ kind }}
      message: '{{ headline }}

        Severity: {{ level }} / {{ severity }}

        {% if expiry not in [''none'',''unknown'',''unavailable'',''''] %}Expires:
        {{ as_local(as_datetime(expiry)).strftime(''%H:%M %d/%m/%Y'') }}{% endif %}'
      data:
        clickAction: https://www.met.ie/warnings
        url: https://www.met.ie/warnings
        notification_icon: mdi:weather-lightning-rainy
