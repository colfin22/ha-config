          entity_id: light.aoife_ceiling
- id: '1780820971979'
  alias: Restic Backup Failure Notification
  description: Receives webhook from TrueNAS restic backup scripts on failure. Notifies
    NP3 immediately 07:00-22:00, holds until 07:00 overnight.
  triggers:
  - platform: webhook
    webhook_id: restic-backup-failed
    local_only: true
    allowed_methods:
    - POST
  actions:
  - variables:
      alert_time: '{{ now().strftime(''%H:%M'') }}'
      dataset: '{{ trigger.json.dataset | default(''unknown'') }}'
  - if:
    - condition: time
      after: 07:00:00
      before: '22:00:00'
    then:
    - action: notify.send_message
      target:
        entity_id: notify.np3
      data:
        title: 'Restic backup failed: {{ dataset }}'
        message: The restic backup for {{ dataset }} on TrueNAS failed. Check /mnt/MainPool/logs/restic_{{
          dataset }}.log
    else:
    - wait_for_trigger:
      - platform: time
        at: 07:00:00
    - action: notify.send_message
      target:
        entity_id: notify.np3
      data:
        title: 'Restic backup failed: {{ dataset }} (triggered {{ alert_time }})'
        message: The restic backup for {{ dataset }} on TrueNAS failed. Check /mnt/MainPool/logs/restic_{{
          dataset }}.log
  mode: parallel
  max: 10
