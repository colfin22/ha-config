- id: '1784292024444'
  alias: Infra Dashboard - Update Tuesday Mark Done
  description: 'Webhook from the infra dashboard Updates tab toggles input_boolean.update_tuesday_done.
    When it lands ON: ends the maintenance window (maintenance_mode off) THEN kicks
    the applied-report generator on the Proxmox host. The dashboard page refuses the
