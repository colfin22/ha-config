  - action: media_player.play_media
    target:
      entity_id:
      - media_player.sitting_room_speaker_cast
      - media_player.kitchen_display_cast
    data:
      media_content_id: https://gn8w3cihiq4zou7b957rm67avh98n4uw.ui.nabu.casa/local/trumpet_fanfare.mp3
      media_content_type: music
  - delay: 00:00:20
  - action: tts.cloud_say
