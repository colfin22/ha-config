- id: '1773057607414'
  alias: Office Hue Dimmer Switch
  description: Maps the Philips Hue dimmer switch in the office to light.office_ceiling
    via Z2M. On/off, brightness step ±10%, long-press up for full brightness.
  use_blueprint:
    path: EPMatt/philips_324131092621.yaml
    input:
      integration: Zigbee2MQTT
      controller_device: f8d2538f89c131fa7bb7ecfc1eb0c502
      helper_last_controller_event: input_text.office_dimmer_helper_last_controller_event
      action_button_on_short:
      - action: script.cycle_scenes
        data:
          light: light.office
          index_helper: input_number.office_scene_index
          scenes:
          - scene.office_dimmed
          - scene.office_bright
      action_button_on_long:
      - action: light.turn_off
        metadata: {}
        target:
          entity_id: light.office_ceiling
        data:
          transition: 2
      action_button_off_short:
      - action: light.turn_off
        metadata: {}
        target:
          entity_id: light.office_ceiling
        data:
          transition: 2
      action_button_up_short:
      - action: light.turn_on
        target:
          entity_id: light.office_ceiling
        data:
          brightness_step_pct: 15
      action_button_up_long:
      - action: light.turn_on
        target:
          entity_id: light.office_ceiling
        data:
          brightness_step_pct: 30
      action_button_down_short:
      - action: light.turn_on
        target:
          entity_id: light.office_ceiling
        data:
          brightness_step_pct: -15
      action_button_down_long:
      - action: light.turn_on
        target:
          entity_id: light.office_ceiling
        data:
          brightness_step_pct: -30
- id: '1775750149545'
  alias: Smart Parcel Box Notification
  description: 'Notifies both phones and announces via TTS when a parcel is delivered
    to the smart box, attaching the latest Frigate doorbell person snapshot when it
    is fresh (<60s). Uses front door contact within 30s to classify a collection instead;
    collections only stamp the datetime. Rebuilt from the eroak/smart-mailbox blueprint
    for ha-config #28.'
  triggers:
  - trigger: state
    entity_id: binary_sensor.parcel_delivery_box_contact
    from: 'off'
    to: 'on'
  actions:
  - alias: Wait before determining if it's a deposit or collection
    delay: '{{ timeout_in_seconds }}'
  - if:
    - alias: Front door did not open within the timeout window
      condition: template
      value_template: '{{ ((triggered_at - as_timestamp(states[''binary_sensor.front_door_contact''].last_changed))
        | round | abs) > timeout_in_seconds }}'
    then:
    - action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.parcel_box_last_delivery
      data:
        timestamp: '{{ triggered_at }}'
    - variables:
        snapshot_fresh: '{% set img = states[''image.doorbell_person''] %}{{ img is
          not none and ((triggered_at - as_timestamp(img.last_changed)) | abs) < 60
          }}'
    - if:
      - alias: Doorbell person snapshot is fresh
        condition: template
        value_template: '{{ snapshot_fresh }}'
      then:
      - action: notify.mobile_app_np3
        data:
          message: A Package Has Been Delivered!
          data:
            image: /api/image_proxy/image.doorbell_person?t={{ triggered_at | int
              }}
            notification_icon: mdi:package-variant-closed
      - action: notify.mobile_app_pixel_6a
        data:
          message: A Package Has Been Delivered!
          data:
            image: /api/image_proxy/image.doorbell_person?t={{ triggered_at | int
              }}
            notification_icon: mdi:package-variant-closed
      else:
      - action: notify.mobile_app_np3
        data:
          message: A Package Has Been Delivered!
          data:
            notification_icon: mdi:package-variant-closed
      - action: notify.mobile_app_pixel_6a
        data:
          message: A Package Has Been Delivered!
          data:
            notification_icon: mdi:package-variant-closed
    - action: script.tts_announce
      data:
        message: A Package Has Been Delivered!
    else:
    - action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.parcel_box_last_collection
      data:
        timestamp: '{{ triggered_at }}'
  mode: single
  variables:
    triggered_at: '{{ as_timestamp(now()) }}'
    timeout_in_seconds: 30
- id: '1776515291123'
