      %p'') }}'
    camera_count: '{{ states(''sensor.frigate_overnight_camera_count'') | int(0) }}'
- id: '1778228718912'
  alias: Energy - Snapshot Daily Totals
  description: At 23:58 each night, saves today's energy sensor values to helpers
    so they can be read the next morning.
  triggers:
  - platform: time
    at: '23:58:00'
  actions:
  - target:
      entity_id: input_number.yesterday_solar_generated
    data:
      value: '{{ states(''sensor.myenergi_eddi_generated_today'') | float(0) }}'
    action: input_number.set_value
  - target:
      entity_id: input_number.yesterday_grid_import
    data:
      value: '{{ states(''sensor.myenergi_eddi_grid_import_today'') | float(0) }}'
    action: input_number.set_value
  - target:
      entity_id: input_number.yesterday_grid_export
    data:
      value: '{{ states(''sensor.myenergi_eddi_grid_export_today'') | float(0) }}'
    action: input_number.set_value
  - target:
      entity_id: input_number.yesterday_import_cost
    data:
      value: '{% set n = states(''input_number.import_kwh_at_8am'') | float(0) %}{%
        set d = (states(''input_number.import_kwh_at_5pm'') | float(0)) - n %}{% set
        p = (states(''input_number.import_kwh_at_7pm'') | float(0)) - (states(''input_number.import_kwh_at_5pm'')
        | float(0)) %}{% set e = (states(''input_number.import_kwh_at_11pm'') | float(0))
        - (states(''input_number.import_kwh_at_7pm'') | float(0)) %}{% set ln = [states(''sensor.myenergi_eddi_grid_import_today'')
        | float(0) - states(''input_number.import_kwh_at_11pm'') | float(0), 0] |
        max %}{{ [n * 0.20 + d * 0.37 + p * 0.39 + e * 0.37 + ln * 0.20, 0] | max
        | round(4) }}'
    action: input_number.set_value
  - target:
      entity_id: input_number.yesterday_export_compensation
    data:
      value: '{{ (states(''sensor.myenergi_eddi_grid_export_today'') | float(0) *
        0.19) | round(4) }}'
    action: input_number.set_value
  - target:
      entity_id: input_number.yesterday_eddi_diverted
    data:
      value: '{{ states(''sensor.myenergi_eddi_green_energy_today'') | float(0) }}'
    action: input_number.set_value
  mode: single
- id: '1778228723586'
  alias: Energy - Daily Summary Notification
  description: At 8am each morning, sends a summary of yesterday's solar and electricity
    to NP3.
  triggers:
  - platform: time
    at: 07:45:00
  actions:
  - action: notify.send_message
    target:
      entity_id: notify.np3
    data:
      title: ⚡ Energy Summary — {{ day_name }}
      message: "{% if solar >= 15 %}☀️{% elif solar >= 8 %}\U0001F324️{% elif solar
        >= 3 %}⛅{% else %}\U0001F325️{% endif %} Solar: {{ solar | round(2) }} kWh\n\U0001F525
        Eddi: {{ eddi | round(2) }} kWh\n\U0001F7E2 Exported: {{ exported | round(2)
        }} kWh  (+€{{ export_comp | round(2) }})\n\U0001F534 Imported: {{ imported
        | round(2) }} kWh  (€{{ import_cost | round(2) }})\n{% if net_cost <= 0 %}\U0001F49A
        Saved: €{{ (net_cost * -1) | round(2) }}{% else %}\U0001F4B8 Net cost: €{{
        net_cost | round(2) }}{% endif %}"
  - action: notify.send_message
    target:
      entity_id: notify.pixel_6a
    data:
      title: ⚡ Energy Summary — {{ day_name }}
      message: "{% if solar >= 15 %}☀️{% elif solar >= 8 %}\U0001F324️{% elif solar
        >= 3 %}⛅{% else %}\U0001F325️{% endif %} Solar: {{ solar | round(2) }} kWh\n\U0001F525
        Eddi: {{ eddi | round(2) }} kWh\n\U0001F7E2 Exported: {{ exported | round(2)
        }} kWh  (+€{{ export_comp | round(2) }})\n\U0001F534 Imported: {{ imported
        | round(2) }} kWh  (€{{ import_cost | round(2) }})\n{% if net_cost <= 0 %}\U0001F49A
        Saved: €{{ (net_cost * -1) | round(2) }}{% else %}\U0001F4B8 Net cost: €{{
        net_cost | round(2) }}{% endif %}"
  variables:
    solar: '{{ states(''input_number.yesterday_solar_generated'') | float(0) }}'
    imported: '{{ states(''input_number.yesterday_grid_import'') | float(0) }}'
    exported: '{{ states(''input_number.yesterday_grid_export'') | float(0) }}'
    import_cost: '{{ states(''input_number.yesterday_import_cost'') | float(0) }}'
    export_comp: '{{ states(''input_number.yesterday_export_compensation'') | float(0)
      }}'
    eddi: '{{ states(''input_number.yesterday_eddi_diverted'') | float(0) }}'
    net_cost: '{{ (states(''input_number.yesterday_import_cost'') | float(0)) - (states(''input_number.yesterday_export_compensation'')
      | float(0)) }}'
    day_name: '{{ (now() - timedelta(days=1)).strftime(''%A'') }}'
  mode: single
- id: '1778234345312'
  alias: Doorbell - Hello Olivia TTS
  description: When Olivia is detected at the doorbell between 1pm and 2pm on weekdays,
