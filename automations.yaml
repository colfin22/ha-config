      away_lon: '{{ state_attr(''person.colm_finn'', ''longitude'') if colm_dist >
        100 else state_attr(''person.olivia_finn'', ''longitude'') }}'
      away_person_name: '{{ ''Colm'' if colm_dist > 100 else ''Olivia'' }}'
  - variables:
      icon: "{% set icons = {'sunny': '☀️', 'clear-night': '\U0001F319', 'partlycloudy':
        '⛅', 'cloudy': '☁️', 'rainy': '\U0001F327️', 'pouring': '\U0001F30A', 'snowy':
