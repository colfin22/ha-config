- id: '1778443033804'
  alias: Appliances - Increment Weekly Cycle Counters
  description: Increments the weekly cycle counter for whichever appliance just finished
    a cycle
  triggers:
  - platform: state
    entity_id: input_select.dishwasher_run_status
    to: All Done!
    id: dishwasher
  - platform: state
    entity_id: input_select.washing_machine_run_status
    to: All Done!
    id: washing_machine
  - platform: state
    entity_id: input_select.tumble_dryer_run_status
    to: All Done!
    id: tumble_dryer
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: dishwasher
      sequence:
      - action: counter.increment
        target:
          entity_id: counter.dishwasher_weekly_cycles
    - conditions:
      - condition: trigger
        id: washing_machine
      sequence:
      - action: counter.increment
        target:
          entity_id: counter.washing_machine_weekly_cycles
    - conditions:
      - condition: trigger
        id: tumble_dryer
      sequence:
      - action: counter.increment
        target:
          entity_id: counter.tumble_dryer_weekly_cycles
