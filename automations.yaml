      data:
        title: "\U0001F6A8 Person Detected Overnight"
        message: 'Person spotted on {{ best_camera }} at {{ best_time }}{% if camera_count
          > 1 %} (+{{ camera_count - 1 }} other camera{{ ''s'' if camera_count > 2
          else '''' }}){% endif %}{% if other_line != '''' %}


          Also overnight: {{ other_line }}{% endif %}'
    - action: notify.send_message
      target:
        entity_id: notify.pixel_6a
      data:
        title: "\U0001F6A8 Person Detected Overnight"
        message: 'Person spotted on {{ best_camera }} at {{ best_time }}{% if camera_count
          > 1 %} (+{{ camera_count - 1 }} other camera{{ ''s'' if camera_count > 2
          else '''' }}){% endif %}{% if other_line != '''' %}


          Also overnight: {{ other_line }}{% endif %}'
    else:
    - action: notify.send_message
      target:
        entity_id: notify.np3
      data:
        title: "\U0001F7E2 All Clear Overnight — {{ now().strftime('%A %-d %B') }}"
        message: 'No people detected on any camera.{% if other_line != '''' %}


          Also spotted: {{ other_line }}{% else %}

          No other activity detected.{% endif %}'
    - action: notify.send_message
      target:
        entity_id: notify.pixel_6a
      data:
        title: "\U0001F7E2 All Clear Overnight — {{ now().strftime('%A %-d %B') }}"
        message: 'No people detected on any camera.{% if other_line != '''' %}


          Also spotted: {{ other_line }}{% else %}

          No other activity detected.{% endif %}'
