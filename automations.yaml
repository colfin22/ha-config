- id: '1779099403072'
  alias: TrueNAS Problem Alerts
  description: Notify NP3 on TrueNAS problem states only — success/info states like
    FINISHED are ignored
  triggers:
  - entity_id: binary_sensor.truenas_system_mainpool_healthy
    to: 'off'
    platform: state
  - entity_id: binary_sensor.truenas_system_boot_pool_healthy
    to: 'off'
    platform: state
  - entity_id: sensor.truenas_snapshot_tasks_mainpool
    to:
    - ERROR
    - FAILED
    - ABORTED
    platform: state
  - entity_id:
    - sensor.truenas_disks_sda
    - sensor.truenas_disks_sdb
    - sensor.truenas_disks_sdc
    - sensor.truenas_disks_sdd
    - sensor.truenas_disks_sde
    above: 45
    platform: numeric_state
    for: 00:05:00
  - platform: state
    entity_id: binary_sensor.truenas_rsync_failures
    to: 'on'
  actions:
  - variables:
      alert_time: '{{ as_local(trigger.to_state.last_changed).strftime(''%H:%M'')
        }}'
  - if:
    - condition: time
      after: 07:00:00
      before: '22:00:00'
    then:
    - action: notify.send_message
      data:
        title: TrueNAS Alert
        message: '{% if trigger.entity_id == ''binary_sensor.truenas_system_mainpool_healthy''
          %}MainPool is unhealthy — check pool status immediately{% elif trigger.entity_id
          == ''binary_sensor.truenas_system_boot_pool_healthy'' %}Boot pool is unhealthy
          — check boot pool status{% elif trigger.entity_id == ''sensor.truenas_snapshot_tasks_mainpool''
          %}Snapshot task failed — status: {{ trigger.to_state.state }}{% elif trigger.entity_id
          == ''binary_sensor.truenas_rsync_failures'' %}Rsync task failure — {{ states(''sensor.truenas_rsync_failed_paths'')
          }}{% else %}Disk temperature warning: {{ trigger.to_state.name }} is {{
          trigger.to_state.state | round(0) | int }}°C{% endif %}'
      target:
        entity_id: notify.np3
    else:
    - wait_for_trigger:
      - platform: time
        at: 07:00:00
    - action: notify.send_message
      data:
        title: TrueNAS Alert (triggered {{ alert_time }})
        message: '{% if trigger.entity_id == ''binary_sensor.truenas_system_mainpool_healthy''
          %}MainPool is unhealthy — check pool status immediately{% elif trigger.entity_id
          == ''binary_sensor.truenas_system_boot_pool_healthy'' %}Boot pool is unhealthy
          — check boot pool status{% elif trigger.entity_id == ''sensor.truenas_snapshot_tasks_mainpool''
          %}Snapshot task failed — status: {{ trigger.to_state.state }}{% elif trigger.entity_id
          == ''binary_sensor.truenas_rsync_failures'' %}Rsync task failure — {{ states(''sensor.truenas_rsync_failed_paths'')
          }}{% else %}Disk temperature warning: {{ trigger.to_state.name }} is {{
          trigger.to_state.state | round(0) | int }}°C{% endif %}'
      target:
        entity_id: notify.np3
  mode: single
