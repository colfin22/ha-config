- id: '1778443028904'
  alias: Appliances - Reset Weekly Cycle Counters
  description: Resets all 3 appliance weekly cycle counters every Monday at midnight
  triggers:
  - platform: time
    at: 00:00:00
  conditions:
  - condition: time
    weekday:
    - mon
  actions:
  - action: counter.reset
    target:
      entity_id:
      - counter.dishwasher_weekly_cycles
      - counter.washing_machine_weekly_cycles
      - counter.tumble_dryer_weekly_cycles
