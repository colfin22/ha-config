- id: '1783159541803'
  alias: Peak/Evening Rate - Appliance Started Nudge
  description: 'If the washing machine, tumble dryer or dishwasher starts a cycle
    during the expensive evening (5-11pm), push to Colm + Olivia. The message names
    the band actually in force: 39c/kWh during the 5-7pm peak, 37c from 7-11pm. Points
    at the biggest saving available: tomorrow''s morning solar if the combined forecast
    is >= 10 kWh, otherwise the 23:00-08:00 night rate at 20c. Window widened from
    5-7pm to 5-11pm on 05-08-2026 (Colm) - the whole evening is dear, not just the
    peak two hours. Notification-only (no TTS).'
  triggers:
  - platform: state
    entity_id: input_select.washing_machine_run_status
    to: Washing
  - platform: state
    entity_id: input_select.tumble_dryer_run_status
    to: Drying
  - platform: state
    entity_id: input_select.dishwasher_run_status
    to: Scrubbing Away!
  conditions:
  - condition: time
    after: '17:00:00'
    before: '23:00:00'
  actions:
  - variables:
      appliance: '{{ {''input_select.washing_machine_run_status'':''washing machine'',''input_select.tumble_dryer_run_status'':''tumble
        dryer'',''input_select.dishwasher_run_status'':''dishwasher''}[trigger.entity_id]
        }}'
      solar_tomorrow: '{{ (states(''sensor.energy_production_tomorrow'') | float(0)
        + states(''sensor.energy_production_tomorrow_2'') | float(0)) | round(1) }}'
      band: '{{ ''the 5-7pm peak (39c/kWh)'' if now().hour < 19 else ''the evening
        rate (37c/kWh)'' }}'
  - variables:
      nudge_message: The {{ appliance }} started during {{ band }}. {% if solar_tomorrow
        | float(0) >= 10 %}Better left until the morning, when solar usually covers
        it for nothing ({{ solar_tomorrow }} kWh forecast tomorrow).{% else %}Better
        left until after 11pm, when the night rate drops to 20c - only {{ solar_tomorrow
        }} kWh of solar forecast tomorrow.{% endif %}
  - data:
      title: 'Expensive time: {{ appliance }} running'
      message: '{{ nudge_message }}'
      data:
        tag: peak_appliance_nudge
        channel: Energy
        notification_icon: mdi:flash-alert
    action: notify.mobile_app_np3
  - data:
      title: 'Expensive time: {{ appliance }} running'
      message: '{{ nudge_message }}'
      data:
        tag: peak_appliance_nudge
        channel: Energy
        notification_icon: mdi:flash-alert
    action: notify.mobile_app_pixel_6a
  mode: queued
  max: 3
- id: '1784209486509'
