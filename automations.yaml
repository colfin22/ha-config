  - variables:
      sitting_room_vol: '{{ state_attr(''media_player.sitting_room_speaker_cast'',
        ''volume_level'') }}'
      kitchen_display_vol: '{{ state_attr(''media_player.kitchen_display_cast'', ''volume_level'')
        }}'
  - action: media_player.volume_set
    target:
