- id: '1782548125867'
  alias: Cat Alarm - Kitchen TV Lightstrip Green
  description: When input_boolean.cat_alarm turns on, snapshot the Kitchen TV Lightstrip
    then set it green; restore the snapshot when the alarm turns off. mode:queued
    so a quick disarm right after arming is never dropped; the snapshot is skipped
    when the strip is already alarm-green so the restore point can never be poisoned
    to green.
  triggers:
  - platform: state
    entity_id: input_boolean.cat_alarm
    to: 'on'
    id: enabled
  - platform: state
    entity_id: input_boolean.cat_alarm
    to: 'off'
    id: disabled
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: enabled
      sequence:
      - if:
        - condition: template
          value_template: '{{ not (is_state(''light.kitchen_tv_lightstrip'',''on'')
            and (state_attr(''light.kitchen_tv_lightstrip'',''hs_color'') or [0,0])[0]
            | float(0) > 90 and (state_attr(''light.kitchen_tv_lightstrip'',''hs_color'')
            or [0,0])[0] | float(0) < 150 and (state_attr(''light.kitchen_tv_lightstrip'',''hs_color'')
            or [0,0])[1] | float(0) > 50) }}'
        then:
        - data:
            scene_id: cat_alarm_lightstrip_restore
            snapshot_entities:
            - light.kitchen_tv_lightstrip
          action: scene.create
      - target:
          entity_id: light.kitchen_tv_lightstrip
        data:
          rgb_color:
          - 0
          - 255
          - 0
          brightness_pct: 100
        action: light.turn_on
    - conditions:
      - condition: trigger
        id: disabled
      sequence:
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ states(''scene.cat_alarm_lightstrip_restore'') not
              in [''unknown'',''unavailable''] }}'
          sequence:
          - target:
              entity_id: scene.cat_alarm_lightstrip_restore
            action: scene.turn_on
        default:
        - target:
            entity_id: light.kitchen_tv_lightstrip
          action: light.turn_off
  mode: queued
  max: 3
- id: '1782929355416'
  alias: Frost Warning - Car Windscreen
  description: 'Weekday 07:30 check: if the lower of Met.no/Met Eireann outdoor temp
    is <=0C, push both phones to allow time to scrape the windscreen.'
  triggers:
  - platform: time
    at: 07:30:00
  conditions:
  - condition: time
    weekday:
    - mon
    - tue
    - wed
    - thu
    - fri
  - condition: template
    value_template: '{% set t1 = state_attr(''weather.forecast_home_2'',''temperature'')
      %}{% set t2 = state_attr(''weather.forecast_home'',''temperature'') %}{% set
      temps = [t1, t2] | reject(''none'') | list %}{{ (temps | min) <= 0 if temps
      | count > 0 else false }}'
  actions:
  - data:
      title: ❄️ Frost warning
      message: It's {{ tmin }}°C out — the car windscreen will be iced. Allow extra
        time to scrape before you leave.
      data:
        notification_icon: mdi:snowflake-alert
    action: notify.mobile_app_np3
  - data:
      title: ❄️ Frost warning
      message: It's {{ tmin }}°C out — the car windscreen will be iced. Allow extra
        time to scrape before you leave.
      data:
        notification_icon: mdi:snowflake-alert
    action: notify.mobile_app_pixel_6a
  mode: single
  variables:
    tmin: '{% set t1 = state_attr(''weather.forecast_home_2'',''temperature'') %}{%
      set t2 = state_attr(''weather.forecast_home'',''temperature'') %}{% set temps
      = [t1, t2] | reject(''none'') | list %}{{ temps | min if temps | count > 0 else
      ''below zero'' }}'
