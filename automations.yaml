- id: '1778240499637'
  alias: Zigbee2MQTT Down - Restart & Notify NP3
  description: 'If Z2M bridge drops: full stop -> wait (lets coordinator NCP/TCP recover)
    -> start, two escalating cycles. Notify immediately 07:00-22:00, else queue a
    morning notification with time + outcome. If still down after both cycles the
    Sonoff coordinator (10.0.0.214) likely needs a power-cycle.'
  triggers:
  - platform: state
    entity_id: binary_sensor.zigbee2mqtt_bridge_connection_state
    to: 'off'
  - platform: state
    entity_id: binary_sensor.zigbee2mqtt_bridge_connection_state
    to: unavailable
  conditions: []
  actions:
  - variables:
      triggered_at: '{{ now().strftime(''%d %b at %H:%M'') }}'
  - delay:
      minutes: 2
  - condition: state
    entity_id: binary_sensor.zigbee2mqtt_bridge_connection_state
    state:
    - 'off'
    - unavailable
  - action: hassio.addon_stop
    data:
      addon: 45df7312_zigbee2mqtt
  - delay:
      seconds: 45
  - action: hassio.addon_start
    data:
      addon: 45df7312_zigbee2mqtt
  - delay:
      seconds: 75
  - choose:
    - conditions:
      - condition: state
        entity_id: binary_sensor.zigbee2mqtt_bridge_connection_state
        state:
        - 'off'
        - unavailable
      sequence:
      - action: hassio.addon_stop
        data:
          addon: 45df7312_zigbee2mqtt
      - delay:
          seconds: 90
      - action: hassio.addon_start
        data:
          addon: 45df7312_zigbee2mqtt
      - delay:
          seconds: 75
  - variables:
      outcome: '{{ ''Recovered successfully'' if is_state(''binary_sensor.zigbee2mqtt_bridge_connection_state'',
        ''on'') else ''STILL DOWN after 2 stop/start cycles - Sonoff coordinator (10.0.0.214)
        likely needs a power-cycle'' }}'
  - choose:
    - conditions:
      - condition: time
        after: 07:00:00
        before: '22:00:00'
      sequence:
      - action: notify.send_message
        data:
          title: Zigbee2MQTT Restarted
          message: 'Went down at {{ triggered_at }}. Outcome: {{ outcome }}'
        target:
          entity_id: notify.np3
    default:
    - wait_for_trigger:
      - platform: time
        at: 07:00:00
    - action: notify.send_message
      data:
        title: Zigbee2MQTT Overnight Restart
        message: 'Went down at {{ triggered_at }}. Outcome: {{ outcome }}'
      target:
        entity_id: notify.np3
  mode: single
- id: '1778243937781'
  alias: Sitting Room - Power Off After 30min No Presence
