  max: 3
- id: '1778870199308'
  alias: NFC - Night Scene
  description: Scans NFC tag to activate the Kitchen Night scene.
  triggers:
  - platform: tag
    tag_id: 393b5201-6ab5-4b7e-a195-4cd26aa89776
  actions:
  - action: scene.turn_on
    target:
      entity_id: scene.kitchen_night
  mode: single
- id: '1779464893871'
  alias: Landing - Occupancy Lighting
  description: Activates landing light on motion when lux < 20 or light is already
    on. Bright scene from 30min after sunrise to 30min before sunset; dimmed otherwise.
    Timer restarts on re-trigger. Fades to off over 5s.
  triggers:
  - platform: state
    entity_id: binary_sensor.landing_motion_sensor_occupancy
    to: 'on'
  conditions:
  - condition: or
    conditions:
    - condition: numeric_state
      entity_id: sensor.landing_motion_sensor_illuminance
      below: 20
    - condition: state
      entity_id: light.landing_1
      state: 'on'
  actions:
  - choose:
    - conditions:
      - condition: sun
        after: sunrise
        after_offset: 00:30:00
        before: sunset
        before_offset: -00:30:00
      sequence:
      - action: scene.turn_on
        target:
          entity_id: scene.landing_bright
    default:
    - action: scene.turn_on
      target:
        entity_id: scene.landing_dimmed
  - delay: 00:02:55
  - action: light.turn_on
    target:
      entity_id: light.landing_1
    data:
      brightness: 1
      transition: 5
  - delay: 00:00:05
  - action: light.turn_off
    target:
      entity_id: light.landing_1
  mode: restart
