          > 259200 }}'
    - condition: and
      conditions:
      - condition: trigger
        id: arrived_home
      - condition: template
        value_template: '{{ (now() - trigger.from_state.last_changed).total_seconds()
          > 259200 }}'
  actions:
  - delay:
