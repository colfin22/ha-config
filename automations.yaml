- id: '1778225960347'
  alias: Cameras - Overnight Summary
  description: At 7am sends an overnight camera summary. If the Frigate overnight
    sensor is unavailable it says so rather than sending a false all-clear (added
    03-08-2026 after the sensor was down for two days and the automation reported
    All Clear off no data). If a person was detected, sends a high-priority alert
    with a snapshot and notes any other animals spotted. If no person, sends an all-clear
    with any cats, dogs or birds mentioned.
  triggers:
  - platform: time
    at: 07:00:00
  actions:
  - variables:
      other_line: "{% set midnight = today_at('00:00') | as_timestamp %}{% set cat_n
        = namespace(n=0) %}{% for img in ['image.doorbell_cat','image.front_car_cat','image.front_van_cat','image.rear_door_cat','image.rear_shed_cat']
        %}{% if states(img) not in ('unknown','unavailable') and as_timestamp(states(img),
        0) > midnight %}{% set cat_n.n = cat_n.n + 1 %}{% endif %}{% endfor %}{% set
        dog_n = namespace(n=0) %}{% for img in ['image.doorbell_dog','image.front_car_dog','image.front_van_dog','image.rear_door_dog','image.rear_shed_dog']
        %}{% if states(img) not in ('unknown','unavailable') and as_timestamp(states(img),
        0) > midnight %}{% set dog_n.n = dog_n.n + 1 %}{% endif %}{% endfor %}{% set
        bird_n = namespace(n=0) %}{% for img in ['image.doorbell_bird','image.front_car_bird','image.front_van_bird','image.rear_door_bird','image.rear_shed_bird']
        %}{% if states(img) not in ('unknown','unavailable') and as_timestamp(states(img),
        0) > midnight %}{% set bird_n.n = bird_n.n + 1 %}{% endif %}{% endfor %}{%
        set fox_n = namespace(n=0) %}{% for img in ['image.doorbell_fox','image.front_car_fox','image.front_van_fox','image.rear_door_fox','image.rear_shed_fox']
        %}{% if states(img) not in ('unknown','unavailable') and as_timestamp(states(img),
        0) > midnight %}{% set fox_n.n = fox_n.n + 1 %}{% endif %}{% endfor %}{% set
        parts = namespace(list=[]) %}{% if cat_n.n > 0 %}{% set parts.list = parts.list
        + ['\U0001F431 Cat' + (' ×' + cat_n.n | string if cat_n.n > 1 else '')] %}{%
        endif %}{% if dog_n.n > 0 %}{% set parts.list = parts.list + ['\U0001F436
        Dog' + (' ×' + dog_n.n | string if dog_n.n > 1 else '')] %}{% endif %}{% if
        fox_n.n > 0 %}{% set parts.list = parts.list + ['\U0001F98A Fox' + (' ×' +
        fox_n.n | string if fox_n.n > 1 else '')] %}{% endif %}{% if bird_n.n > 0
        %}{% set parts.list = parts.list + ['\U0001F426 Bird' + (' ×' + bird_n.n |
        string if bird_n.n > 1 else '')] %}{% endif %}{{ parts.list | join('  ·  ')
        }}"
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ not sensor_ok }}'
      sequence:
      - data:
          title: ⚠️ Overnight check unavailable — {{ now().strftime('%A %-d %B') }}
          message: 'The Frigate overnight sensor wasn''t reporting, so no all-clear
            can be given for last night. Check Frigate and the camera summary sensors.{%
            if other_line != '''' %}


            Animals still seen: {{ other_line }}{% endif %}'
          data:
            notification_icon: mdi:cctv
        action: notify.mobile_app_np3
      - data:
          title: ⚠️ Overnight check unavailable — {{ now().strftime('%A %-d %B') }}
          message: 'The Frigate overnight sensor wasn''t reporting, so no all-clear
            can be given for last night. Check Frigate and the camera summary sensors.{%
            if other_line != '''' %}


            Animals still seen: {{ other_line }}{% endif %}'
          data:
            notification_icon: mdi:cctv
        action: notify.mobile_app_pixel_6a
    - conditions:
      - condition: template
        value_template: '{{ person_count > 0 }}'
      sequence:
      - data:
          title: "\U0001F6A8 Person Detected Overnight"
          message: 'Person spotted on {{ best_camera }} at {{ best_time }}{% if camera_count
            > 1 %} (+{{ camera_count - 1 }} other camera{{ ''s'' if camera_count >
            2 else '''' }}){% endif %}{% if other_line != '''' %}


            Also overnight: {{ other_line }}{% endif %}'
          data:
            notification_icon: mdi:cctv
        action: notify.mobile_app_np3
      - data:
          title: "\U0001F6A8 Person Detected Overnight"
          message: 'Person spotted on {{ best_camera }} at {{ best_time }}{% if camera_count
            > 1 %} (+{{ camera_count - 1 }} other camera{{ ''s'' if camera_count >
            2 else '''' }}){% endif %}{% if other_line != '''' %}


            Also overnight: {{ other_line }}{% endif %}'
          data:
            notification_icon: mdi:cctv
        action: notify.mobile_app_pixel_6a
    default:
    - data:
        title: "\U0001F7E2 All Clear Overnight — {{ now().strftime('%A %-d %B') }}"
        message: 'No people detected on any camera.{% if other_line != '''' %}


          Also spotted: {{ other_line }}{% else %}

          No other activity detected.{% endif %}'
        data:
          notification_icon: mdi:cctv
      action: notify.mobile_app_np3
    - data:
        title: "\U0001F7E2 All Clear Overnight — {{ now().strftime('%A %-d %B') }}"
        message: 'No people detected on any camera.{% if other_line != '''' %}


          Also spotted: {{ other_line }}{% else %}

          No other activity detected.{% endif %}'
        data:
          notification_icon: mdi:cctv
      action: notify.mobile_app_pixel_6a
  variables:
    person_count: '{{ states(''sensor.frigate_overnight_person_count'') | int(0) }}'
    best_camera: '{{ states(''sensor.frigate_overnight_best_camera'') }}'
    best_time: '{{ states(''sensor.frigate_overnight_best_time'') | float(0) | timestamp_custom(''%-I:%M
      %p'') }}'
    camera_count: '{{ states(''sensor.frigate_overnight_camera_count'') | int(0) }}'
    sensor_ok: '{{ states(''sensor.frigate_overnight_person_count'') not in [''unavailable'',
      ''unknown'', ''none''] }}'
  mode: single
- id: '1778228718912'
  alias: Energy - Snapshot Daily Totals
  description: At 23:58 each night, saves today's energy sensor values to helpers
    so they can be read the next morning.
  triggers:
  - platform: time
    at: '23:58:00'
  actions:
  - target:
      entity_id: input_number.yesterday_solar_generated
    data:
      value: '{{ states(''sensor.solis_power_generation_today'') | float(0) }}'
    action: input_number.set_value
  - target:
      entity_id: input_number.yesterday_grid_import
    data:
      value: '{{ states(''sensor.solis_grid_import_today'') | float(0) }}'
    action: input_number.set_value
  - target:
      entity_id: input_number.yesterday_grid_export
    data:
      value: '{{ states(''sensor.solis_grid_export_today'') | float(0) }}'
    action: input_number.set_value
  - target:
      entity_id: input_number.yesterday_import_cost
    data:
      value: '{% set n = states(''input_number.import_kwh_at_8am'') | float(0) %}{%
        set d = (states(''input_number.import_kwh_at_5pm'') | float(0)) - n %}{% set
        p = (states(''input_number.import_kwh_at_7pm'') | float(0)) - (states(''input_number.import_kwh_at_5pm'')
        | float(0)) %}{% set e = (states(''input_number.import_kwh_at_11pm'') | float(0))
        - (states(''input_number.import_kwh_at_7pm'') | float(0)) %}{% set ln = [states(''sensor.solis_grid_import_today'')
        | float(0) - states(''input_number.import_kwh_at_11pm'') | float(0), 0] |
        max %}{{ [n * 0.20 + d * 0.37 + p * 0.39 + e * 0.37 + ln * 0.20, 0] | max
        | round(4) }}'
    action: input_number.set_value
  - target:
      entity_id: input_number.yesterday_export_compensation
    data:
      value: '{{ (states(''sensor.solis_grid_export_today'') | float(0) * 0.19) |
        round(4) }}'
    action: input_number.set_value
  - target:
      entity_id: input_number.yesterday_eddi_diverted
    data:
      value: '{{ states(''sensor.myenergi_eddi_green_energy_today'') | float(0) }}'
    action: input_number.set_value
  mode: single
- id: '1778228723586'
  alias: Energy - Daily Summary Notification
  description: At 8am each morning, sends a summary of yesterday's solar and electricity
    to NP3.
  triggers:
  - platform: time
    at: 07:45:00
  actions:
  - data:
      title: ⚡ Energy Summary — {{ day_name }}
      message: "{% if solar >= 15 %}☀️{% elif solar >= 8 %}\U0001F324️{% elif solar
        >= 3 %}⛅{% else %}\U0001F325️{% endif %} Solar: {{ solar | round(2) }} kWh\n\U0001F525
        Eddi: {{ eddi | round(2) }} kWh\n\U0001F7E2 Exported: {{ exported | round(2)
        }} kWh  (+€{{ export_comp | round(2) }})\n\U0001F534 Imported: {{ imported
        | round(2) }} kWh  (€{{ import_cost | round(2) }})\n{% if net_cost <= 0 %}\U0001F49A
        Saved: €{{ (net_cost * -1) | round(2) }}{% else %}\U0001F4B8 Net cost: €{{
        net_cost | round(2) }}{% endif %}"
      data:
        notification_icon: mdi:home-lightning-bolt
    action: notify.mobile_app_np3
  - data:
      title: ⚡ Energy Summary — {{ day_name }}
      message: "{% if solar >= 15 %}☀️{% elif solar >= 8 %}\U0001F324️{% elif solar
        >= 3 %}⛅{% else %}\U0001F325️{% endif %} Solar: {{ solar | round(2) }} kWh\n\U0001F525
        Eddi: {{ eddi | round(2) }} kWh\n\U0001F7E2 Exported: {{ exported | round(2)
        }} kWh  (+€{{ export_comp | round(2) }})\n\U0001F534 Imported: {{ imported
        | round(2) }} kWh  (€{{ import_cost | round(2) }})\n{% if net_cost <= 0 %}\U0001F49A
        Saved: €{{ (net_cost * -1) | round(2) }}{% else %}\U0001F4B8 Net cost: €{{
        net_cost | round(2) }}{% endif %}"
      data:
        notification_icon: mdi:home-lightning-bolt
    action: notify.mobile_app_pixel_6a
  variables:
    solar: '{{ states(''input_number.yesterday_solar_generated'') | float(0) }}'
    imported: '{{ states(''input_number.yesterday_grid_import'') | float(0) }}'
    exported: '{{ states(''input_number.yesterday_grid_export'') | float(0) }}'
    import_cost: '{{ states(''input_number.yesterday_import_cost'') | float(0) }}'
    export_comp: '{{ states(''input_number.yesterday_export_compensation'') | float(0)
      }}'
    eddi: '{{ states(''input_number.yesterday_eddi_diverted'') | float(0) }}'
    net_cost: '{{ (states(''input_number.yesterday_import_cost'') | float(0)) - (states(''input_number.yesterday_export_compensation'')
      | float(0)) }}'
    day_name: '{{ (now() - timedelta(days=1)).strftime(''%A'') }}'
  mode: single
- id: '1778234345312'
  alias: Doorbell - Hello Olivia TTS
  description: 'When Olivia is face-detected at the doorbell between 1-2pm on weekdays:
    takes a doorbell snapshot, asks LLM Vision (Gemini 2.5-flash) for a short witty
    compliment about how she looks today, then greets her with it on the kitchen +
    sitting-room speakers after a 2-min delay (volume boosted then restored). Falls
    back to a generic greeting if vision fails. Guarded 24-07-2026: only fires if
    Olivia is not already home (face recognition matched Cian as Olivia and greeted
    the wrong child).'
  triggers:
  - platform: state
    entity_id: sensor.frigate_olivia_last_camera
    to: Doorbell
  conditions:
  - condition: time
    after: '13:00:00'
    before: '14:00:00'
    weekday:
    - mon
    - tue
    - wed
    - thu
    - fri
  - condition: not
    conditions:
    - condition: state
      entity_id: person.olivia
      state: home
  actions:
  - action: llmvision.image_analyzer
    data:
      provider: 01K4FMFEXK56935CBS3A6F8R34
      model: gemini-2.5-flash
      image_entity:
      - camera.doorbell
      message: You are a charming, playful home assistant greeting Olivia, the lady
        of the house, as she arrives home for lunch. Looking at her in the image,
        give ONE short, warm, witty compliment about how lovely she looks today -
        friendly and a touch cheeky, never unkind, and address her by name (Olivia).
        If you cannot see her clearly, give a warm generic welcome-home compliment
        instead. Reply with ONLY the spoken sentence, max 20 words, no quotes, no
        emojis.
      max_tokens: 500
      temperature: 0.95
    response_variable: greeting
  - variables:
      greet: '{% set r = greeting.response_text | default('''') | replace(''"'','''')
        | trim %}{{ r if (r and ''error'' not in r|lower and ''unable'' not in r|lower
        and ''couldn'' not in r|lower) else ''Hello Olivia, you are looking absolutely
        amazing today!'' }}'
  - delay:
      minutes: 2
  - variables:
      kitchen_vol: '{{ state_attr(''media_player.kitchen_display_cast'', ''volume_level'')
        | float(0.4) }}'
      sitting_vol: '{{ state_attr(''media_player.sitting_room_speaker_cast'', ''volume_level'')
        | float(0.4) }}'
  - action: media_player.volume_set
    target:
      entity_id:
      - media_player.kitchen_display_cast
      - media_player.sitting_room_speaker_cast
    data:
      volume_level: 1
  - action: tts.cloud_say
    data:
      entity_id:
      - media_player.kitchen_display_cast
      - media_player.sitting_room_speaker_cast
      message: '{{ greet }}'
  - delay:
      seconds: 15
  - action: media_player.volume_set
    target:
      entity_id: media_player.kitchen_display_cast
    data:
      volume_level: '{{ kitchen_vol }}'
  - action: media_player.volume_set
    target:
      entity_id: media_player.sitting_room_speaker_cast
    data:
      volume_level: '{{ sitting_vol }}'
  mode: single
- id: '1778237018912'
  alias: Colm's Grand Return
  description: When Frigate face recognition detects Colm at the doorbell and he has
    been away for more than 3 days, or when he arrives home after 3+ days away, play
    a fanfare and announce his return on all speakers.
  triggers:
  - id: frigate
    platform: state
    entity_id: sensor.frigate_colm_last_camera
    to: Doorbell
  - id: arrived_home
    platform: state
    entity_id: person.colm_finn
    from: not_home
    to: home
  conditions:
  - condition: or
    conditions:
    - condition: and
      conditions:
      - condition: trigger
        id: frigate
      - condition: state
        entity_id: person.colm_finn
        state: not_home
      - condition: template
        value_template: '{{ (now() - states.person.colm_finn.last_changed).total_seconds()
          > 259200 }}'
    - condition: and
      conditions:
      - condition: trigger
        id: arrived_home
      - condition: template
        value_template: '{{ (now() - trigger.from_state.last_changed).total_seconds()
          > 259200 }}'
  actions:
  - delay:
      minutes: 2
  - variables:
      sitting_room_vol: '{{ state_attr(''media_player.sitting_room_speaker_cast'',
        ''volume_level'') }}'
      kitchen_display_vol: '{{ state_attr(''media_player.kitchen_display_cast'', ''volume_level'')
        }}'
  - action: media_player.volume_set
    target:
      entity_id:
      - media_player.sitting_room_speaker_cast
      - media_player.kitchen_display_cast
    data:
      volume_level: 1
  - action: media_player.play_media
    target:
      entity_id:
      - media_player.sitting_room_speaker_cast
      - media_player.kitchen_display_cast
    data:
      media_content_id: https://gn8w3cihiq4zou7b957rm67avh98n4uw.ui.nabu.casa/local/trumpet_fanfare.mp3
      media_content_type: music
  - delay: 00:00:20
  - action: tts.cloud_say
    data:
      entity_id:
      - media_player.sitting_room_speaker_cast
      - media_player.kitchen_display_cast
      message: Colm has finally returned!
  - delay: 00:00:08
  - action: media_player.volume_set
    target:
      entity_id: media_player.sitting_room_speaker_cast
    data:
      volume_level: '{{ sitting_room_vol | float(0.5) }}'
  - action: media_player.volume_set
    target:
      entity_id: media_player.kitchen_display_cast
    data:
      volume_level: '{{ kitchen_display_vol | float(0.5) }}'
  mode: single
- id: '1778240499637'
  alias: Zigbee2MQTT Down - Notify NP3
  description: 'If Z2M bridge drops for 2+ min: notify immediately 07:00-22:00, else
    queue a morning notification. Z2M runs in its own container - restart is manual
    on its container host. If that fails the Zigbee coordinator likely needs a power-cycle.'
  triggers:
  - platform: state
    entity_id: binary_sensor.zigbee2mqtt_bridge_connection_state
    to: 'off'
  - platform: state
    entity_id: binary_sensor.zigbee2mqtt_bridge_connection_state
    to: unavailable
  conditions: []
  actions:
  - variables:
      triggered_at: '{{ now().strftime(''%d %b at %H:%M'') }}'
  - delay:
      minutes: 2
  - condition: state
    entity_id: binary_sensor.zigbee2mqtt_bridge_connection_state
    state:
    - 'off'
    - unavailable
  - choose:
    - conditions:
      - condition: time
        after: 07:00:00
        before: '22:00:00'
      sequence:
      - data:
          title: Zigbee2MQTT Down
          message: Z2M bridge went down at {{ triggered_at }} and is still down. Restart
            the Zigbee container on its host.
          data:
            notification_icon: mdi:zigbee
        action: notify.mobile_app_np3
    default:
    - wait_for_trigger:
      - platform: time
        at: 07:00:00
    - data:
        title: Zigbee2MQTT Went Down Overnight
        message: 'Z2M bridge went down at {{ triggered_at }}. Current state: {{ states(''binary_sensor.zigbee2mqtt_bridge_connection_state'')
          }}. Restart the Zigbee container on its host.'
        data:
          notification_icon: mdi:zigbee
      action: notify.mobile_app_np3
  mode: single
- id: '1778243937781'
  alias: Sitting Room - Power Off After 30min No Presence
  description: If nobody has been in the sitting room for 30 continuous minutes, power
    off all Harmony devices.
  triggers:
  - platform: state
    entity_id: binary_sensor.sitting_room_presence_occupancy
    to: 'off'
    for: 00:30:00
  actions:
  - target:
      entity_id: remote.sittingrmhub
    action: remote.turn_off
  mode: single
- id: '1778268484924'
  alias: Tomorrow's Weather Forecast at 9pm
  description: Fetches tomorrow's daily forecast and sends a colourful notification
    to all phones at 9pm each evening. If Colm or Olivia is more than 100km from home,
    a second weather block is added for their away location.
  triggers:
  - platform: time
    at: '21:30:00'
  actions:
  - action: weather.get_forecasts
    data:
      type: daily
    target:
      entity_id: weather.forecast_home_2
    response_variable: forecast_data
  - if:
    - condition: template
      value_template: '{{ (forecast_data.get(''weather.forecast_home_2'', {}).get(''forecast'')
        or []) | count < 2 }}'
    then:
    - stop: Weather forecast unavailable - skipping notification
  - variables:
      fc: '{{ forecast_data[''weather.forecast_home_2''][''forecast''][1] }}'
      condition: '{{ forecast_data[''weather.forecast_home_2''][''forecast''][1].condition
        }}'
      someone_away: '{{ colm_dist > 100 or olivia_dist > 100 }}'
      away_lat: '{{ state_attr(''person.colm_finn'', ''latitude'') if colm_dist >
        100 else state_attr(''person.olivia_finn'', ''latitude'') }}'
      away_lon: '{{ state_attr(''person.colm_finn'', ''longitude'') if colm_dist >
        100 else state_attr(''person.olivia_finn'', ''longitude'') }}'
      away_person_name: '{{ ''Colm'' if colm_dist > 100 else ''Olivia'' }}'
  - variables:
      icon: "{% set icons = {'sunny': '☀️', 'clear-night': '\U0001F319', 'partlycloudy':
        '⛅', 'cloudy': '☁️', 'rainy': '\U0001F327️', 'pouring': '\U0001F30A', 'snowy':
        '❄️', 'snowy-rainy': '\U0001F328️', 'lightning': '\U0001F329️', 'lightning-rainy':
        '⛈️', 'windy': '\U0001F4A8', 'windy-variant': '\U0001F32C️', 'fog': '\U0001F32B️',
        'hail': '\U0001F9CA', 'exceptional': '\U0001F321️'} %}{{ icons.get(condition,
        '\U0001F324️') }}"
      color: '{% set colors = {''sunny'': ''#FFA500'', ''clear-night'': ''#191970'',
        ''partlycloudy'': ''#87CEEB'', ''cloudy'': ''#708090'', ''rainy'': ''#4169E1'',
        ''pouring'': ''#1E3A8A'', ''snowy'': ''#00BFFF'', ''snowy-rainy'': ''#4682B4'',
        ''lightning'': ''#FFD700'', ''lightning-rainy'': ''#FF8C00'', ''windy'': ''#20B2AA'',
        ''windy-variant'': ''#2E8B57'', ''fog'': ''#A9A9A9'', ''hail'': ''#B0E0E6'',
        ''exceptional'': ''#FF4500''} %}{{ colors.get(condition, ''#1a73e8'') }}'
  - variables:
      notif_title: '{{ icon }} Tomorrow – {{ (now() + timedelta(days=1)).strftime(''%A
        %-d %B'') }}'
      notif_message: "{{ icon }} {{ condition | replace('-', ' ') | title }}\n\n\U0001F321️
        \ High {{ fc.temperature | default(0) | round | int }}°C  ·  Low {{ fc.templow
        | default(0) | round | int }}°C\n\U0001F327️  Rain: {% set mm = fc.precipitation
        | default(0) | float %}{{ 'None' if mm == 0 else 'Low' if mm < 1 else 'Likely'
        if mm < 5 else 'Heavy' if mm < 10 else 'Very heavy' }} · {{ mm | round(1)
        }}mm\n\U0001F4A8  Wind: {{ fc.wind_speed | default(0) | round | int }} km/h"
  - if:
    - condition: template
      value_template: '{{ someone_away }}'
    then:
    - action: input_number.set_value
      target:
        entity_id: input_number.away_lat
      data:
        value: '{{ away_lat }}'
    - action: input_number.set_value
      target:
        entity_id: input_number.away_lon
      data:
        value: '{{ away_lon }}'
    - action: rest_command.get_away_location_name
      data:
        lat: '{{ away_lat }}'
        lon: '{{ away_lon }}'
      response_variable: geocode_resp
    - variables:
        away_name: '{% set addr = geocode_resp.content.address %}{% set city = addr.get(''city'',
          addr.get(''town'', addr.get(''village'', addr.get(''municipality'', ''Unknown''))))
          %}{{ city }}, {{ addr.get(''country'', '''') }}'
    - action: input_text.set_value
      target:
        entity_id: input_text.away_location_name
      data:
        value: '{{ away_name }}'
    - action: homeassistant.update_entity
      target:
        entity_id: sensor.away_weather_forecast
    - delay: 00:00:05
    - variables:
        away_icon: "{% set p = state_attr('sensor.away_weather_forecast', 'precipitation_probability_max')[1]
          | int(0) %}{% if p > 70 %}\U0001F327️{% elif p > 40 %}⛅{% elif p > 20 %}\U0001F324️{%
          else %}☀️{% endif %}"
        notif_message: "{{ notif_message }}\n\n─────────────\n\U0001F4CD {{ away_name
          }}\n{{ away_icon }} {{ away_person_name }}'s location\n\n\U0001F321️  High
          {{ state_attr('sensor.away_weather_forecast', 'temperature_2m_max')[1] |
          round | int }}°C  ·  Low {{ state_attr('sensor.away_weather_forecast', 'temperature_2m_min')[1]
          | round | int }}°C\n\U0001F327️  Rain: {{ state_attr('sensor.away_weather_forecast',
          'precipitation_probability_max')[1] | round | int }}%  ({{ state_attr('sensor.away_weather_forecast',
          'precipitation_sum')[1] | round(1) }}mm)\n\U0001F4A8  Wind: {{ state_attr('sensor.away_weather_forecast',
          'wind_speed_10m_max')[1] | round | int }} km/h"
  - data:
      title: '{{ notif_title }}'
      message: '{{ notif_message }}'
      data:
        notification_icon: mdi:weather-night
    action: notify.mobile_app_np3
  - data:
      title: '{{ notif_title }}'
      message: '{{ notif_message }}'
      data:
        notification_icon: mdi:weather-night
    action: notify.mobile_app_pixel_6a
  mode: single
  variables:
    colm_dist: '{{ distance(''person.colm_finn'', ''zone.home'') | float(0) }}'
    olivia_dist: '{{ distance(''person.olivia_finn'', ''zone.home'') | float(0) }}'
