    - wait_for_trigger:
      - platform: time
        at: 07:00:00
    - action: notify.send_message
      target:
        entity_id: notify.np3
      data:
        title: '{{ alert_title }} (triggered {{ alert_time }})'
        message: '{{ alert_message }}'
