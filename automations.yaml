- id: '1782548125867'
  alias: Cat Alarm - Kitchen TV Lightstrip Green
  description: When input_boolean.cat_alarm turns on, snapshot the Kitchen TV Lightstrip
    then set it green; restore the snapshot when the alarm turns off. mode:queued
    so a quick disarm right after arming is never dropped; the snapshot is skipped
    when the strip is already alarm-green so the restore point can never be poisoned
    to green.
  triggers:
  - platform: state
    entity_id: input_boolean.cat_alarm
    to: 'on'
    id: enabled
  - platform: state
    entity_id: input_boolean.cat_alarm
    to: 'off'
    id: disabled
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: enabled
      sequence:
      - if:
        - condition: template
          value_template: '{{ not (is_state(''light.kitchen_tv_lightstrip'',''on'')
            and (state_attr(''light.kitchen_tv_lightstrip'',''hs_color'') or [0,0])[0]
            | float(0) > 90 and (state_attr(''light.kitchen_tv_lightstrip'',''hs_color'')
            or [0,0])[0] | float(0) < 150 and (state_attr(''light.kitchen_tv_lightstrip'',''hs_color'')
            or [0,0])[1] | float(0) > 50) }}'
        then:
        - data:
            scene_id: cat_alarm_lightstrip_restore
            snapshot_entities:
            - light.kitchen_tv_lightstrip
          action: scene.create
      - target:
          entity_id: light.kitchen_tv_lightstrip
        data:
          rgb_color:
          - 0
          - 255
          - 0
          brightness_pct: 100
        action: light.turn_on
    - conditions:
      - condition: trigger
        id: disabled
      sequence:
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ states(''scene.cat_alarm_lightstrip_restore'') not
              in [''unknown'',''unavailable''] }}'
          sequence:
          - target:
              entity_id: scene.cat_alarm_lightstrip_restore
            action: scene.turn_on
        default:
        - target:
            entity_id: light.kitchen_tv_lightstrip
          action: light.turn_off
  mode: queued
  max: 3
- id: '1782929355416'
  alias: Frost Warning - Car Windscreen
  description: 'Weekday 07:30 check: if the lower of Met.no/Met Eireann outdoor temp
    is <=0C, push both phones to allow time to scrape the windscreen.'
  triggers:
  - platform: time
    at: 07:30:00
  conditions:
  - condition: time
    weekday:
    - mon
    - tue
    - wed
    - thu
    - fri
  - condition: template
    value_template: '{% set t1 = state_attr(''weather.forecast_home_2'',''temperature'')
      %}{% set t2 = state_attr(''weather.forecast_home'',''temperature'') %}{% set
      temps = [t1, t2] | reject(''none'') | list %}{{ (temps | min) <= 0 if temps
      | count > 0 else false }}'
  actions:
  - data:
      title: ❄️ Frost warning
      message: It's {{ tmin }}°C out — the car windscreen will be iced. Allow extra
        time to scrape before you leave.
      data:
        notification_icon: mdi:snowflake-alert
    action: notify.mobile_app_np3
  - data:
      title: ❄️ Frost warning
      message: It's {{ tmin }}°C out — the car windscreen will be iced. Allow extra
        time to scrape before you leave.
      data:
        notification_icon: mdi:snowflake-alert
    action: notify.mobile_app_pixel_6a
  mode: single
  variables:
    tmin: '{% set t1 = state_attr(''weather.forecast_home_2'',''temperature'') %}{%
      set t2 = state_attr(''weather.forecast_home'',''temperature'') %}{% set temps
      = [t1, t2] | reject(''none'') | list %}{{ temps | min if temps | count > 0 else
      ''below zero'' }}'
- id: '1782932115960'
  alias: Fog Warning - Commute
  description: 'Weekday 07:30 check: if either weather source reports fog, push both
    phones to allow extra time on the commute.'
  triggers:
  - platform: time
    at: 07:30:00
  conditions:
  - condition: time
    weekday:
    - mon
    - tue
    - wed
    - thu
    - fri
  - condition: template
    value_template: '{{ ''fog'' in [states(''weather.forecast_home''), states(''weather.forecast_home_2'')]
      }}'
  actions:
  - data:
      title: "\U0001F32B️ Fog warning"
      message: Fog about this morning — visibility will be poor. Allow extra time
        on the commute and use dipped headlights.
      data:
        notification_icon: mdi:weather-fog
    action: notify.mobile_app_np3
  - data:
      title: "\U0001F32B️ Fog warning"
      message: Fog about this morning — visibility will be poor. Allow extra time
        on the commute and use dipped headlights.
      data:
        notification_icon: mdi:weather-fog
    action: notify.mobile_app_pixel_6a
  mode: single
- id: '1783159541803'
  alias: Peak Rate - Appliance Started Nudge
  description: If the washing machine, tumble dryer or dishwasher starts a cycle during
    the 5-7pm peak electricity window (39c/kWh), push to Colm + Olivia suggesting
    it could wait until after 7pm. Notification-only (no TTS).
  triggers:
  - platform: state
    entity_id: input_select.washing_machine_run_status
    to: Washing
  - platform: state
    entity_id: input_select.tumble_dryer_run_status
    to: Drying
  - platform: state
    entity_id: input_select.dishwasher_run_status
    to: Scrubbing Away!
  conditions:
  - condition: time
    after: '17:00:00'
    before: '19:00:00'
  actions:
  - variables:
      appliance: '{{ {''input_select.washing_machine_run_status'':''washing machine'',''input_select.tumble_dryer_run_status'':''tumble
        dryer'',''input_select.dishwasher_run_status'':''dishwasher''}[trigger.entity_id]
        }}'
  - action: notify.mobile_app_np3
    data:
      title: 'Peak rate: {{ appliance }} running'
      message: The {{ appliance }} started during the 5-7pm peak (39c/kWh vs 37c after
        7pm). Consider waiting until after 7.
      data:
        tag: peak_appliance_nudge
        channel: Energy
        notification_icon: mdi:flash-alert
  - action: notify.mobile_app_pixel_6a
    data:
      title: 'Peak rate: {{ appliance }} running'
      message: The {{ appliance }} started during the 5-7pm peak (39c/kWh vs 37c after
        7pm). Consider waiting until after 7.
      data:
        tag: peak_appliance_nudge
        channel: Energy
        notification_icon: mdi:flash-alert
  mode: queued
  max: 3
