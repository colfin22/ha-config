- id: '1773057607414'
  alias: Office Hue Dimmer Switch
  description: Maps the Philips Hue dimmer switch in the office to light.office_ceiling
    via Z2M. On/off, brightness step ±10%, long-press up for full brightness.
  use_blueprint:
    path: EPMatt/philips_324131092621.yaml
    input:
      integration: Zigbee2MQTT
      controller_device: f8d2538f89c131fa7bb7ecfc1eb0c502
      helper_last_controller_event: input_text.office_dimmer_helper_last_controller_event
      action_button_on_short:
      - action: script.cycle_scenes
        data:
          light: light.office
          index_helper: input_number.office_scene_index
          scenes:
          - scene.office_dimmed
          - scene.office_bright
      action_button_on_long:
      - action: light.turn_off
        metadata: {}
        target:
          entity_id: light.office_ceiling
        data:
          transition: 2
      action_button_off_short:
      - action: light.turn_off
        metadata: {}
        target:
          entity_id: light.office_ceiling
        data:
          transition: 2
      action_button_up_short:
      - action: light.turn_on
        target:
          entity_id: light.office_ceiling
        data:
          brightness_step_pct: 15
      action_button_up_long:
      - action: light.turn_on
        target:
          entity_id: light.office_ceiling
        data:
          brightness_step_pct: 30
      action_button_down_short:
      - action: light.turn_on
        target:
          entity_id: light.office_ceiling
        data:
          brightness_step_pct: -15
      action_button_down_long:
      - action: light.turn_on
        target:
          entity_id: light.office_ceiling
        data:
          brightness_step_pct: -30
