- id: '1784537000042'
  alias: Infra Dashboard - Refresh IP Inventory
  description: 'ha-config #42 - the IPs tab Refresh button runs ip_inventory.py on
    the Proxmox host. mode single plus the trailing delay cap it at one collector
    run per 60s, so the webhook cannot spawn overlapping ping sweeps.'
  triggers:
  - trigger: webhook
    allowed_methods:
    - POST
    local_only: false
    webhook_id: infra_ipref_cfd8c38ba3ba124b
  conditions: []
  actions:
  - action: shell_command.refresh_ip_inventory
  - delay:
      seconds: 60
  mode: single
- id: '1784817847528'
  alias: Zigbee Bridge Health - Uptime Kuma Heartbeat
  description: 'Every minute (and on any state change) posts the Z2M bridge connection
    state to the Uptime Kuma push monitor (Network / id 56). on -> up; off/unavailable/unknown
    -> down with the actual state as the reason, so a bad/unknown bridge shows DOWN
    in Uptime Kuma (not just a dead socket). See ha-config issue #47.'
  triggers:
  - platform: time_pattern
    minutes: /1
  - platform: state
    entity_id: binary_sensor.zigbee2mqtt_bridge_connection_state
  actions:
  - variables:
      st: '{{ states(''binary_sensor.zigbee2mqtt_bridge_connection_state'') }}'
  - if:
    - condition: template
      value_template: '{{ st == ''on'' }}'
    then:
    - action: rest_command.uk_zigbee_push
      data:
        status: up
        msg: online
    else:
    - action: rest_command.uk_zigbee_push
      data:
        status: down
        msg: '{{ st }}'
  mode: single
- id: '1785581001062'
  alias: Solis Inverter Health - Uptime Kuma Heartbeat
  description: 'Every minute (and on any state change) posts the Solis inverter''s
    PV power state to the Uptime Kuma push monitor (Network / id 59). A valid number
    -> up; unavailable/unknown -> down with the actual state as the reason. Zero watts
    at night is healthy and reports up. This catches the inverter going silent over
    Modbus, which a port check on the RS485 gateway cannot see: the gateway keeps
    accepting TCP connections even when the inverter has stopped replying.'
  triggers:
  - platform: time_pattern
    minutes: /1
  - platform: state
    entity_id: sensor.solis_pv_total_power
  actions:
  - variables:
      st: '{{ states(''sensor.solis_pv_total_power'') }}'
  - if:
    - condition: template
      value_template: '{{ is_number(st) }}'
    then:
    - action: rest_command.uk_solis_push
      data:
        status: up
        msg: online
    else:
    - action: rest_command.uk_solis_push
      data:
        status: down
        msg: '{{ st }}'
  mode: single
- id: '1785777581922'
  alias: Solis - Inverter Not Generating
  description: Alerts Colm only (infra alert) when the inverter's own reported status
    leaves 'Generating' for 15 minutes while the sun is up (elevation > 5 deg), and
    sends an all-clear when it returns. The status register has read 'Generating'
    continuously since the integration went live on 01-08-2026 (it does NOT drop at
    night), so any other value - including unavailable/unknown - is a real fault or
    a lost Modbus link. This is a different failure from the Uptime Kuma heartbeat,
    which watches whether PV power reaches HA. input_boolean.solis_inverter_alert_active
    tracks whether an alert is outstanding so the all-clear only fires after a real
    alert.
  triggers:
  - platform: template
    value_template: '{{ states(''sensor.solis_inverter_status'') != ''Generating''
      and state_attr(''sun.sun'',''elevation'') | float(0) > 5 }}'
    for:
      minutes: 15
    id: fault
  - platform: template
    value_template: '{{ states(''sensor.solis_inverter_status'') == ''Generating''
      and is_state(''input_boolean.solis_inverter_alert_active'',''on'') }}'
    for:
      minutes: 2
    id: cleared
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: fault
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.solis_inverter_alert_active
      - data:
          title: ⚠️ Solis inverter not generating
          message: 'Inverter status has been "{{ states(''sensor.solis_inverter_status'')
            }}" for 15 minutes with the sun up.


            PV now: {{ states(''sensor.solis_pv_total_power'') }} W

            Battery: {{ states(''sensor.solis_battery_soc'') }}%

            Modbus link: {{ states(''sensor.solis_communication_health'') }}'
          data:
            notification_icon: mdi:solar-power-variant
        action: notify.mobile_app_np3
    - conditions:
      - condition: trigger
        id: cleared
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.solis_inverter_alert_active
      - data:
          title: ✅ Solis inverter generating again
          message: Status back to Generating. PV now {{ states('sensor.solis_pv_total_power')
            }} W.
          data:
            notification_icon: mdi:solar-power-variant
        action: notify.mobile_app_np3
  mode: single
- id: '1785777737329'
  alias: Solis - Modbus Link Unhealthy
  description: 'Watches the solax-modbus integration''s own comms diagnostics and
    pushes an alert when the link to the inverter degrades: communication health leaves
    ''Healthy'' for 10 min, OR any register is quarantined (the integration stops
    polling a register the inverter won''t answer), OR the polling success rate drops
    below 90% for 10 min. Sends an all-clear when all three are good again. Worth
    having because an RS485-to-Ethernet gateway keeps accepting TCP connections even
    when the inverter has gone silent, so a plain port check cannot see this failure
    - and because three of the five Energy-view badges (Solar, Battery, House) all
    depend on this link and go unavailable together. Quarantined registers rechecks
    every 300s.'
  triggers:
  - platform: template
    value_template: '{{ states(''sensor.solis_communication_health'') != ''Healthy''
      or states(''sensor.solis_communication_quarantined_registers'') | int(0) > 0
      or (is_number(states(''sensor.solis_communication_success_rate'')) and states(''sensor.solis_communication_success_rate'')
      | float(100) < 90) }}'
    for:
      minutes: 10
    id: fault
  - platform: template
    value_template: '{{ is_state(''input_boolean.solis_modbus_alert_active'',''on'')
      and states(''sensor.solis_communication_health'') == ''Healthy'' and states(''sensor.solis_communication_quarantined_registers'')
      | int(1) == 0 and states(''sensor.solis_communication_success_rate'') | float(0)
      >= 90 }}'
    for:
      minutes: 10
    id: cleared
  actions:
  - variables:
      detail: 'Health: {{ states(''sensor.solis_communication_health'') }}

        Success rate: {{ states(''sensor.solis_communication_success_rate'') }}%

        Quarantined registers: {{ states(''sensor.solis_communication_quarantined_registers'')
        }}{% set r = state_attr(''sensor.solis_communication_quarantined_registers'',''registers'')
        %}{% if r %} {{ r }}{% endif %}'
  - choose:
    - conditions:
      - condition: trigger
        id: fault
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.solis_modbus_alert_active
      - data:
          title: "\U0001F50C Solis Modbus link unhealthy"
          message: '{{ detail }}


            Solar, Battery and House badges may go blank. Check the RS485 gateway
            - it does not answer ping, so probe its Modbus TCP port instead.'
          data:
            notification_icon: mdi:lan-disconnect
        action: notify.mobile_app_np3
    - conditions:
      - condition: trigger
        id: cleared
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.solis_modbus_alert_active
      - data:
          title: ✅ Solis Modbus link healthy again
          message: '{{ detail }}'
          data:
            notification_icon: mdi:lan-disconnect
        action: notify.mobile_app_np3
  mode: single
- id: '1785777769996'
  alias: Solis - Inverter Over Temperature
  description: 'Colm only (infra alert). Two-stage inverter temperature alert. Warning
    when sensor.solis_inverter_temperature stays above 65C for 10 min; urgent alert
    above 75C for 5 min; all-clear once it falls back under 60C (hysteresis, so it
    does not flap around a threshold). Thresholds set from measured history, not guessed:
    daily max was 55.7C on 01-08-2026 (sunny, 28.9 kWh), 48.9C on 02-08 (rain), 51.8C
    on 03-08, with daily means 34-43C. So a sunny-day peak is high 50s and 65C means
    something has actually changed - blocked vents, a failed fan, or a much hotter
    loft. Catches it before the inverter derates output to protect itself. Re-check
    these numbers after a full summer of data.'
  triggers:
  - platform: numeric_state
    entity_id: sensor.solis_inverter_temperature
    above: 65
    for:
      minutes: 10
    id: warn
  - platform: numeric_state
    entity_id: sensor.solis_inverter_temperature
    above: 75
    for:
      minutes: 5
    id: urgent
  - platform: numeric_state
    entity_id: sensor.solis_inverter_temperature
    below: 60
    for:
      minutes: 10
    id: cleared
  conditions:
  - condition: template
    value_template: '{{ trigger.id != ''cleared'' or is_state(''input_boolean.solis_temperature_alert_active'',''on'')
      }}'
  actions:
  - variables:
      detail: 'Inverter temperature: {{ states(''sensor.solis_inverter_temperature'')
        }} C

        PV now: {{ states(''sensor.solis_pv_total_power'') }} W

        Battery power: {{ states(''sensor.solis_battery_power'') }} W'
  - choose:
    - conditions:
      - condition: trigger
        id: urgent
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.solis_temperature_alert_active
      - data:
          title: "\U0001F525 Solis inverter VERY hot (>75C)"
          message: '{{ detail }}


            Check airflow around the inverter now - it will derate or trip to protect
            itself.'
          data:
            notification_icon: mdi:thermometer-alert
        action: notify.mobile_app_np3
    - conditions:
      - condition: trigger
        id: warn
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.solis_temperature_alert_active
      - data:
          title: "\U0001F321️ Solis inverter running hot (>65C)"
          message: '{{ detail }}


            A sunny-day peak here is high 50s. Worth checking vents and the fan.'
          data:
            notification_icon: mdi:thermometer-alert
        action: notify.mobile_app_np3
    - conditions:
      - condition: trigger
        id: cleared
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.solis_temperature_alert_active
      - data:
          title: ✅ Solis inverter temperature back to normal
          message: '{{ detail }}'
          data:
            notification_icon: mdi:thermometer-alert
        action: notify.mobile_app_np3
  mode: single
- id: '1785777852680'
  alias: Solis - Battery Depleted Early
  description: 'Goes to BOTH Colm and Olivia (Colm, 03-08-2026) - unlike the other
    Solis alerts this is a household message, not an infra one: it means the house
    is about to import at the expensive day rate. Alerts when the battery falls to
    25% between 17:00 and 23:00. The window ends at 23:00 because cheap night rate
    starts then: the battery sitting on its floor after 23:00 costs little and is
    normal. Threshold and window set from measured behaviour: over 01-08 to 03-08-2026
    the battery reached its 20% floor between 23:00 and 02:00 every night and recharged
    from about 03:00, so a plain ''SoC low'' alert would have fired every night and
    meant nothing. The inverter''s own floor is 20% (number.solis_battery_minimum_soc)
    with force-charge at 18%. Fires at most once per evening.'
  triggers:
  - platform: numeric_state
    entity_id: sensor.solis_battery_soc
    below: 25
    for:
      minutes: 5
    id: low
  conditions:
  - condition: time
    after: '17:00:00'
    before: '23:00:00'
  actions:
  - variables:
      title: "\U0001F50B Solis battery down early ({{ states('sensor.solis_battery_soc')
        }}%)"
      body: 'Battery hit 25% at {{ now().strftime(''%H:%M'') }} - still day rate until
        23:00, so the house is importing at the expensive price from here.


        Generated today: {{ states(''sensor.solis_power_generation_today'') }} kWh

        House used today: {{ states(''sensor.solis_house_load_today'') }} kWh

        House load now: {{ states(''sensor.solis_house_load'') }} W

        Grid import today: {{ states(''sensor.solis_grid_import_today'') }} kWh


        Reserve is {{ states(''sensor.solis_battery_minimum_soc'') }}% - the house
        goes to grid below that.'
  - data:
      title: '{{ title }}'
      message: '{{ body }}'
      data:
        notification_icon: mdi:battery-alert
    action: notify.mobile_app_np3
  - data:
      title: '{{ title }}'
      message: '{{ body }}'
      data:
        notification_icon: mdi:battery-alert
    action: notify.mobile_app_pixel_6a
  mode: single
- id: '1785777964976'
  alias: Solis - Battery Health Check
  description: 'Colm only (infra alert). On the 1st of each month at 09:00, compares
    sensor.solis_battery_soh against the value stored last month in input_number.solis_battery_soh_last_month,
    notifies if it has dropped by more than 1 point, and then stores the current value
    either way. Silent when healthy - the helper''s own history is the running record.
    Purpose is slow-burn warranty evidence: a battery degrading faster than expected
    is invisible day to day but obvious over a year of monthly readings. Baseline
    seeded 03-08-2026 at 99%. Skips the comparison if the sensor is unavailable so
    a dead Modbus link cannot fake a drop.'
  triggers:
  - platform: time
    at: 09:00:00
  conditions:
  - condition: template
    value_template: '{{ now().day == 1 }}'
  - condition: template
    value_template: '{{ is_number(states(''sensor.solis_battery_soh'')) }}'
  actions:
  - variables:
      soh_now: '{{ states(''sensor.solis_battery_soh'') | float(0) }}'
      soh_last: '{{ states(''input_number.solis_battery_soh_last_month'') | float(0)
        }}'
  - if:
    - condition: template
      value_template: '{{ soh_last > 0 and (soh_last - soh_now) > 1 }}'
    then:
    - data:
        title: "\U0001F50B❤️ Solis battery health dropped"
        message: 'Battery State of Health is now {{ soh_now }}%, down {{ (soh_last
          - soh_now) | round(1) }} points from {{ soh_last }}% last month.


          Total charged: {{ states(''sensor.solis_total_battery_charge'') }} kWh

          Total discharged: {{ states(''sensor.solis_total_battery_discharge'') }}
          kWh


          Worth noting for warranty.'
        data:
          notification_icon: mdi:battery-heart-variant
      action: notify.mobile_app_np3
  - action: input_number.set_value
    target:
      entity_id: input_number.solis_battery_soh_last_month
    data:
      value: '{{ soh_now }}'
  mode: single
- id: '1785778056339'
  alias: Solis - String Imbalance East vs West
  description: Colm only (infra alert). Watches for one PV string persistently underperforming
    the other - the classic early signal of shading, soiling, a failed panel or a
    dead optimiser. There are no per-string ENERGY sensors, only power, so this tracks
    each string's daily PEAK power in input_number.solis_pv_peak_east_today / _west_today
    (sampled every 5 min) and compares them at 23:30. Peak ratio (weaker/stronger)
    measured over 01-08 to 03-08-2026 was 0.97, 0.88 and 0.76, so the alert threshold
    is 0.50 - well clear of normal aspect and weather variation. A day only counts
    if BOTH peaks exceed 500 W, so dull days and winter mornings are ignored rather
    than mistaken for a fault. It alerts only after 5 qualifying days in a row below
    the threshold (counter in input_number.solis_string_imbalance_days), and alerts
    once per streak, not nightly. Both strings see the same sky, so a sustained one-sided
    shortfall is real. Peaks reset at 00:01. The streak count is computed in a variable
    before it is written, so the alert never depends on re-reading a helper it just
    set.
  triggers:
  - platform: time_pattern
    minutes: /5
    id: sample
  - platform: time
    at: '23:30:00'
    id: evaluate
  - platform: time
    at: 00:01:00
    id: reset
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: sample
      - condition: template
        value_template: '{{ is_number(states(''sensor.solis_pv_power_east'')) and
          is_number(states(''sensor.solis_pv_power_west'')) }}'
      sequence:
      - if:
        - condition: template
          value_template: '{{ states(''sensor.solis_pv_power_east'') | float(0) >
            states(''input_number.solis_pv_peak_east_today'') | float(0) }}'
        then:
        - action: input_number.set_value
          target:
            entity_id: input_number.solis_pv_peak_east_today
          data:
            value: '{{ states(''sensor.solis_pv_power_east'') | float(0) | round(0)
              }}'
      - if:
        - condition: template
          value_template: '{{ states(''sensor.solis_pv_power_west'') | float(0) >
            states(''input_number.solis_pv_peak_west_today'') | float(0) }}'
        then:
        - action: input_number.set_value
          target:
            entity_id: input_number.solis_pv_peak_west_today
          data:
            value: '{{ states(''sensor.solis_pv_power_west'') | float(0) | round(0)
              }}'
    - conditions:
      - condition: trigger
        id: evaluate
      sequence:
      - variables:
          pe: '{{ states(''input_number.solis_pv_peak_east_today'') | float(0) }}'
          pw: '{{ states(''input_number.solis_pv_peak_west_today'') | float(0) }}'
      - variables:
          qualifies: '{{ pe > 500 and pw > 500 }}'
          ratio: '{{ (([pe, pw] | min) / ([pe, pw] | max)) if ([pe, pw] | max) > 0
            else 1 }}'
          weak: '{{ ''East'' if pe < pw else ''West'' }}'
          newcount: '{{ (states(''input_number.solis_string_imbalance_days'') | int(0))
            + 1 }}'
      - condition: template
        value_template: '{{ qualifies }}'
      - if:
        - condition: template
          value_template: '{{ ratio < 0.5 }}'
        then:
        - action: input_number.set_value
          target:
            entity_id: input_number.solis_string_imbalance_days
          data:
            value: '{{ newcount }}'
        - condition: template
          value_template: '{{ newcount | int(0) == 5 }}'
        - data:
            title: "\U0001F506 Solis {{ weak }} string underperforming"
            message: 'The {{ weak }} string has peaked below half the other string
              for 5 days running.


              Today''s peaks - East {{ pe | round(0) }} W, West {{ pw | round(0) }}
              W (ratio {{ ratio | round(2) }}).

              Normal ratio here is 0.75 to 0.97.


              Both strings see the same sky, so this is not weather. Worth checking
              for shading, soiling, or a panel/optimiser fault on the {{ weak | lower
              }} roof.'
            data:
              notification_icon: mdi:scale-balance
          action: notify.mobile_app_np3
        else:
        - action: input_number.set_value
          target:
            entity_id: input_number.solis_string_imbalance_days
          data:
            value: 0
    - conditions:
      - condition: trigger
        id: reset
      sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.solis_pv_peak_east_today
        data:
          value: 0
      - action: input_number.set_value
        target:
          entity_id: input_number.solis_pv_peak_west_today
        data:
          value: 0
  mode: queued
  max: 10
- id: '1785945600001'
  alias: Solis - Sync Inverter Clock at Clock Change
  description: 'Colm only (infra alert). Presses button.solis_sync_rtc at 10:00 on
    the last Sunday of March and October - the EU daylight-saving changeovers. WHY:
    the timed night charge window (02:00-08:00) is defined in INVERTER time, and the
    inverter has NO DST or timezone setting (Colm checked the unit itself 05-08-2026),
    so it holds whatever wall clock it was last given. After the MARCH change the
    inverter runs an hour behind local, its window fires 03:00-09:00, and the final
    hour lands in the 0.37 day band instead of the 0.20 night band. October is harmless
    for the tariff (the window moves earlier, still inside the 23:00-08:00 night band)
    but is synced anyway because the RTC also gains about 14 minutes of drift on its
    own - it was found 14 min ahead of UTC on 05-08-2026 - so twice a year clears
    that too. Runs at 10:00 so the clock is never rewritten mid-charge, since after
    a change the window can run as late as 09:00 local. The condition tracks the EU
    rule (last Sunday) rather than hardcoded dates, so it needs no yearly maintenance.
    VERIFICATION (added 06-08-2026): sensor.solis_rtc reads the inverter clock back
    (input register 33022 - it is disabled by default in the integration and was enabled
    on 06-08-2026), so this automation now measures drift before and after the press
    and reports whether the sync actually took. The 120 s threshold is deliberately
    wide: the sensor lags up to one 15 s scan interval, while the real failure modes
    are a missed DST change (3600 s) or accumulated drift (~840 s).'
  triggers:
  - platform: time
    at: '10:00:00'
  conditions:
  - condition: template
    value_template: '{{ now().month in [3, 10] and now().weekday() == 6 and now().day
      > 24 }}'
  actions:
  - variables:
      drift_before: '{% set r = states(''sensor.solis_rtc'') %}{% if r not in [''unknown'',''unavailable'',''none'','''']
        %}{{ ((as_timestamp(now()) - as_timestamp(strptime(r,''%Y-%m-%d %H:%M:%S'')))
        | abs) | round(0) | int }}{% else %}unknown{% endif %}'
  - action: button.press
    target:
      entity_id: button.solis_sync_rtc
  - delay:
      seconds: 30
  - variables:
      drift_after: '{% set r = states(''sensor.solis_rtc'') %}{% if r not in [''unknown'',''unavailable'',''none'','''']
        %}{{ ((as_timestamp(now()) - as_timestamp(strptime(r,''%Y-%m-%d %H:%M:%S'')))
        | abs) | round(0) | int }}{% else %}unknown{% endif %}'
  - data:
      title: "\U0001F550 Solis clock synced after the clock change"
      message: 'Pressed Sync RTC at {{ now().strftime(''%H:%M on %d-%m-%Y'') }} ({{
        ''March'' if now().month == 3 else ''October'' }} changeover).


        The inverter has no DST setting, so its clock was an hour out until this ran.
        The 02:00-08:00 night charge window should now line up with the 0.20 night
        rate again.


        Before: {% if drift_before == ''unknown'' %}not readable{% else %}{{ drift_before
        }}s out{% endif %}. After: {% if drift_after == ''unknown'' %}not readable{%
        else %}{{ drift_after }}s out{% endif %}.


        {% if drift_after == ''unknown'' %}Could not verify - sensor.solis_rtc was
        unavailable. Check registers 43000-43005 manually.{% elif drift_after | int
        < 120 %}Sync confirmed.{% else %}SYNC DID NOT TAKE. Check manually.{% endif
        %}'
      data:
        notification_icon: mdi:clock-check
    action: notify.mobile_app_np3
  mode: single
- id: '1785952118761'
  alias: Solis - Hot Water Ready Latch
  description: Latches ON the first time the eddi reports 'Max temp reached' each
    day, so the appliance nudge knows the tank is hot. Needed because the status flaps
    Diverting/Max temp/Paused dozens of times a day - a point-in-time check would
    be a coin toss. Reset at midnight by 'Solis - Reset Appliance Nudge Flags'.
  triggers:
  - platform: state
    entity_id: sensor.myenergi_eddi_23323250_status
    to: Max temp reached
  actions:
  - target:
      entity_id: input_boolean.hot_water_ready_today
    action: input_boolean.turn_on
  mode: single
- id: '1785952120399'
  alias: Solis - Reset Appliance Nudge Flags
  description: Midnight reset of the hot-water latch and the per-person appliance
    nudge flags.
  triggers:
  - platform: time
    at: 00:00:00
  actions:
  - target:
      entity_id:
      - input_boolean.hot_water_ready_today
      - input_boolean.appliance_nudge_sent_colm
      - input_boolean.appliance_nudge_sent_olivia
    action: input_boolean.turn_off
  mode: single
- id: '1785952140395'
  alias: Solis - Good Time To Run Appliances
  description: 'Friendly nudge that it''s a good moment to run a big appliance: battery
    full, hot water done, real solar surplus. Notify only - the appliances are dumb
    and cannot be started remotely. Only fires while House Mode is Home (Away = never,
    Sleeping = deferred until it flips to Home), only to people actually in the house,
    once per person per day. Thresholds measured over 01-05 Aug 2026: export >=1500W
    would have fired 4 of 5 days, staying silent on the cloudy 02-08. Summer sample
    only - revisit in winter. NB uses notify.mobile_app_* services, NOT notify.send_message
    - the entity form rejects the data block that carries notification_icon.'
  triggers:
  - platform: numeric_state
    entity_id: sensor.grid_export_power
    above: 1500
    for: 00:10:00
    id: surplus
  - platform: state
    entity_id:
    - person.colm_finn
    - person.olivia_finn
    to: home
    id: arrived
  - platform: state
    entity_id: input_select.house_mode
    to: Home
    id: house_home
  conditions:
  - condition: time
    after: 09:00:00
    before: '15:00:00'
  - condition: state
    entity_id: input_select.house_mode
    state: Home
  - condition: state
    entity_id: input_boolean.hot_water_ready_today
    state: 'on'
  - condition: numeric_state
    entity_id: sensor.solis_battery_soc
    above: 94
  - condition: numeric_state
    entity_id: sensor.grid_export_power
    above: 1500
  - condition: template
    value_template: '{{ (states(''sensor.energy_production_today_remaining'') | float(0)
      + states(''sensor.energy_production_today_remaining_2'') | float(0)) >= 3 }}'
  - condition: template
    value_template: '{{ (is_state(''person.colm_finn'',''home'') and is_state(''input_boolean.appliance_nudge_sent_colm'',''off''))
      or (is_state(''person.olivia_finn'',''home'') and is_state(''input_boolean.appliance_nudge_sent_olivia'',''off''))
      }}'
  actions:
  - if:
    - condition: state
      entity_id: person.colm_finn
      state: home
    - condition: state
      entity_id: input_boolean.appliance_nudge_sent_colm
      state: 'off'
    then:
    - data:
        title: '{{ nudge_title }}'
        message: '{{ nudge_message }}'
        data:
          notification_icon: mdi:solar-power
      action: notify.mobile_app_np3
    - target:
        entity_id: input_boolean.appliance_nudge_sent_colm
      action: input_boolean.turn_on
  - if:
    - condition: state
      entity_id: person.olivia_finn
      state: home
    - condition: state
      entity_id: input_boolean.appliance_nudge_sent_olivia
      state: 'off'
    then:
    - data:
        title: '{{ nudge_title }}'
        message: '{{ nudge_message }}'
        data:
          notification_icon: mdi:solar-power
      action: notify.mobile_app_pixel_6a
    - target:
        entity_id: input_boolean.appliance_nudge_sent_olivia
      action: input_boolean.turn_on
  mode: single
