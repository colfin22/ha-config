- id: '1738945275489'
  alias: Bins Out Notification
  description: 'Evening-before bin reminders (Panda waste). 19:00 the night before
    a collection: pushes Colm + Olivia which bins are due (icon per type, from calendar.panda_waste).
    22:00: checks Frigate''s waste_bin count on the Front Van camera (sensor.front_van_waste_bin_count)
    — alerts only when the count is 0 (includes stationary bins at the kerb — if no
    bin is seen out front it announces a TTS reminder on the home speakers + sends
    a second phone alert with a camera snapshot. Two calendar triggers on calendar.panda_waste
    (offset -5h = 19:00, -2h = 22:00), branched by trigger id.'
  triggers:
  - event: start
    offset: '-5:0:0'
    entity_id: calendar.panda_waste
    id: notify_7pm
    trigger: calendar
  - event: start
    offset: '-2:0:0'
    entity_id: calendar.panda_waste
    id: check_10pm
    trigger: calendar
  conditions: []
  actions:
  - action: calendar.get_events
    target:
      entity_id: calendar.panda_waste
    data:
      start_date_time: '{{ (now() + timedelta(days=1)).strftime(''%Y-%m-%d'') }}T00:00:00'
      end_date_time: '{{ (now() + timedelta(days=1)).strftime(''%Y-%m-%d'') }}T23:59:59'
    response_variable: collections
  - variables:
      bin_lines: "{% set events = collections['calendar.panda_waste']['events'] |
        map(attribute='summary') | list %}{% set m = {'recycl':'♻️','waste':'\U0001F5D1️','organic':'\U0001F7E4','brown':'\U0001F7E4','food':'\U0001F342','glass':'\U0001F96B','garden':'\U0001F33F'}
        %}{%- set ns = namespace(lines=[]) -%}{%- for b in events -%}{%- set key =
        b | lower -%}{%- set icon = namespace(v='\U0001F5D1️') -%}{%- for k,v in m.items()
        if k in key -%}{%- set icon.v = v -%}{%- endfor -%}{%- set ns.lines = ns.lines
        + [icon.v ~ ' ' ~ b] -%}{%- endfor -%}{{ ns.lines | join(' • ') }}"
  - choose:
    - conditions:
      - condition: trigger
        id: notify_7pm
      sequence:
      - action: notify.mobile_app_np3
        data:
          title: "\U0001F5D1️ Bins Out Tonight"
          message: "Out for collection tomorrow morning:\n{{ bin_lines }}\n\nPut them
            out before bed \U0001F319"
          data:
            notification_icon: mdi:trash-can
            color: '#43A047'
            tag: bins-out
            group: bins
            channel: Bins
            importance: high
      - action: notify.mobile_app_pixel_6a
        data:
          title: "\U0001F5D1️ Bins Out Tonight"
          message: "Out for collection tomorrow morning:\n{{ bin_lines }}\n\nPut them
            out before bed \U0001F319"
          data:
            notification_icon: mdi:trash-can
            color: '#43A047'
            tag: bins-out
            group: bins
            channel: Bins
            importance: high
    - conditions:
      - condition: trigger
        id: check_10pm
      sequence:
      - if:
        - condition: template
          value_template: '{{ states(''sensor.front_van_waste_bin_count'') | int(-1)
            == 0 }}'
        then:
        - action: script.tts_announce
          data:
            message: Reminder. The bins do not appear to be out and collection is
              tomorrow. Please put them out.
            target_player: media_player.home_audio_group_cast
        - action: notify.mobile_app_np3
          data:
            title: "\U0001F5D1️ Bins NOT out — did they go out?"
            message: 'Collection tomorrow: {{ bin_lines }}'
            data:
              image: /api/camera_proxy/camera.front_van
              notification_icon: mdi:trash-can-outline
              color: '#E53935'
              tag: bins-not-out
              group: bins
              channel: Bins
              importance: high
        - action: notify.mobile_app_pixel_6a
          data:
            title: "\U0001F5D1️ Bins NOT out — did they go out?"
            message: 'Collection tomorrow: {{ bin_lines }}'
            data:
              image: /api/camera_proxy/camera.front_van
              notification_icon: mdi:trash-can-outline
              color: '#E53935'
              tag: bins-not-out
              group: bins
              channel: Bins
              importance: high
  mode: single
- id: '1767011232807'
  alias: Brother Printer Auto Power Cycle
  description: Checks every 15 minutes (07:00–21:00) if the Brother printer is offline.
    If so, power-cycles the socket with a 10s delay to reboot it.
  triggers:
  - minutes: '15'
    platform: time_pattern
  conditions:
  - condition: time
    after: 07:00:00
    before: '21:00:00'
    weekday:
    - mon
    - tue
    - wed
    - thu
    - fri
    - sat
    - sun
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: binary_sensor.brother_printer
        state: 'on'
      sequence: []
    - conditions:
      - condition: state
        entity_id: binary_sensor.brother_printer
        state: 'off'
      sequence:
      - target:
          entity_id: switch.brother_printer_socket
        action: switch.turn_off
      - delay: 00:00:10
      - target:
          entity_id: switch.brother_printer_socket
        action: switch.turn_on
  mode: single
- id: '1769600924498'
  alias: Dishwasher Notifications & Actions
  description: Monitors dishwasher power to detect cycle start/end. Notifies Colm
    on start, both phones on finish with cycle cost. Announces via TTS, tracks energy
    usage and cost, updates run status and cycle counter.
  use_blueprint:
    path: Blackshome/appliance-notifications.yaml
    input:
      power_sensor: sensor.dishwasher_socket_power
      include_start_notify: enable_start_notify_options
      start_notify_device:
      - 002753768c371c4f05a272c7e1e0f93c
      start_title: Dishwasher
      start_notify_icon: mdi:dishwasher
      include_end_notify: enable_end_notify_options
      end_notify_device:
      - 002753768c371c4f05a272c7e1e0f93c
      - 608a38b4b22a758514a74999ee616eb9
      end_message_title: Dishwasher
      end_message: Yippee the dishwasher is finished!
      end_notify_icon: mdi:dishwasher
      include_run_status: run_status_enabled
      after_time: 07:00:00
      before_time: '22:00:00'
      include_runtime_tracking: disable_runtime_tracking
      include_duration_tracking: enable_duration_tracking
      include_power_tracking: enable_power_tracking_and_cost
      power_consumption_sensor: sensor.dishwasher_energy_calculated
      cost_per_kwh: input_number.electricity_rate
      start_power_consumption: input_number.dishwasher_energy_tracking_start_number_helper
      end_power_consumption: input_number.dishwasher_energy_tracking_end_number_helper
      end_message_cost: Approx Cost €
      start_time_delay: 0.25
      include_time: time_enabled
      run_status_start: Scrubbing Away!
      run_status_entity: input_select.dishwasher_run_status
      run_status_end: All Done!
      cycle_counter_helper: counter.dishwasher_run_cycle_counter
      include_cycle_counter: enable_cycle_counter
      include_custom_actions: []
      start_custom_actions: []
      end_custom_actions:
      - action: script.tts_announce
        data:
          message: The dishwasher cycle is now complete
          target_player: media_player.kitchen_display_cast
      start_notify_data:
      - icon
      end_notify_data:
      - icon
      notify_zone: zone.home
      include_device_tracker:
      - zone_start
      - zone_end
