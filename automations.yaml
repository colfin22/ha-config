    path: SgtBatten/Stable.yaml
    input:
      camera:
      - camera.front_car
      - camera.front_van
      notify_device: 002753768c371c4f05a272c7e1e0f93c
      review_severity:
      - alert
      master_condition:
      - condition: time
        after: '23:00:00'
        before: 06:30:00
        weekday:
        - mon
        - tue
        - wed
        - thu
        - fri
        - sat
        - sun
      zone_filter: true
      zones:
      - 182_focus_zone
      - 162_focus_zone
      labels:
      - person
      custom_action_auto:
