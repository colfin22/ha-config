- id: '1778225960347'
  alias: Cameras - Overnight Summary
  description: At 7am sends an overnight camera summary. If a person was detected,
    sends a high-priority alert with a snapshot and notes any other animals spotted.
    If no person, sends an all-clear with any cats, dogs or birds mentioned.
  triggers:
  - platform: time
    at: 07:00:00
  actions:
  - variables:
      other_line: "{% set midnight = today_at('00:00') | as_timestamp %}{% set cat_n
        = namespace(n=0) %}{% for img in ['image.doorbell_cat','image.front_car_cat','image.front_van_cat','image.rear_door_cat','image.rear_shed_cat']
        %}{% if states(img) not in ('unknown','unavailable') and as_timestamp(states(img),
        0) > midnight %}{% set cat_n.n = cat_n.n + 1 %}{% endif %}{% endfor %}{% set
        dog_n = namespace(n=0) %}{% for img in ['image.doorbell_dog','image.front_car_dog','image.front_van_dog','image.rear_door_dog','image.rear_shed_dog']
        %}{% if states(img) not in ('unknown','unavailable') and as_timestamp(states(img),
        0) > midnight %}{% set dog_n.n = dog_n.n + 1 %}{% endif %}{% endfor %}{% set
        bird_n = namespace(n=0) %}{% for img in ['image.doorbell_bird','image.front_car_bird','image.front_van_bird','image.rear_door_bird','image.rear_shed_bird']
        %}{% if states(img) not in ('unknown','unavailable') and as_timestamp(states(img),
        0) > midnight %}{% set bird_n.n = bird_n.n + 1 %}{% endif %}{% endfor %}{%
        set fox_n = namespace(n=0) %}{% for img in ['image.doorbell_fox','image.front_car_fox','image.front_van_fox','image.rear_door_fox','image.rear_shed_fox']
        %}{% if states(img) not in ('unknown','unavailable') and as_timestamp(states(img),
        0) > midnight %}{% set fox_n.n = fox_n.n + 1 %}{% endif %}{% endfor %}{% set
        parts = namespace(list=[]) %}{% if cat_n.n > 0 %}{% set parts.list = parts.list
        + ['\U0001F431 Cat' + (' ×' + cat_n.n | string if cat_n.n > 1 else '')] %}{%
        endif %}{% if dog_n.n > 0 %}{% set parts.list = parts.list + ['\U0001F436
        Dog' + (' ×' + dog_n.n | string if dog_n.n > 1 else '')] %}{% endif %}{% if
        fox_n.n > 0 %}{% set parts.list = parts.list + ['\U0001F98A Fox' + (' ×' +
        fox_n.n | string if fox_n.n > 1 else '')] %}{% endif %}{% if bird_n.n > 0
        %}{% set parts.list = parts.list + ['\U0001F426 Bird' + (' ×' + bird_n.n |
        string if bird_n.n > 1 else '')] %}{% endif %}{{ parts.list | join('  ·  ')
        }}"
  - if:
    - condition: template
      value_template: '{{ person_count > 0 }}'
    then:
    - action: notify.send_message
      target:
        entity_id: notify.np3
      data:
        title: "\U0001F6A8 Person Detected Overnight"
        message: 'Person spotted on {{ best_camera }} at {{ best_time }}{% if camera_count
          > 1 %} (+{{ camera_count - 1 }} other camera{{ ''s'' if camera_count > 2
          else '''' }}){% endif %}{% if other_line != '''' %}


          Also overnight: {{ other_line }}{% endif %}'
    - action: notify.send_message
      target:
        entity_id: notify.pixel_6a
      data:
        title: "\U0001F6A8 Person Detected Overnight"
        message: 'Person spotted on {{ best_camera }} at {{ best_time }}{% if camera_count
          > 1 %} (+{{ camera_count - 1 }} other camera{{ ''s'' if camera_count > 2
          else '''' }}){% endif %}{% if other_line != '''' %}


          Also overnight: {{ other_line }}{% endif %}'
    else:
    - action: notify.send_message
      target:
        entity_id: notify.np3
      data:
        title: "\U0001F7E2 All Clear Overnight — {{ now().strftime('%A %-d %B') }}"
        message: 'No people detected on any camera.{% if other_line != '''' %}


          Also spotted: {{ other_line }}{% else %}

          No other activity detected.{% endif %}'
    - action: notify.send_message
      target:
        entity_id: notify.pixel_6a
      data:
        title: "\U0001F7E2 All Clear Overnight — {{ now().strftime('%A %-d %B') }}"
        message: 'No people detected on any camera.{% if other_line != '''' %}


          Also spotted: {{ other_line }}{% else %}

          No other activity detected.{% endif %}'
  mode: single
  variables:
    person_count: '{{ states(''sensor.frigate_overnight_person_count'') | int(0) }}'
    best_camera: '{{ states(''sensor.frigate_overnight_best_camera'') }}'
    best_time: '{{ states(''sensor.frigate_overnight_best_time'') | float(0) | timestamp_custom(''%-I:%M
      %p'') }}'
    camera_count: '{{ states(''sensor.frigate_overnight_camera_count'') | int(0) }}'
- id: '1778228718912'
  alias: Energy - Snapshot Daily Totals
  description: At 23:58 each night, saves today's energy sensor values to helpers
    so they can be read the next morning.
  triggers:
  - platform: time
    at: '23:58:00'
  actions:
  - target:
      entity_id: input_number.yesterday_solar_generated
    data:
      value: '{{ states(''sensor.myenergi_eddi_generated_today'') | float(0) }}'
    action: input_number.set_value
  - target:
      entity_id: input_number.yesterday_grid_import
    data:
      value: '{{ states(''sensor.myenergi_eddi_grid_import_today'') | float(0) }}'
    action: input_number.set_value
  - target:
      entity_id: input_number.yesterday_grid_export
    data:
      value: '{{ states(''sensor.myenergi_eddi_grid_export_today'') | float(0) }}'
    action: input_number.set_value
  - target:
      entity_id: input_number.yesterday_import_cost
    data:
      value: '{% set n = states(''input_number.import_kwh_at_8am'') | float(0) %}{%
        set d = (states(''input_number.import_kwh_at_5pm'') | float(0)) - n %}{% set
        p = (states(''input_number.import_kwh_at_7pm'') | float(0)) - (states(''input_number.import_kwh_at_5pm'')
        | float(0)) %}{% set e = (states(''input_number.import_kwh_at_11pm'') | float(0))
        - (states(''input_number.import_kwh_at_7pm'') | float(0)) %}{% set ln = [states(''sensor.myenergi_eddi_grid_import_today'')
        | float(0) - states(''input_number.import_kwh_at_11pm'') | float(0), 0] |
        max %}{{ [n * 0.20 + d * 0.37 + p * 0.39 + e * 0.37 + ln * 0.20, 0] | max
        | round(4) }}'
    action: input_number.set_value
  - target:
      entity_id: input_number.yesterday_export_compensation
    data:
      value: '{{ (states(''sensor.myenergi_eddi_grid_export_today'') | float(0) *
        0.19) | round(4) }}'
    action: input_number.set_value
  - target:
      entity_id: input_number.yesterday_eddi_diverted
    data:
      value: '{{ states(''sensor.myenergi_eddi_green_energy_today'') | float(0) }}'
    action: input_number.set_value
  mode: single
- id: '1778228723586'
  alias: Energy - Daily Summary Notification
  description: At 8am each morning, sends a summary of yesterday's solar and electricity
    to NP3.
