        ''exceptional'': ''#FF4500''} %}{{ colors.get(condition, ''#1a73e8'') }}'
  - variables:
      notif_title: '{{ icon }} Today''s Weather – {{ now().strftime(''%A %-d %B'')
        }}'
      notif_message: "{{ icon }} {{ condition | replace('-', ' ') | title }}\n\n\U0001F321️
        \ High {{ fc.temperature | default(0) | round | int }}°C  ·  Low {{ fc.templow
        | default(0) | round | int }}°C\n\U0001F327️  Rain: {{ fc.precipitation_probability
        | default(0) | round | int }}%  ({{ fc.precipitation | default(0) | round(1)
        }}mm)\n\U0001F4A8  Wind: {{ fc.wind_speed | default(0) | round | int }} km/h"
  - if:
    - condition: template
      value_template: '{{ someone_away }}'
    then:
    - action: input_number.set_value
      target:
        entity_id: input_number.away_lat
      data:
        value: '{{ away_lat }}'
    - action: input_number.set_value
      target:
        entity_id: input_number.away_lon
      data:
        value: '{{ away_lon }}'
    - action: rest_command.get_away_location_name
      data:
        lat: '{{ away_lat }}'
        lon: '{{ away_lon }}'
      response_variable: geocode_resp
    - variables:
        away_name: '{% set addr = geocode_resp.content.address %}{% set city = addr.get(''city'',
          addr.get(''town'', addr.get(''village'', addr.get(''municipality'', ''Unknown''))))
          %}{{ city }}, {{ addr.get(''country'', '''') }}'
    - action: input_text.set_value
      target:
        entity_id: input_text.away_location_name
      data:
        value: '{{ away_name }}'
    - action: homeassistant.update_entity
      target:
        entity_id: sensor.away_weather_forecast
    - delay: 00:00:05
    - variables:
        away_icon: "{% set p = state_attr('sensor.away_weather_forecast', 'precipitation_probability_max')[0]
          | int(0) %}{% if p > 70 %}\U0001F327️{% elif p > 40 %}⛅{% elif p > 20 %}\U0001F324️{%
          else %}☀️{% endif %}"
        notif_message: "{{ notif_message }}\n\n─────────────\n\U0001F4CD {{ away_name
          }}\n{{ away_icon }} {{ away_person_name }}'s location\n\n\U0001F321️  High
          {{ state_attr('sensor.away_weather_forecast', 'temperature_2m_max')[0] |
          round | int }}°C  ·  Low {{ state_attr('sensor.away_weather_forecast', 'temperature_2m_min')[0]
          | round | int }}°C\n\U0001F327️  Rain: {{ state_attr('sensor.away_weather_forecast',
          'precipitation_probability_max')[0] | round | int }}%  ({{ state_attr('sensor.away_weather_forecast',
          'precipitation_sum')[0] | round(1) }}mm)\n\U0001F4A8  Wind: {{ state_attr('sensor.away_weather_forecast',
          'wind_speed_10m_max')[0] | round | int }} km/h"
  - action: notify.send_message
    target:
      entity_id: notify.np3
    data:
      title: '{{ notif_title }}'
      message: '{{ notif_message }}'
  - action: notify.send_message
    target:
      entity_id: notify.pixel_6a
    data:
      title: '{{ notif_title }}'
      message: '{{ notif_message }}'
  mode: single
  variables:
    colm_dist: '{{ distance(''person.colm_finn'', ''zone.home'') | float(0) }}'
    olivia_dist: '{{ distance(''person.olivia_finn'', ''zone.home'') | float(0) }}'
- id: '1778325782880'
  alias: Energy - Daily Grid-Free Celebration
  description: Notifies both phones at 8pm if zero grid electricity was imported today
    — a full solar day.
  triggers:
  - platform: time
    at: '20:00:00'
  conditions:
  - condition: template
    value_template: '{{ (states(''sensor.myenergi_eddi_grid_import_today'') | float(0))
      - (states(''input_number.grid_import_at_8am_baseline'') | float(0)) < 0.1 }}'
  actions:
  - action: notify.send_message
    target:
      entity_id:
      - notify.np3
      - notify.pixel_6a
    data:
      title: ☀️ Grid-Free Day!
      message: 'You went the whole day without importing from the grid after 8am!


        Exported: {{ states(''sensor.myenergi_eddi_grid_export_today'') | float(0)
        | round(2) }} kWh

        Earned: €{{ (states(''sensor.myenergi_eddi_grid_export_today'') | float(0)
        * 0.19) | round(2) }}'
  mode: single
- id: '1778325882100'
  alias: Energy - Snapshot Grid Import at 8am
  description: Captures the grid import total at 8am each day to use as a baseline,
    excluding overnight battery charging from the grid-free day calculation.
  triggers:
  - platform: time
    at: 08:00:00
  actions:
  - action: input_number.set_value
    target:
      entity_id: input_number.grid_import_at_8am_baseline
    data:
      value: '{{ states(''sensor.myenergi_eddi_grid_import_today'') | float(0) | round(3)
        }}'
  mode: single
- id: '1778349216347'
  alias: Alarm - Strobe on Triggered
  description: Strobe all downstairs lights when EITHER alarm (house or shed) is triggered.
    Uses the Alarmo master panel so it covers both areas. Restores previous light
    state after strobe. Siren to be added later.
  triggers:
  - platform: state
    entity_id: alarm_control_panel.master
    to: triggered
  conditions: []
  actions:
  - action: script.strobe_lights
    data:
      lights: light.downstairs
      while_entity: alarm_control_panel.master
      while_state: triggered
      on_seconds: 0.5
      off_seconds: 0.5
      brightness_pct: 100
  mode: restart
- id: '1778352065342'
  alias: Met Éireann Weather Warning
  description: Notifies when Met Éireann issues a new official weather warning
  triggers:
  - platform: state
    entity_id: sensor.met_eireann_active_warnings
    not_to:
    - unknown
    - unavailable
    - none
  conditions:
  - condition: template
    value_template: '{% set old = trigger.from_state.state %}

      {% set old_ids = [] if old in [''none'', ''unknown'', ''unavailable''] else
      old.split('','') %}

      {% set new_ids = trigger.to_state.state.split('','') %}

      {{ (new_ids | reject(''in'', old_ids) | list | length) > 0 }}'
  actions:
  - variables:
      level: '{{ state_attr(''sensor.met_eireann_active_warnings'', ''level'') | default(''Weather'')
        }}'
      headline: '{{ state_attr(''sensor.met_eireann_active_warnings'', ''headline'')
        | default('''') }}'
      expiry: '{{ state_attr(''sensor.met_eireann_active_warnings'', ''expiry'') |
        default('''') }}'
      severity: '{{ state_attr(''sensor.met_eireann_active_warnings'', ''severity'')
        | default('''') }}'
  - action: notify.send_message
    target:
      entity_id: notify.np3
    data:
      title: ⚠️ Met Éireann {{ level }} Warning
      message: '{{ headline }}

        Severity: {{ level }} / {{ severity }}

        {% if expiry %}Expires: {{ as_local(as_datetime(expiry)).strftime(''%H:%M
        %d/%m/%Y'') }}{% endif %}'
  - action: notify.send_message
    target:
      entity_id: notify.pixel_6a
    data:
      title: ⚠️ Met Éireann {{ level }} Warning
      message: '{{ headline }}

        Severity: {{ level }} / {{ severity }}

        {% if expiry %}Expires: {{ as_local(as_datetime(expiry)).strftime(''%H:%M
        %d/%m/%Y'') }}{% endif %}'
  mode: single
- id: '1778443028904'
  alias: Appliances - Reset Weekly Cycle Counters
  description: Resets all 3 appliance weekly cycle counters every Monday at midnight
  triggers:
  - platform: time
    at: 00:00:00
  conditions:
  - condition: time
    weekday:
    - mon
  actions:
  - action: counter.reset
    target:
      entity_id:
      - counter.dishwasher_weekly_cycles
      - counter.washing_machine_weekly_cycles
      - counter.tumble_dryer_weekly_cycles
  mode: single
- id: '1778443033804'
  alias: Appliances - Increment Weekly Cycle Counters
  description: Increments the weekly cycle counter for whichever appliance just finished
    a cycle
  triggers:
  - platform: state
    entity_id: input_select.dishwasher_run_status
    to: All Done!
    id: dishwasher
  - platform: state
    entity_id: input_select.washing_machine_run_status
    to: All Done!
    id: washing_machine
  - platform: state
    entity_id: input_select.tumble_dryer_run_status
    to: All Done!
    id: tumble_dryer
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: dishwasher
      sequence:
      - action: counter.increment
        target:
          entity_id: counter.dishwasher_weekly_cycles
    - conditions:
      - condition: trigger
        id: washing_machine
      sequence:
      - action: counter.increment
        target:
          entity_id: counter.washing_machine_weekly_cycles
    - conditions:
      - condition: trigger
        id: tumble_dryer
      sequence:
      - action: counter.increment
        target:
          entity_id: counter.tumble_dryer_weekly_cycles
  mode: parallel
  max: 3
- id: '1778870199308'
