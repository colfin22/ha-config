- id: '1779632326878'
  alias: Patio Door - Disable Rear Camera Detection
  description: Disables rear door and shed camera detection when patio door NFC tag
    is scanned; re-enables when patio door closes or after 6-hour timeout.
  triggers:
  - platform: tag
    tag_id: f958aada-03e8-4db5-9ccf-7c8f539ccf76
  actions:
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.patio_door_open
  - action: script.tts_announce
    data:
      message: Person detection on rear cameras disabled while the patio door is open.
      target_player: media_player.kitchen_display_cast
  - wait_for_trigger:
    - platform: state
      entity_id: binary_sensor.patio_door_contact
      to: 'off'
    timeout: 06:00:00
