- id: '1779385700033'
  alias: Netatmo - Integration Monitor
  description: 'Immediate notifications 07-22. Overnight outages: morning summary
    at 07:00 with down and restored times.'
  triggers:
  - id: offline
    platform: state
    entity_id: climate.hallway
    to: unavailable
    for: 00:05:00
  - id: online
    platform: state
    entity_id: climate.hallway
    from: unavailable
    not_to:
    - unavailable
    - unknown
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: offline
      sequence:
      - variables:
          offline_time: '{{ as_local(trigger.to_state.last_changed).strftime(''%H:%M'')
            }}'
      - if:
        - condition: time
          after: 07:00:00
          before: '22:00:00'
        then:
        - action: notify.send_message
          target:
            entity_id: notify.np3
          data:
            title: Netatmo Offline
            message: Netatmo integration has gone offline.
        else:
        - wait_for_trigger:
          - platform: time
            at: 07:00:00
          - platform: state
            entity_id: climate.hallway
            from: unavailable
        - if:
          - condition: template
            value_template: '{{ wait.trigger.platform == ''state'' }}'
          then:
          - variables:
              recovery_time: '{{ as_local(wait.trigger.to_state.last_changed).strftime(''%H:%M'')
                }}'
          - wait_for_trigger:
            - platform: time
              at: 07:00:00
          - action: notify.send_message
            target:
              entity_id: notify.np3
            data:
              title: Netatmo - Overnight Outage (Resolved)
              message: Netatmo went offline at {{ offline_time }} and recovered at
                {{ recovery_time }}.
          else:
          - action: notify.send_message
            target:
              entity_id: notify.np3
            data:
              title: Netatmo Offline Overnight
              message: Netatmo integration went offline at {{ offline_time }} and
                is still down.
    - conditions:
      - condition: trigger
        id: online
      sequence:
      - condition: time
        after: 07:00:00
        before: '22:00:00'
      - action: notify.send_message
        target:
          entity_id: notify.np3
        data:
          title: Netatmo Back Online
          message: Netatmo integration has reconnected.
  mode: parallel
- id: '1779457541161'
  alias: MikroTik Backup Notification
  description: Receives webhook from Proxmox when MikroTik backup completes. Notifies
    immediately 07:00-22:00, otherwise holds until 07:00.
  triggers:
  - platform: webhook
    webhook_id: mikrotik-backup-result
    allowed_methods:
    - POST
    local_only: true
  actions:
  - variables:
      title: '{{ trigger.json.title }}'
      message: '{{ trigger.json.message }}'
  - choose:
    - conditions:
      - condition: time
        after: 07:00:00
        before: '22:00:00'
      sequence:
      - data:
          title: '{{ title }}'
          message: '{{ message }}'
        action: notify.mobile_app_np3
    default:
    - wait_for_trigger:
      - platform: time
        at: 07:00:00
    - data:
        title: '{{ title }}'
        message: '{{ message }}'
      action: notify.mobile_app_np3
  mode: single
- id: '1779464893871'
  alias: Landing - Occupancy Lighting
  description: Activates landing light on motion when lux < 20 or light is already
    on. Bright scene from 30min after sunrise to 30min before sunset; dimmed otherwise.
    Timer restarts on re-trigger. Fades to off over 5s.
  triggers:
  - platform: state
    entity_id: binary_sensor.landing_motion_sensor_occupancy
    to: 'on'
  conditions:
  - condition: or
    conditions:
    - condition: numeric_state
      entity_id: sensor.landing_motion_sensor_illuminance
      below: 20
    - condition: state
      entity_id: light.landing_1
      state: 'on'
  actions:
  - choose:
    - conditions:
      - condition: sun
        after: sunrise
        after_offset: 00:30:00
        before: sunset
        before_offset: -00:30:00
      sequence:
      - action: scene.turn_on
        target:
          entity_id: scene.landing_bright
    default:
    - action: scene.turn_on
      target:
        entity_id: scene.landing_dimmed
  - delay: 00:02:55
  - action: light.turn_on
    target:
      entity_id: light.landing_1
    data:
      brightness: 1
      transition: 5
  - delay: 00:00:05
  - action: light.turn_off
    target:
      entity_id: light.landing_1
  mode: restart
