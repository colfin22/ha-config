  - platform: webhook
    webhook_id: zabbix-alert
    local_only: true
    allowed_methods:
    - POST
  actions:
  - variables:
      alert_time: '{{ now().strftime(''%H:%M'') }}'
      alert_title: 'Zabbix {{ trigger.json.status }}: {{ trigger.json.name }}'
      alert_message: '{{ trigger.json.host }} [{{ trigger.json.severity }}] — {{ trigger.json.message
        }}'
  - if:
    - condition: time
      after: 07:00:00
      before: '22:00:00'
