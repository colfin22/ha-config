    helper_state | regex_match(\"((\\[[^\\}]+)?\\{s*[^\\}\\{]{3,}?:.*\\}([^\\{]+\\])?)\")
    else {} %} {% if helper.v | default(0) == 6 %}\n  {{ helper.man | default(0) |
    int == 1 and\n     helper.ts.man | default(0) | int > 0 and\n     now() >= (helper.ts.man
    + 60 * reset_override_timeout) | as_datetime | as_local }}\n{% else %}\n  {{ false
    }}\n{% endif %}"
