conditions:
- condition: !input auto_global_condition
- or:
  - '{{ trigger.to_state is not defined }}'
  - '{{ trigger.to_state is defined and trigger.to_state.state not in invalid_states
    }}'
- or:
  - '{{ trigger.id is not defined }}'
  - '{{ not trigger.id | regex_match(''^t_calendar_event'') }}'
  - and:
    - '{{ trigger.id | regex_match(''^t_calendar_event'') }}'
    - '{{ state_attr(calendar_entity, ''message'') is not none }}'
    - "{{\n  calendar_open_title_lc in (state_attr(calendar_entity, 'message') | lower)
      or\n  calendar_close_title_lc in (state_attr(calendar_entity, 'message') | lower)\n}}"
- condition: template
  value_template: "{% if trigger.id is match('^t_shading_start_pending_[1-6]$') %}\n
    \ {{ not (states(cover_status_helper) not in invalid_states and states(cover_status_helper)
    | regex_search('\"shd\"\\s*:\\s*1\\s*[,}]')) }}\n{% elif trigger.id is match('^t_shading_end_pending_[1-7]$')
    %}\n  {{ states(cover_status_helper) not in invalid_states and states(cover_status_helper)
    | regex_search('\"shd\"\\s*:\\s*1\\s*[,}]') }}\n{% else %}\n  true\n{% endif %}"
actions:
- variables:
    cover_move_action:
      sequence:
      - condition: template
        value_template: '{{ not prevent_flags.default_cover_actions }}'
      - condition: template
        value_template: '{{ not is_paused }}'
      - condition: template
        value_template: '{{ not (target_position | default(101) >= current_position
          | default(101) - position_tolerance | default(0) and target_position | default(101)
          <= current_position | default(101) + position_tolerance | default(0)) }}'
      - repeat:
          for_each: '{{ blind_entities | list }}'
          sequence:
          - choose:
            - alias: 'Cover move: full close'
              conditions: '{{ target_position | default(101) | int == 0 }}'
              sequence:
              - action: cover.close_cover
                target:
                  entity_id: '{{ repeat.item if repeat is defined else '''' }}'
            - alias: 'Cover move: full open'
              conditions: '{{ target_position | default(101) | int == 100 }}'
              sequence:
              - action: cover.open_cover
                target:
                  entity_id: '{{ repeat.item if repeat is defined else '''' }}'
            - alias: 'Cover move: partial position (1-99)'
              conditions: '{{ 0 < target_position | default(101) | int < 100 }}'
              sequence:
              - action: cover.set_cover_position
                data:
                  position: '{{ target_position | default(101) | int }}'
                target:
                  entity_id: '{{ repeat.item if repeat is defined else '''' }}'
          - delay:
              seconds: '{{ range(1, 3) | random }}'
    tilt_move_action:
      sequence:
      - condition: template
        value_template: '{{ not prevent_flags.default_cover_actions and is_cover_tilt_enabled_and_possible
          and not is_paused }}'
      - repeat:
          for_each: '{{ blind_entities | list }}'
          sequence:
          - if: '{{ state_attr(repeat.item if repeat is defined else '''', ''current_tilt_position'')
              is defined }}'
            then:
            - if: '{{ tilt_first | default(false) }}'
              then:
              - action: cover.set_cover_tilt_position
                data:
                  tilt_position: 0
                target:
                  entity_id: '{{ repeat.item if repeat is defined else '''' }}'
              - delay:
                  seconds: &id002 !input tilt_delay
            - choose:
              - alias: 'Tilt wait: until movement stops'
                conditions: '{{ is_tilt_wait_idle_mode | default(false) }}'
                sequence:
                - wait_template: '{{ states(repeat.item if repeat is defined else
                    '''') in [''open'', ''closed''] }}'
                  timeout: '{{ tilt_wait_timeout | int }}'
                  continue_on_timeout: true
                - if: '{{ wait.completed if wait is defined else '''' }}'
                  then:
                  - delay: 1
              default:
              - delay:
                  seconds: &id003 !input tilt_delay
            - action: cover.set_cover_tilt_position
              data:
                tilt_position: '{{ target_tilt_position | default(101) }}'
              target:
                entity_id: '{{ repeat.item if repeat is defined else '''' }}'
            - delay:
                seconds: '{{ range(1, 3) | random }}'
    helper_update:
      choose: []
      default:
      - action: input_text.set_value
        data:
          entity_id: &id001 !input cover_status_helper
          value: "{% set current = helper_json %}\n{% set updates = update_values
            | default({}) %}\n{% set ts_now = as_timestamp(now()) | round(0) %}\n\n{%
            set new_bas = updates.bas | default(current.bas | default('opn')) %}\n{%
            set new_shd = updates.shd | default(current.shd | default(0)) | int %}\n{%
            set new_pnd = updates.pnd | default(current.pnd | default('non')) %}\n{%
            set new_win = updates.win | default(current.win | default('cls')) %}\n{%
            set new_frc = updates.frc | default(current.frc | default('non')) %}\n{%
            set new_res = updates.res | default(current.res | default(0)) | int %}\n{%
            set new_man = updates.man | default(current.man | default(0)) | int %}\n{%
            set current_ts = current.ts | default({}) %}\n\n{% set merged_ts = namespace(data={})
            %}\n{% for key in ['opn', 'cls', 'shd', 'due', 'arm', 'man'] %}\n  {%
            set merged_ts.data = dict(merged_ts.data, **{key: current_ts[key] | default(0)
            | int}) %}\n{% endfor %}\n{% if 'ts' in updates %}\n  {% for key, value
            in updates.ts.items() %}\n    {% set merged_ts.data = dict(merged_ts.data,
            **{key: (ts_now if value == 'now' else value) | int}) %}\n  {% endfor
            %}\n{% endif %}\n{% if new_shd == (current.shd | default(0) | int) and
            'ts' in updates and 'shd' in updates.ts %}\n  {% set merged_ts.data =
            dict(merged_ts.data, **{'shd': current_ts.shd | default(0) | int}) %}\n{%
            endif %}\n\n{% set dict_new = {\n  'bas': new_bas,\n  'shd': new_shd |
            int,\n  'pnd': new_pnd,\n  'win': new_win,\n  'frc': new_frc,\n  'res':
            new_res | int,\n  'man': new_man | int,\n  'ts': {\n    'opn': merged_ts.data.opn
            | default(0) | int,\n    'cls': merged_ts.data.cls | default(0) | int,\n
            \   'shd': merged_ts.data.shd | default(0) | int,\n    'due': merged_ts.data.due
            | default(0) | int,\n    'arm': merged_ts.data.arm | default(0) | int,\n
            \   'man': merged_ts.data.man | default(0) | int\n  },\n  'v': 6,\n  't':
            ts_now | int\n} %}\n{{ dict_new | to_json }}"
      - if: '{{ enable_logbook }}'
        then:
        - action: logbook.log
          data:
            name: '{{ this.attributes.friendly_name }}'
            entity_id: '{{ this.entity_id }}'
            message: "Trigger: {{ trigger.id | default('manual') }} | \nEffective:
              {{ effective_state }} | \nPosition: {{ current_position }}% {% if is_cover_tilt_enabled
              %} / Tilt: {{ current_tilt_position }}%{% endif %} | \nHelper: bas={{
              helper_json.bas | default('opn') }} shd={{ helper_json.shd | default(0)
              }} pnd={{ helper_json.pnd | default('non') }} win={{ helper_json.win
              | default('cls') }} frc={{ helper_json.frc | default('non') }} res={{
              helper_json.res | default(0) }} man={{ helper_json.man | default(0)
              }} | \nStates: \nopn={{ states(contact_window_opened) if contact_window_opened
              != [] else '-' }} \ntlt={{ states(contact_window_tilted) if contact_window_tilted
              != [] else '-' }}\nres={{ state_resident }} \nsun_elev={{ current_sun_elevation
              | float(default=0) }}°({{ sun_elevation_up_current | float(default=0)
              | round(1) }}°/{{ sun_elevation_down_current | float(default=0) | round(1)
              }})° \nazim={{ current_sun_azimuth | float(default=0) | round(1) }}°\nbri={{
              states(default_brightness_sensor) if default_brightness_sensor != []
              else '-' }} \nt1={{ states(shading_temperatur_sensor1) if shading_temperatur_sensor1
              != [] else '-' }} \nt2={{ states(shading_temperatur_sensor2) if shading_temperatur_sensor2
              != [] else '-' }}\nupdate={{ update_values | default({}) | to_json }}
              \n{% if log_extra is defined %} extra={{ log_extra }}{% endif %}"
- if:
  - '{{ cover_status_helper != [] }}'
  - or:
    - '{{ states(cover_status_helper) in invalid_states }}'
    - '{{ not states(cover_status_helper) | regex_match("((\[[^\}]+)?\{s*[^\}\{]{3,}?:.*\}([^\{]+\])?)")
      }}'
  then:
  - action: input_text.set_value
    data:
      entity_id: !input cover_status_helper
      value: "{% set ts_now = as_timestamp(now()) | round(0) %} {% set dict_new =
        {\n  'bas': 'opn',\n  'shd': 0,\n  'pnd': 'non',\n  'win': 'cls',\n  'frc':
        'non',\n  'res': 0,\n  'man': 0,\n  'ts': {\n    'opn': 0,\n    'cls': 0,\n
        \   'shd': 0,\n    'due': 0,\n    'arm': 0,\n    'man': 0\n  },\n  'v': 6,\n
        \ 't': ts_now | int\n} %} {{ dict_new | to_json }}"
- if:
  - condition: template
    value_template: '{% set helper_state = states(cover_status_helper) %} {% set helper_raw
      = helper_state | from_json(default={}) if helper_state not in invalid_states
      else {} %} {% set raw_ts = helper_raw.ts | default({}) %} {% set known_ts_keys
      = [''opn'', ''cls'', ''shd'', ''due'', ''arm'', ''man''] %} {% set has_unknown_ts
      = raw_ts.keys() | reject(''in'', known_ts_keys) | list | count > 0 %} {{ helper_raw.v
      | default(0) != 6 or has_unknown_ts }}'
  then:
  - variables:
      update_values: {}
  - choose: []
    default:
    - action: input_text.set_value
      data:
        entity_id: *id001
        value: "{% set current = helper_json %}\n{% set updates = update_values |
          default({}) %}\n{% set ts_now = as_timestamp(now()) | round(0) %}\n\n{%
          set new_bas = updates.bas | default(current.bas | default('opn')) %}\n{%
          set new_shd = updates.shd | default(current.shd | default(0)) | int %}\n{%
          set new_pnd = updates.pnd | default(current.pnd | default('non')) %}\n{%
          set new_win = updates.win | default(current.win | default('cls')) %}\n{%
          set new_frc = updates.frc | default(current.frc | default('non')) %}\n{%
          set new_res = updates.res | default(current.res | default(0)) | int %}\n{%
          set new_man = updates.man | default(current.man | default(0)) | int %}\n{%
          set current_ts = current.ts | default({}) %}\n\n{% set merged_ts = namespace(data={})
          %}\n{% for key in ['opn', 'cls', 'shd', 'due', 'arm', 'man'] %}\n  {% set
          merged_ts.data = dict(merged_ts.data, **{key: current_ts[key] | default(0)
          | int}) %}\n{% endfor %}\n{% if 'ts' in updates %}\n  {% for key, value
          in updates.ts.items() %}\n    {% set merged_ts.data = dict(merged_ts.data,
          **{key: (ts_now if value == 'now' else value) | int}) %}\n  {% endfor %}\n{%
          endif %}\n{% if new_shd == (current.shd | default(0) | int) and 'ts' in
          updates and 'shd' in updates.ts %}\n  {% set merged_ts.data = dict(merged_ts.data,
          **{'shd': current_ts.shd | default(0) | int}) %}\n{% endif %}\n\n{% set
          dict_new = {\n  'bas': new_bas,\n  'shd': new_shd | int,\n  'pnd': new_pnd,\n
          \ 'win': new_win,\n  'frc': new_frc,\n  'res': new_res | int,\n  'man':
          new_man | int,\n  'ts': {\n    'opn': merged_ts.data.opn | default(0) |
          int,\n    'cls': merged_ts.data.cls | default(0) | int,\n    'shd': merged_ts.data.shd
          | default(0) | int,\n    'due': merged_ts.data.due | default(0) | int,\n
          \   'arm': merged_ts.data.arm | default(0) | int,\n    'man': merged_ts.data.man
          | default(0) | int\n  },\n  'v': 6,\n  't': ts_now | int\n} %}\n{{ dict_new
          | to_json }}"
    - if: '{{ enable_logbook }}'
      then:
      - action: logbook.log
        data:
          name: '{{ this.attributes.friendly_name }}'
          entity_id: '{{ this.entity_id }}'
          message: "Trigger: {{ trigger.id | default('manual') }} | \nEffective: {{
            effective_state }} | \nPosition: {{ current_position }}% {% if is_cover_tilt_enabled
            %} / Tilt: {{ current_tilt_position }}%{% endif %} | \nHelper: bas={{
            helper_json.bas | default('opn') }} shd={{ helper_json.shd | default(0)
            }} pnd={{ helper_json.pnd | default('non') }} win={{ helper_json.win |
            default('cls') }} frc={{ helper_json.frc | default('non') }} res={{ helper_json.res
            | default(0) }} man={{ helper_json.man | default(0) }} | \nStates: \nopn={{
            states(contact_window_opened) if contact_window_opened != [] else '-'
            }} \ntlt={{ states(contact_window_tilted) if contact_window_tilted !=
            [] else '-' }}\nres={{ state_resident }} \nsun_elev={{ current_sun_elevation
            | float(default=0) }}°({{ sun_elevation_up_current | float(default=0)
            | round(1) }}°/{{ sun_elevation_down_current | float(default=0) | round(1)
            }})° \nazim={{ current_sun_azimuth | float(default=0) | round(1) }}°\nbri={{
            states(default_brightness_sensor) if default_brightness_sensor != [] else
            '-' }} \nt1={{ states(shading_temperatur_sensor1) if shading_temperatur_sensor1
            != [] else '-' }} \nt2={{ states(shading_temperatur_sensor2) if shading_temperatur_sensor2
            != [] else '-' }}\nupdate={{ update_values | default({}) | to_json }}
            \n{% if log_extra is defined %} extra={{ log_extra }}{% endif %}"
- if:
  - '{{ is_shading_enabled }}'
  - '{{ forecast_source.use_weather and not forecast_source.prevent_service }}'
  - '{{ states(shading_forecast_sensor) not in invalid_states }}'
  - '{{ trigger.id is defined }}'
  - '{{ trigger.id | regex_match(''^(t_shading_start|t_open_1)'') }}'
  then:
  - action: weather.get_forecasts
    target:
      entity_id: !input shading_forecast_sensor
    data:
      type: '{{ shading_forecast_type }}'
    response_variable: weather_forecast
    continue_on_error: true
- if:
  - '{{ is_calendar_enabled }}'
  - '{{ calendar_entity != [] }}'
  - '{{ states(calendar_entity) not in invalid_states }}'
  - '{{ trigger.id is defined }}'
  - or:
    - '{{ trigger.id | regex_match(''^t_open'') }}'
    - '{{ trigger.id | regex_match(''^t_close'') }}'
    - '{{ trigger.id | regex_match(''^t_shading_start'') }}'
    - '{{ trigger.id | regex_match(''^t_shading_end'') }}'
    - '{{ trigger.id | regex_match(''^t_calendar_event'') }}'
  then:
  - action: calendar.get_events
    target:
      entity_id: !input calendar_entity
    data:
      start_date_time: '{{ today_at(''00:00:00'').isoformat() }}'
      end_date_time: '{{ (today_at(''23:59:59'') + timedelta(seconds=1)).isoformat()
        }}'
    response_variable: calendar_events
    continue_on_error: true
- variables:
    forecast_temp_raw: "{% set sensor = shading_forecast_temp_sensor %} {% set weather
      = shading_forecast_sensor %} {% if sensor != [] and states(sensor) not in invalid_states
      %}\n  {{ states(sensor) | float(default=None) }}\n{% elif weather == [] or states(weather)
      in invalid_states %}\n  {{ None }}\n{% elif 'weather_attributes' in shading_forecast_type
      %}\n  {{ state_attr(weather, 'temperature') | float(default=None) }}\n{% elif
      weather_forecast is defined and weather in weather_forecast %}\n  {{ weather_forecast[weather].forecast[0].temperature
      | default(None) | float(default=None) }}\n{% else %}\n  {{ None }}\n{% endif
      %}"
    forecast_weather_condition_raw: "{% set weather = shading_forecast_sensor %} {%
      if weather == [] or states(weather) in invalid_states %}\n  {{ None }}\n{% elif
      'weather_attributes' in shading_forecast_type %}\n  {{ states(weather) }}\n{%
      elif weather_forecast is defined and weather in weather_forecast %}\n  {{ weather_forecast[weather].forecast[0].condition
      | default(None) }}\n{% else %}\n  {{ None }}\n{% endif %}"
    diag_forecast_weather_attribute_mode: "{% if forecast_source.prevent_service %}\n
      \ {{\n    {\n      'attribute_value': forecast_weather_condition_raw,\n      'in_configured_list':
      (forecast_weather_condition_raw in shading_weather_conditions)\n                            if
      forecast_weather_condition_raw is not none else none,\n      'configured_list':
      shading_weather_conditions\n    }\n  }}\n{% endif %}"
    shading_start_condition_states:
      azimuth_valid: "{{\n  not is_shading_enabled or\n  not shading_start_condition_enabled.azimuth
        or\n  default_sun_sensor == [] or\n  (\n    current_sun_azimuth | float(default=0)
        > shading_azimuth_start and\n    current_sun_azimuth | float(default=0) <
        shading_azimuth_end\n  )\n}}"
      elevation_valid: "{{\n  not is_shading_enabled or\n  not shading_start_condition_enabled.elevation
        or\n  default_sun_sensor == [] or\n  (\n    current_sun_elevation | float(default=0)
        > shading_elevation_min and\n    current_sun_elevation | float(default=0)
        < shading_elevation_max\n  )\n}}"
      brightness_valid: "{{\n  not is_shading_enabled or\n  not shading_start_condition_enabled.brightness
        or\n  shading_brightness_sensor == [] or\n  (\n    states(shading_brightness_sensor)
        in invalid_states and\n    trigger is defined and trigger.id == 't_shading_start_pending_2'\n
        \ ) or\n  (\n    states(shading_brightness_sensor) not in invalid_states and\n
        \   states(shading_brightness_sensor) | float(default=shading_sun_brightness_start)
        > (shading_sun_brightness_start + shading_sun_brightness_hysteresis)\n  )\n}}"
      temp1_valid: "{{\n  not is_shading_enabled or\n  not shading_start_condition_enabled.temp1
        or\n  shading_temperatur_sensor1 == [] or\n  (\n    states(shading_temperatur_sensor1)
        in invalid_states and\n    trigger is defined and trigger.id == 't_shading_start_pending_3'\n
        \ ) or\n  (\n    states(shading_temperatur_sensor1) not in invalid_states
        and\n    states(shading_temperatur_sensor1) | float(default=shading_min_temperatur1)
        > (shading_min_temperatur1 + shading_temperature_hysteresis1)\n  )\n}}"
      temp2_valid: "{{\n  not is_shading_enabled or\n  not shading_start_condition_enabled.temp2
        or\n  shading_temperatur_sensor2 == [] or\n  (\n    states(shading_temperatur_sensor2)
        in invalid_states and\n    trigger is defined and trigger.id == 't_shading_start_pending_4'\n
        \ ) or\n  (\n    states(shading_temperatur_sensor2) not in invalid_states
        and\n    states(shading_temperatur_sensor2) | float(default=shading_min_temperatur2)
        > (shading_min_temperatur2 + shading_temperature_hysteresis2)\n  )\n}}"
      forecast_temp_valid: "{{\n  not is_shading_enabled or\n  not shading_start_condition_enabled.forecast_temp
        or\n  shading_forecast_temp == [] or\n  (\n    forecast_temp_raw is not none
        and\n    forecast_temp_raw > (shading_forecast_temp + shading_forecast_temp_hysteresis)\n
        \ ) or\n  (\n    'shading_compare_forecast_with_sensor2' in shading_config
        and\n    shading_temperatur_sensor2 != [] and\n    shading_forecast_temp !=
        [] and\n    (states(shading_temperatur_sensor2) | float(default=0) > (shading_forecast_temp
        + shading_forecast_temp_hysteresis))\n  )\n}}"
      forecast_weather_valid: "{{\n  not is_shading_enabled or\n  not shading_start_condition_enabled.forecast_weather
        or\n  shading_weather_conditions == [] or\n  forecast_source.use_sensor or\n
        \ (\n    forecast_weather_condition_raw is not none and\n    forecast_weather_condition_raw
        not in invalid_states and\n    forecast_weather_condition_raw in shading_weather_conditions\n
        \ )\n}}"
    shading_start_and_result: "{{\n  (\n    ('cond_azimuth' not in shading_conditions_start_and
      or\n    default_sun_sensor == [] or\n    shading_start_condition_states.azimuth_valid)\n
      \   and\n    ('cond_elevation' not in shading_conditions_start_and or\n    default_sun_sensor
      == [] or\n    shading_start_condition_states.elevation_valid)\n    and\n    ('cond_brightness'
      not in shading_conditions_start_and or\n    shading_brightness_sensor == []
      or\n    shading_start_condition_states.brightness_valid)\n    and\n    ('cond_temp1'
      not in shading_conditions_start_and or\n    shading_temperatur_sensor1 == []
      or\n    shading_start_condition_states.temp1_valid)\n    and\n    ('cond_temp2'
      not in shading_conditions_start_and or\n    shading_temperatur_sensor2 == []
      or\n    shading_start_condition_states.temp2_valid)\n    and\n    ('cond_forecast_temp'
      not in shading_conditions_start_and or\n    shading_forecast_temp == [] or\n
      \   shading_start_condition_states.forecast_temp_valid)\n    and\n    ('cond_forecast_weather'
      not in shading_conditions_start_and or\n    shading_weather_conditions == []
      or\n    shading_start_condition_states.forecast_weather_valid)\n  )\n}}"
    shading_start_or_result: "{{\n  (shading_conditions_start_or | count == 0) or\n
      \ (\n    ('cond_azimuth' in shading_conditions_start_or and\n    default_sun_sensor
      != [] and\n    shading_start_condition_states.azimuth_valid)\n    or\n    ('cond_elevation'
      in shading_conditions_start_or and\n    default_sun_sensor != [] and\n    shading_start_condition_states.elevation_valid)\n
      \   or\n    ('cond_brightness' in shading_conditions_start_or and\n    shading_brightness_sensor
      != [] and\n    shading_start_condition_states.brightness_valid)\n    or\n    ('cond_temp1'
      in shading_conditions_start_or and\n    shading_temperatur_sensor1 != [] and\n
      \   shading_start_condition_states.temp1_valid)\n    or\n    ('cond_temp2' in
      shading_conditions_start_or and\n    shading_temperatur_sensor2 != [] and\n
      \   shading_start_condition_states.temp2_valid)\n    or\n    ('cond_forecast_temp'
      in shading_conditions_start_or and\n    shading_forecast_temp != [] and\n    shading_start_condition_states.forecast_temp_valid)\n
      \   or\n    ('cond_forecast_weather' in shading_conditions_start_or and\n    shading_weather_conditions
      != [] and\n    shading_start_condition_states.forecast_weather_valid)\n  )\n}}"
    shading_start_conditions_met: "{{\n  is_shading_enabled and\n  shading_start_and_result
      and\n  shading_start_or_result\n}}"
    shading_end_condition_states:
      azimuth_invalid: "{{\n  is_shading_enabled and\n  shading_end_condition_enabled.azimuth
        and\n  default_sun_sensor != [] and\n  (\n    current_sun_azimuth | float(default=999)
        <= shading_azimuth_start or\n    current_sun_azimuth | float(default=0) >=
        shading_azimuth_end\n  )\n}}"
      elevation_invalid: "{{\n  is_shading_enabled and\n  shading_end_condition_enabled.elevation
        and\n  default_sun_sensor != [] and\n  (\n    current_sun_elevation | float(default=999)
        <= shading_elevation_min or\n    current_sun_elevation | float(default=0)
        >= shading_elevation_max\n  )\n}}"
      brightness_invalid: "{{\n  is_shading_enabled and\n  shading_end_condition_enabled.brightness
        and\n  shading_brightness_sensor != [] and\n  states(shading_brightness_sensor)
        not in invalid_states and\n  states(shading_brightness_sensor) | float(default=999999)
        < (shading_sun_brightness_end - shading_sun_brightness_hysteresis)\n}}"
      temp1_invalid: "{{\n  is_shading_enabled and\n  shading_end_condition_enabled.temp1
        and\n  shading_temperatur_sensor1 != [] and\n  states(shading_temperatur_sensor1)
        not in invalid_states and\n  states(shading_temperatur_sensor1) | float(default=999)
        < (shading_min_temperatur1 - shading_temperature_hysteresis1)\n}}"
      temp2_invalid: "{{\n  is_shading_enabled and\n  shading_end_condition_enabled.temp2
        and\n  shading_temperatur_sensor2 != [] and\n  states(shading_temperatur_sensor2)
        not in invalid_states and\n  states(shading_temperatur_sensor2) | float(default=999)
        < (shading_min_temperatur2 - shading_temperature_hysteresis2)\n}}"
      forecast_temp_invalid: "{{\n  is_shading_enabled and\n  shading_end_condition_enabled.forecast_temp
        and\n  shading_forecast_temp != [] and\n  forecast_temp_raw is not none and\n
        \ forecast_temp_raw < (shading_forecast_temp - shading_forecast_temp_hysteresis)\n}}"
      forecast_weather_invalid: "{{\n  is_shading_enabled and\n  shading_end_condition_enabled.forecast_weather
        and\n  shading_weather_conditions != [] and\n  shading_forecast_sensor !=
        [] and\n  forecast_weather_condition_raw is not none and\n  forecast_weather_condition_raw
        not in invalid_states and\n  forecast_weather_condition_raw not in shading_weather_conditions\n}}"
    shading_end_and_result: "{{\n  shading_conditions_end_and | count > 0 and\n  (\n
      \   ('cond_azimuth' not in shading_conditions_end_and or\n    default_sun_sensor
      == [] or\n    shading_end_condition_states.azimuth_invalid)\n    and\n    ('cond_elevation'
      not in shading_conditions_end_and or\n    default_sun_sensor == [] or\n    shading_end_condition_states.elevation_invalid)\n
      \   and\n    ('cond_brightness' not in shading_conditions_end_and or\n    shading_brightness_sensor
      == [] or\n    shading_end_condition_states.brightness_invalid)\n    and\n    ('cond_temp1'
      not in shading_conditions_end_and or\n    shading_temperatur_sensor1 == [] or\n
      \   shading_end_condition_states.temp1_invalid)\n    and\n    ('cond_temp2'
      not in shading_conditions_end_and or\n    shading_temperatur_sensor2 == [] or\n
      \   shading_end_condition_states.temp2_invalid)\n    and\n    ('cond_forecast_temp'
      not in shading_conditions_end_and or\n    shading_forecast_temp == [] or\n    shading_end_condition_states.forecast_temp_invalid)\n
      \   and\n    ('cond_forecast_weather' not in shading_conditions_end_and or\n
      \   shading_weather_conditions == [] or\n    shading_end_condition_states.forecast_weather_invalid)\n
      \ )\n}}"
    shading_end_or_result: "{{\n  shading_conditions_end_or | count > 0 and\n  (\n
      \   ('cond_azimuth' in shading_conditions_end_or and\n    shading_end_condition_states.azimuth_invalid)\n
      \   or\n    ('cond_elevation' in shading_conditions_end_or and\n    shading_end_condition_states.elevation_invalid)\n
      \   or\n    ('cond_brightness' in shading_conditions_end_or and\n    shading_end_condition_states.brightness_invalid)\n
      \   or\n    ('cond_temp1' in shading_conditions_end_or and\n    shading_end_condition_states.temp1_invalid)\n
      \   or\n    ('cond_temp2' in shading_conditions_end_or and\n    shading_end_condition_states.temp2_invalid)\n
      \   or\n    ('cond_forecast_temp' in shading_conditions_end_or and\n    shading_end_condition_states.forecast_temp_invalid)\n
      \   or\n    ('cond_forecast_weather' in shading_conditions_end_or and\n    shading_end_condition_states.forecast_weather_invalid)\n
      \ )\n}}"
    shading_end_conditions_met: "{{\n  is_shading_enabled and\n  (\n    shading_end_and_result
      or\n    shading_end_or_result\n  )\n}}"
    calendar_open_event: "{% set result = namespace(found=false, start=none, end=none)
      %} {% if is_calendar_enabled and calendar_events is defined and calendar_entity
      in calendar_events %}\n  {% set events = calendar_events[calendar_entity].events
      | default([]) %}\n  {% for event in events %}\n    {% set summary = (event.summary
      | default('')) | lower | trim %}\n    {% if calendar_open_title_lc != '' and
      calendar_open_title_lc in summary %}\n      {% set result.found = true %}\n
      \     {% set result.start = event.start %}\n      {% set result.end = event.end
      %}\n    {% endif %}\n  {% endfor %}\n{% endif %} {{ {\n  'found': result.found,\n
      \ 'start': result.start,\n  'end': result.end\n} }}"
    calendar_close_event: "{% set result = namespace(found=false, start=none, end=none)
      %} {% if is_calendar_enabled and calendar_events is defined and calendar_entity
      in calendar_events %}\n  {% set events = calendar_events[calendar_entity].events
      | default([]) %}\n  {% for event in events %}\n    {% set summary = (event.summary
      | default('')) | lower | trim %}\n    {% if calendar_close_title_lc != '' and
      calendar_close_title_lc in summary %}\n      {% set result.found = true %}\n
      \     {% set result.start = event.start %}\n      {% set result.end = event.end
      %}\n    {% endif %}\n  {% endfor %}\n{% endif %} {{ {\n  'found': result.found,\n
      \ 'start': result.start,\n  'end': result.end\n} }}"
    now_ts: '{{ as_timestamp(now()) }}'
    calendar_open_start: "{% if calendar_open_event.found and calendar_open_event.start
      is not none %}\n  {{ as_timestamp(calendar_open_event.start) }}\n{% else %}\n
      \ {{ none }}\n{% endif %}"
    calendar_open_end: "{% if calendar_open_event.found and calendar_open_event.end
      is not none %}\n  {{ as_timestamp(calendar_open_event.end) }}\n{% else %}\n
      \ {{ none }}\n{% endif %}"
    calendar_close_start: "{% if calendar_close_event.found and calendar_close_event.start
      is not none %}\n  {{ as_timestamp(calendar_close_event.start) }}\n{% else %}\n
      \ {{ none }}\n{% endif %}"
    calendar_close_end: "{% if calendar_close_event.found and calendar_close_event.end
      is not none %}\n  {{ as_timestamp(calendar_close_event.end) }}\n{% else %}\n
      \ {{ none }}\n{% endif %}"
    is_opening_phase: "{{\n  (\n    is_time_field_enabled and\n    now() >= today_at(time_up_early_today)
      and\n    now() < today_at(time_up_late_today)\n  ) or\n  (\n    is_calendar_enabled
      and\n    calendar_open_start is not none and\n    calendar_open_end is not none
      and\n    now_ts >= calendar_open_start and\n    now_ts < calendar_open_end\n
      \ )\n}}"
    is_daytime_phase: "{{\n  is_time_control_disabled or\n  (\n    is_time_field_enabled
      and\n    now() >= today_at(time_up_early_today) and\n    now() < today_at(time_down_early_today))
      or\n  (\n    is_calendar_enabled and\n    calendar_open_start is not none and\n
      \   calendar_close_start is not none and\n    now_ts >= calendar_open_start
      and\n    now_ts < calendar_close_start)\n}}"
    is_closing_phase: "{{\n  (\n    is_time_field_enabled and\n    now() >= today_at(time_down_early_today)
      and\n    now() < today_at(time_down_late_today)\n  ) or\n  (\n    is_calendar_enabled
      and\n    calendar_close_start is not none and\n    calendar_close_end is not
      none and\n    now_ts >= calendar_close_start and\n    now_ts < calendar_close_end\n
      \ )\n}}"
    is_evening_phase: "{{\n  not is_time_control_disabled and\n  (\n    (\n      is_time_field_enabled
      and\n      now() >= today_at(time_down_early_today)\n    ) or\n    (\n      is_calendar_enabled
      and\n      calendar_close_start is not none and\n      now_ts >= calendar_close_start\n
      \   )\n  )\n}}"
    is_time_up_late: "{{\n  (\n    is_time_field_enabled and\n    now() >= today_at(time_up_late_today)
      and\n    now() < today_at(time_down_early_today)\n  ) or\n  (\n    is_calendar_enabled
      and\n    calendar_open_end is not none and\n    calendar_close_start is not
      none and\n    now_ts >= calendar_open_end and\n    now_ts < calendar_close_start\n
      \ )\n}}"
    is_time_down_late: "{{\n  (\n    is_time_field_enabled and\n    now() >= today_at(time_down_late_today)\n
      \ ) or\n  (\n    is_calendar_enabled and\n    calendar_close_end is not none
      and\n    now_ts >= calendar_close_end\n  )\n}}"
    is_shading_allowed_window: "{{\n  is_time_control_disabled or\n  (\n    is_time_field_enabled
      and\n    now() >= today_at(time_up_early_today) and\n    now() <= today_at(time_down_late_today)
      + timedelta(seconds = 5)\n  ) or\n  (\n    is_calendar_enabled and\n    calendar_open_start
      is not none and\n    calendar_close_end is not none and\n    now_ts >= calendar_open_start
      and\n    now_ts <= calendar_close_end\n  )\n}}"
    environment_allows_opening: "{%- set brightness_ok = (\n  default_brightness_sensor
      == [] or\n  states(default_brightness_sensor) | float(default=brightness_up)
      > (brightness_up + brightness_hysteresis)\n) -%} {%- set sun_ok = (\n  default_sun_sensor
      == [] or\n  current_sun_elevation | float(default=sun_elevation_up_current)
      > sun_elevation_up_current\n) -%} {%- if is_brightness_enabled and is_sun_elevation_enabled
      -%}\n  {{ (brightness_ok and sun_ok) if use_and_operator else (brightness_ok
      or sun_ok) }}\n{%- elif is_brightness_enabled -%}\n  {{ brightness_ok }}\n{%-
      elif is_sun_elevation_enabled -%}\n  {{ sun_ok }}\n{%- else -%}\n  true\n{%-
      endif -%}"
    environment_allows_closing: "{%- set brightness_close = (\n  default_brightness_sensor
      == [] or\n  states(default_brightness_sensor) | float(default=brightness_down)
      < (brightness_down - brightness_hysteresis)\n) -%} {%- set sun_close = (\n  default_sun_sensor
      == [] or\n  current_sun_elevation | float(default=sun_elevation_down_current)
      < sun_elevation_down_current\n) -%} {%- if is_brightness_enabled and is_sun_elevation_enabled
      -%}\n  {{ (brightness_close and sun_close) if use_and_operator else (brightness_close
      or sun_close) }}\n{%- elif is_brightness_enabled -%}\n  {{ brightness_close
      }}\n{%- elif is_sun_elevation_enabled -%}\n  {{ sun_close }}\n{%- else -%}\n
      \ true\n{%- endif -%}"
    should_be_open_now: "{{\n  is_daytime_phase and\n  not is_evening_phase and\n
      \ (\n    (not is_brightness_enabled and not is_sun_elevation_enabled) or\n    environment_allows_opening\n
      \ )\n}}"
    should_be_closed_now: "{{\n  is_evening_phase and\n  (\n    (not is_brightness_enabled
      and not is_sun_elevation_enabled) or\n    environment_allows_closing\n  )\n}}"
- if:
  - '{{ cover_status_helper == [] }}'
  then:
  - action: system_log.write
    data:
      message: 'Cover Control Automation ({{ friendly_name }}): CONFIGURATION ERROR
        - Cover Status Helper is required but not configured. Please configure a Cover
        Status Helper (input_text entity) in the automation settings.'
      level: error
  - action: logbook.log
    data:
      name: Cover Control Automation
      message: '❌ {{ friendly_name }}: Automation stopped - Cover Status Helper not
        configured. A valid input_text helper is mandatory. Please configure it in
        the automation settings.'
      entity_id: '{{ blind_entities[0] if blind_entities else none }}'
  - stop: Missing Cover Status Helper configuration
- if:
  - or:
    - '{{ states(cover_status_helper) in invalid_states }}'
    - '{{ not states(cover_status_helper) | regex_match("((\[[^\}]+)?\{s*[^\}\{]{3,}?:.*\}([^\{]+\])?)")
      }}'
  then:
  - action: system_log.write
    data:
      message: 'Cover Control Automation ({{ friendly_name }}): HELPER VALIDATION
        WARNING - Cover Status Helper contains invalid or empty data. Helper: {{ cover_status_helper
        }}, Current state: {{ states(cover_status_helper) }} The helper will be initialized
        with default structure.'
      level: warning
  - action: logbook.log
    data:
      name: Cover Control Automation
      message: '⚠️ {{ friendly_name }}: Cover Status Helper invalid - initializing
        with default structure.'
      entity_id: '{{ cover_status_helper }}'
- if:
  - '{{ check_status_helper_length is not none and check_status_helper_length | int
    < 210 }}'
  then:
  - action: system_log.write
    data:
      message: 'Cover Control Automation ({{ friendly_name }}): CRITICAL CONFIGURATION
        ERROR - Cover Status Helper max length is {{ check_status_helper_length }}
        characters but at least 210 are required (recommended: 254). Helper: {{ cover_status_helper
        }} The automation cannot persist state with the current max length. Increase
        the ''Maximum length'' setting of the input_text helper.'
      level: error
  - action: logbook.log
    data:
      name: Cover Control Automation
      message: '❌ {{ friendly_name }}: Cover Status Helper max length too small ({{
        check_status_helper_length }}/210). Increase to at least 254.'
      entity_id: '{{ cover_status_helper }}'
  - stop: Cover Status Helper max length too small
- choose:
  - alias: Check for opening
    conditions:
    - '{{ is_up_enabled }}'
    - '{{ trigger.id is defined }}'
    - '{{ trigger.id | regex_match(''^(t_open|t_calendar_event)'') }}'
    - condition: !input auto_up_condition
    - '{{ not (helper_state_manual and override_flags.opening) }}'
    - or:
      - '{{ not prevent_flags.opening_multiple_times }}'
      - '{{ prevent_flags.opening_multiple_times and ((now().day != helper_ts_open|timestamp_custom(''%-d'')|int)
        or helper_ts_man <= helper_ts_open) }}'
    - or:
      - '{{ is_time_control_disabled }}'
      - and:
        - '{{ is_time_up_late }}'
      - and:
        - '{{ is_opening_phase or is_daytime_phase }}'
        - '{{ not is_evening_phase }}'
        - '{{ environment_allows_opening }}'
    sequence:
    - choose:
      - alias: Already in open position - only update base state
        conditions:
        - '{{ effective_state == ''opn'' and in_open_position }}'
        - '{{ not helper_state_is_shaded }}'
        - '{{ not helper_state_pending_start }}'
        - '{{ not helper_state_shade }}'
        - or:
          - '{{ helper_state_base != ''opn'' }}'
          - '{{ now().day != helper_ts_open | timestamp_custom(''%-d'', true) | int
            }}'
