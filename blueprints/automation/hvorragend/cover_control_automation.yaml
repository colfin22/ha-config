                  %}\n    {% set merged_ts.data = dict(merged_ts.data, **{key: (ts_now
                  if value == 'now' else value) | int}) %}\n  {% endfor %}\n{% endif
                  %}\n{% if new_shd == (current.shd | default(0) | int) and 'ts' in
