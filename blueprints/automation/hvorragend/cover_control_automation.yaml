    | default(0) if v5_current == 'shade' else 0,\n        'due': v5_shs if v5_shs
    > 0 else v5_she,\n        'arm': 0,\n        'man': helper_raw.manual.t | default(0)\n
    \     },\n      'v': 6,\n      't': ts_now\n    }\n  }}\n{% elif is_v6_compact
    %}\n  {% set raw_ts = helper_raw.ts | default({}) %}\n  {{\n    {\n      'bas':
    helper_raw.bas | default('opn'),\n      'shd': helper_raw.shd | default(0) | int,\n
    \     'pnd': helper_raw.pnd | default('non'),\n      'win': helper_raw.win | default('cls'),\n
    \     'frc': helper_raw.frc | default('non'),\n      'res': helper_raw.res | default(0)
