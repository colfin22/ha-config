                | int %}\n{% set new_pnd = updates.pnd | default(current.pnd | default('non'))
                %}\n{% set new_win = updates.win | default(current.win | default('cls'))
                %}\n{% set new_frc = updates.frc | default(current.frc | default('non'))
                %}\n{% set new_res = updates.res | default(current.res | default(0))
                | int %}\n{% set new_man = updates.man | default(current.man | default(0))
                | int %}\n{% set current_ts = current.ts | default({}) %}\n\n{% set
                merged_ts = namespace(data={}) %}\n{% for key in ['opn', 'cls', 'shd',
                'due', 'arm', 'man'] %}\n  {% set merged_ts.data = dict(merged_ts.data,
                **{key: current_ts[key] | default(0) | int}) %}\n{% endfor %}\n{%
                if 'ts' in updates %}\n  {% for key, value in updates.ts.items() %}\n
                \   {% set merged_ts.data = dict(merged_ts.data, **{key: (ts_now if
                value == 'now' else value) | int}) %}\n  {% endfor %}\n{% endif %}\n{%
                if new_shd == (current.shd | default(0) | int) and 'ts' in updates
                and 'shd' in updates.ts %}\n  {% set merged_ts.data = dict(merged_ts.data,
                **{'shd': current_ts.shd | default(0) | int}) %}\n{% endif %}\n\n{%
                set dict_new = {\n  'bas': new_bas,\n  'shd': new_shd | int,\n  'pnd':
                new_pnd,\n  'win': new_win,\n  'frc': new_frc,\n  'res': new_res |
                int,\n  'man': new_man | int,\n  'ts': {\n    'opn': merged_ts.data.opn
