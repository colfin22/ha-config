                  entity_id: '{{ this.entity_id }}'
                  message: "Trigger: {{ trigger.id | default('manual') }} | \nEffective:
                    {{ effective_state }} | \nPosition: {{ current_position }}% {%
                    if is_cover_tilt_enabled %} / Tilt: {{ current_tilt_position }}%{%
                    endif %} | \nHelper: bas={{ helper_json.bas | default('opn') }}
                    shd={{ helper_json.shd | default(0) }} pnd={{ helper_json.pnd
