                {{ dict_new | to_json }}'
        - choose: []
          default: !input auto_manual_action
        - stop: Manual Shading detected
      - conditions:
        - '{{ is_down_enabled }}'
        - '{{ not in_shading_position }}'
        - or:
          - '{{ in_close_position }}'
