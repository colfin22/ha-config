        - choose: []
          default: !input auto_manual_action
        - stop: Manual Ventilation detected
      - conditions:
        - '{{ is_shading_enabled }}'
        - '{{ in_shading_position }}'
        sequence:
        - variables:
            update_values:
              open:
                a: 0
                t: '{{ helper_json.open.t }}'
              close:
                a: 0
                t: '{{ helper_json.close.t }}'
              shading:
                a: 1
                t: '{{ ts_now }}'
                p: 0
                q: 0
              vpart:
                a: 0
                t: '{{ helper_json.vpart.t }}'
              vfull:
                a: 0
                t: '{{ helper_json.vfull.t }}'
              manual:
                a: 1
                t: '{{ ts_now }}'
              t: '{{ ts_now }}'
        - if:
          - '{{ is_status_helper_enabled }}'
