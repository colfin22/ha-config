variables:
  version: 2026.01.26
  blind_entities: '{{ expand(blind) | map(attribute=''entity_id'') | list }}'
  current_position: "{% set source = position_source %} {% if source == 'current_position_attr'
    %}\n  {{ state_attr(blind, 'current_position') | int(default=101) }}\n{% elif
    source == 'position_attr' %}\n  {{ state_attr(blind, 'position') | int(default=101)
    }}\n{% elif source == 'custom_sensor' and custom_position_sensor != [] %}\n  {{
    states(custom_position_sensor) | int(default=101) }}\n{% else %}\n  {{ 101 }}\n{%
    endif %}"
  current_tilt_position: '{{ state_attr(blind, ''current_tilt_position'') | int(default=101)
    }}'
  position_comparisons:
    current_above_open: '{{ current_position < open_position if is_awning else current_position
      > open_position }}'
    current_above_close: '{{ current_position < close_position if is_awning else current_position
      > close_position }}'
    current_above_shading: '{{ current_position < shading_position if is_awning else
      current_position > shading_position }}'
    current_above_ventilate: '{{ current_position < ventilate_position if is_awning
      else current_position > ventilate_position }}'
    current_below_open: '{{ current_position > open_position if is_awning else current_position
      < open_position }}'
    current_below_close: '{{ current_position > close_position if is_awning else current_position
      < close_position }}'
    current_below_shading: '{{ current_position > shading_position if is_awning else
      current_position < shading_position }}'
    current_below_ventilate: '{{ current_position > ventilate_position if is_awning
      else current_position < ventilate_position }}'
    open_above_close: '{{ open_position < close_position if is_awning else open_position
      > close_position }}'
    open_above_ventilate: '{{ open_position < ventilate_position if is_awning else
      open_position > ventilate_position }}'
    shading_above_close: '{{ shading_position < close_position if is_awning else shading_position
      > close_position }}'
    shading_below_open: '{{ shading_position > open_position if is_awning else shading_position
      < open_position }}'
    ventilate_above_close: '{{ ventilate_position < close_position if is_awning else
      ventilate_position > close_position }}'
  current_sun_azimuth: '{{ state_attr(default_sun_sensor, ''azimuth'') }}'
  current_sun_elevation: '{{ state_attr(default_sun_sensor, ''elevation'') }}'
  sun_elevation_up_current: "{% set mode = sun_elevation_mode %} {% set sensor = sun_elevation_up_sensor
    %} {% set fixed_value = sun_elevation_up | float %} {% set sensor_valid = sensor
    != [] and states(sensor) not in invalid_states and is_number(states(sensor)) %}
    {% if mode == 'dynamic' %}\n  {% if sensor_valid %}\n    {{ states(sensor) | float
    }}\n  {% else %}\n    {{ fixed_value }}\n  {% endif %}\n{% elif mode == 'hybrid'
    %}\n  {% if sensor_valid %}\n    {{ (states(sensor) | float) + fixed_value }}\n
    \ {% else %}\n    {{ fixed_value }}\n  {% endif %}\n{% else %}\n  {{ fixed_value
    }}\n{% endif %}"
  sun_elevation_down_current: "{% set mode = sun_elevation_mode %} {% set sensor =
    sun_elevation_down_sensor %} {% set fixed_value = sun_elevation_down | float %}
    {% set sensor_valid = sensor != [] and states(sensor) not in invalid_states and
    is_number(states(sensor)) %} {% if mode == 'dynamic' %}\n  {% if sensor_valid
    %}\n    {{ states(sensor) | float }}\n  {% else %}\n    {{ fixed_value }}\n  {%
    endif %}\n{% elif mode == 'hybrid' %}\n  {% if sensor_valid %}\n    {{ (states(sensor)
    | float) + fixed_value }}\n  {% else %}\n    {{ fixed_value }}\n  {% endif %}\n{%
    else %}\n  {{ fixed_value }}\n{% endif %}"
  is_today_off: '{{ workday_sensor_today != [] and is_state(workday_sensor_today,
    ''off'') }}'
  is_tomorrow_off: '{{ workday_sensor_tomorrow != [] and is_state(workday_sensor_tomorrow,
    ''off'') }}'
  is_tomorrow_on: '{{ workday_sensor_tomorrow != [] and is_state(workday_sensor_tomorrow,
    ''on'') }}'
  is_cover_tilt_enabled_and_possible: '{{ is_cover_tilt_enabled and state_attr(blind,
    ''current_tilt_position'') != none }}'
  is_cover_tilt_reposition_enabled: '{{ ''cover_tilt_reposition_enabled'' in cover_tilt_reposition_config
    }}'
  drive_delay_fix: !input drive_delay_fix
  drive_delay_random: !input drive_delay_random
  drive_time: !input drive_time
  time_up_early_today: '{{ time_up_early_non_workday if is_today_off else time_up_early
    }}'
  time_up_late_today: '{{ time_up_late_non_workday if is_today_off else time_up_late
    }}'
  time_down_early_today: "{{\n  time_down_early_non_workday if is_tomorrow_off else\n
    \ time_down_early if is_tomorrow_on else\n  time_down_early_non_workday if is_today_off
    else\n  time_down_early\n}}"
  time_down_late_today: "{{\n  time_down_late_non_workday if is_tomorrow_off else\n
    \ time_down_late if is_tomorrow_on else\n  time_down_late_non_workday if is_today_off
    else\n  time_down_late\n}}"
  shading_tilt_position: "{% set elevation = current_sun_elevation | int(default=0)
    %} {% if elevation >= shading_tilt_elevation_3 | int %}\n  {{ shading_tilt_position_3
    | int }}\n{% elif elevation >= shading_tilt_elevation_2 | int %}\n  {{ shading_tilt_position_2
    | int }}\n{% elif elevation >= shading_tilt_elevation_1 | int %}\n  {{ shading_tilt_position_1
    | int }}\n{% else %}\n  {{ shading_tilt_position_0 | int }}\n{% endif %}"
  in_open_position: "{% set min = open_position - position_tolerance %} {% set max
    = open_position + position_tolerance %} {{\n  (current_position >= min and current_position
    <= max)\n  and (\n    (not is_cover_tilt_enabled_and_possible) or\n    (is_cover_tilt_enabled_and_possible
    and current_tilt_position == open_tilt_position | int)\n  )\n}}"
  in_close_position: "{% set min = close_position - position_tolerance %} {% set max
    = close_position + position_tolerance %} {{\n  (current_position >= min and current_position
    <= max)\n  and (\n    (not is_cover_tilt_enabled_and_possible) or\n    (is_cover_tilt_enabled_and_possible
    and current_tilt_position == close_tilt_position | int)\n  )\n}}"
  in_shading_position: "{% set min = shading_position - position_tolerance %} {% set
    max = shading_position + position_tolerance %} {{\n  is_shading_enabled\n  and
    (current_position >= min and current_position <= max)\n  and (\n    (not is_cover_tilt_enabled_and_possible)
    or\n    (current_tilt_position == shading_tilt_position | int)\n  )\n}}"
  in_ventilate_position: "{% set min = ventilate_position - position_tolerance %}
    {% set max = ventilate_position + position_tolerance %} {{\n  is_ventilation_enabled\n
    \ and (current_position >= min and current_position <= max)\n  and (\n    (not
    is_cover_tilt_enabled_and_possible) or\n    (current_tilt_position == ventilate_tilt_position
    | int)\n  )\n}}"
  brightness_time_duration: !input brightness_time_duration
  sun_time_duration: !input sun_time_duration
  shading_waitingtime_start: !input shading_waitingtime_start
  shading_waitingtime_end: !input shading_waitingtime_end
  shading_start_max_duration: !input shading_start_max_duration
  shading_end_max_duration: !input shading_end_max_duration
  shading_config: !input shading_config
  shading_end_immediate_by_sun_position: !input shading_end_immediate_by_sun_position
  is_shading_end_immediate_by_sun_position: '{{ shading_end_immediate_by_sun_position
    }}'
  forecast_source:
    use_sensor: '{{ shading_forecast_temp_sensor != [] }}'
    use_weather: '{{ shading_forecast_sensor != [] and shading_forecast_temp_sensor
      == [] }}'
    prevent_service: '{{ ''weather_attributes'' in shading_forecast_type }}'
  shading_start_condition_enabled:
    azimuth: '{{ ''cond_azimuth'' in shading_conditions_start_and or ''cond_azimuth''
      in shading_conditions_start_or }}'
    elevation: '{{ ''cond_elevation'' in shading_conditions_start_and or ''cond_elevation''
      in shading_conditions_start_or }}'
    brightness: '{{ ''cond_brightness'' in shading_conditions_start_and or ''cond_brightness''
      in shading_conditions_start_or }}'
    temp1: '{{ ''cond_temp1'' in shading_conditions_start_and or ''cond_temp1'' in
      shading_conditions_start_or }}'
    temp2: '{{ ''cond_temp2'' in shading_conditions_start_and or ''cond_temp2'' in
      shading_conditions_start_or }}'
    forecast_temp: '{{ ''cond_forecast_temp'' in shading_conditions_start_and or ''cond_forecast_temp''
      in shading_conditions_start_or }}'
    forecast_weather: '{{ ''cond_forecast_weather'' in shading_conditions_start_and
      or ''cond_forecast_weather'' in shading_conditions_start_or }}'
  shading_end_condition_enabled:
    azimuth: '{{ ''cond_azimuth'' in shading_conditions_end_and or ''cond_azimuth''
      in shading_conditions_end_or }}'
    elevation: '{{ ''cond_elevation'' in shading_conditions_end_and or ''cond_elevation''
      in shading_conditions_end_or }}'
    brightness: '{{ ''cond_brightness'' in shading_conditions_end_and or ''cond_brightness''
      in shading_conditions_end_or }}'
    temp1: '{{ ''cond_temp1'' in shading_conditions_end_and or ''cond_temp1'' in shading_conditions_end_or
      }}'
    temp2: '{{ ''cond_temp2'' in shading_conditions_end_and or ''cond_temp2'' in shading_conditions_end_or
      }}'
    forecast_temp: '{{ ''cond_forecast_temp'' in shading_conditions_end_and or ''cond_forecast_temp''
      in shading_conditions_end_or }}'
    forecast_weather: '{{ ''cond_forecast_weather'' in shading_conditions_end_and
      or ''cond_forecast_weather'' in shading_conditions_end_or }}'
  is_status_helper_enabled: "{{\n  'cover_helper_enabled' in cover_status_options
    and\n  cover_status_helper != [] and\n  states(cover_status_helper) not in invalid_states
    and\n  states(cover_status_helper) | regex_match(\"((\\[[^\\}]+)?\\{s*[^\\}\\{]{3,}?:.*\\}([^\\{]+\\])?)\")\n}}"
  helper_json: "{% if is_status_helper_enabled %}\n  {{ states(cover_status_helper)
    | from_json }}\n{% else %}\n  {{\n    {\n      'open': {'a': 0, 't': 0},\n      'close':
    {'a': 0, 't': 0},\n      'shading': {'a': 0, 't': 0, 'p': 0, 'q': 0},\n      'vpart':
    {'a': 0, 't': 0},\n      'vfull': {'a': 0, 't': 0},\n      'manual': {'a': 0,
    't': 0},\n      'v': 5,\n      't': as_timestamp(now()) | round(0)\n    } | to_json
    | from_json\n  }}\n{% endif %}\n"
  helper_status:
    open: '{{ (is_status_helper_enabled | default(false)) and (helper_json | regex_search(''open''))
      and (helper_json.open.a | default(false) | bool) }}'
    closed: '{{ (is_status_helper_enabled | default(false)) and (helper_json | regex_search(''close''))
      and (helper_json.close.a | default(false) | bool) }}'
    shaded: '{{ (is_status_helper_enabled | default(false)) and (helper_json | regex_search(''shading''))
      and (helper_json.shading.a | default(false) | bool) and not (helper_json.shading.p
      | default(false) | bool) }}'
    shading_start_pending: '{{ (is_status_helper_enabled | default(false)) and (helper_json
      | regex_search(''shading'')) and (helper_json.shading.p | default(false) | bool)
      }}'
    shading_end_pending: '{{ (is_status_helper_enabled | default(false)) and (helper_json
      | regex_search(''shading'')) and (helper_json.shading.q | default(false) | bool)
      }}'
    vpart: '{{ (is_status_helper_enabled | default(false)) and (helper_json | regex_search(''vpart''))
      and (helper_json.vpart.a | default(false) | bool) }}'
    vfull: '{{ (is_status_helper_enabled | default(false)) and (helper_json | regex_search(''vfull''))
      and (helper_json.vfull.a | default(false) | bool) }}'
    manual: '{{ (is_status_helper_enabled | default(false)) and (helper_json | regex_search(''manual''))
      and (helper_json.manual.a | default(false) | bool) }}'
  helper_ts:
    open: '{{ (helper_json.open.t | default(0)) if ((is_status_helper_enabled | default(false))
      and (helper_json | regex_search(''open''))) else 0 }}'
    closed: '{{ (helper_json.close.t | default(0)) if ((is_status_helper_enabled |
      default(false)) and (helper_json | regex_search(''close''))) else 0 }}'
    shaded: '{{ (helper_json.shading.t | default(0)) if ((is_status_helper_enabled
      | default(false)) and (helper_json | regex_search(''shading''))) else 0 }}'
    vpart: '{{ (helper_json.vpart.t | default(0)) if ((is_status_helper_enabled |
      default(false)) and (helper_json | regex_search(''vpart''))) else 0 }}'
    vfull: '{{ (helper_json.vfull.t | default(0)) if ((is_status_helper_enabled |
      default(false)) and (helper_json | regex_search(''vfull''))) else 0 }}'
    manual: '{{ (helper_json.manual.t | default(0)) if ((is_status_helper_enabled
      | default(false)) and (helper_json | regex_search(''manual''))) else 0 }}'
  is_cover_movement_blocked:
    open: '{{ (auto_down_force != [] and states(auto_down_force) in [''on'', ''true''])
      or (auto_ventilate_force != [] and states(auto_ventilate_force) in [''on'',
      ''true'']) or (auto_shading_start_force != [] and states(auto_shading_start_force)
      in [''on'', ''true'']) }}'
    close: '{{ (auto_up_force != [] and states(auto_up_force) in [''on'', ''true''])
      or (auto_ventilate_force != [] and states(auto_ventilate_force) in [''on'',
      ''true'']) or (auto_shading_start_force != [] and states(auto_shading_start_force)
      in [''on'', ''true'']) }}'
    ventilate: '{{ (auto_up_force != [] and states(auto_up_force) in [''on'', ''true''])
      or (auto_down_force != [] and states(auto_down_force) in [''on'', ''true''])
      or (auto_shading_start_force != [] and states(auto_shading_start_force) in [''on'',
      ''true'']) }}'
    shading: '{{ (auto_up_force != [] and states(auto_up_force) in [''on'', ''true''])
      or (auto_down_force != [] and states(auto_down_force) in [''on'', ''true''])
      or (auto_ventilate_force != [] and states(auto_ventilate_force) in [''on'',
      ''true'']) }}'
    any: '{{ (auto_up_force != [] and states(auto_up_force) in [''on'', ''true''])
      or (auto_down_force != [] and states(auto_down_force) in [''on'', ''true''])
      or (auto_ventilate_force != [] and states(auto_ventilate_force) in [''on'',
      ''true'']) or (auto_shading_start_force != [] and states(auto_shading_start_force)
      in [''on'', ''true'']) }}'
  resident_config: !input resident_config
  resident_flags:
    opening_enabled: '{{ ''resident_opening_enabled'' in resident_config }}'
    closing_enabled: '{{ ''resident_closing_enabled'' in resident_config }}'
    allow_shading: '{{ ''resident_allow_shading'' in resident_config }}'
    allow_opening: '{{ ''resident_allow_opening'' in resident_config }}'
    allow_ventilation: '{{ ''resident_allow_ventilation'' in resident_config }}'
  ignore_after_manual_config: !input ignore_after_manual_config
  override_flags:
    opening: '{{ ''ignore_opening_after_manual'' in ignore_after_manual_config }}'
    closing: '{{ ''ignore_closing_after_manual'' in ignore_after_manual_config }}'
    ventilation: '{{ ''ignore_ventilation_after_manual'' in ignore_after_manual_config
      }}'
    shading: '{{ ''ignore_shading_after_manual'' in ignore_after_manual_config }}'
  auto_ventilate_options: !input auto_ventilate_options
  contact_delay_trigger: !input contact_delay_trigger
  contact_delay_status: !input contact_delay_status
  ventilation_flags:
    delay_enabled: '{{ ''ventilation_delay_enabled'' in auto_ventilate_options }}'
    if_lower_enabled: '{{ ''ventilation_if_lower_enabled'' in auto_ventilate_options
      }}'
    after_shading_end: '{{ ''ventilation_after_shading_end'' in auto_ventilate_options
      }}'
  prevent_config: !input individual_config
  prevent_flags:
    higher_position_closing: '{{ ''prevent_higher_position_closing'' in prevent_config
      }}'
    lowering_when_closing_if_shaded: '{{ ''prevent_lowering_when_closing_if_shaded''
      in prevent_config }}'
    shading_end_if_closed: '{{ ''prevent_shading_end_if_closed'' in prevent_config
      }}'
    opening_after_shading_end: '{{ ''prevent_opening_after_shading_end'' in prevent_config
      }}'
    opening_after_ventilation_end: '{{ ''prevent_opening_after_ventilation_end'' in
      prevent_config }}'
    default_cover_actions: '{{ ''prevent_default_cover_actions'' in prevent_config
      }}'
    shading_multiple_times: '{{ ''prevent_shading_multiple_times'' in prevent_config
      }}'
    opening_multiple_times: '{{ ''prevent_opening_multiple_times'' in prevent_config
      }}'
    closing_multiple_times: '{{ ''prevent_closing_multiple_times'' in prevent_config
      }}'
  auto_recover_after_force: !input auto_recover_after_force
  is_auto_recover_enabled: '{{ ''auto_recover_enabled'' in auto_recover_after_force
    }}'
  check_config: !input check_config
  check_config_debuglevel: !input check_config_debuglevel
  check_status_helper_length: '{{ state_attr(cover_status_helper, ''max'') if cover_status_helper
    != [] else None }}'
mode: queued
max: 10
max_exceeded: warning
triggers:
- trigger: template
  value_template: '{% set is_today_off = workday_sensor_today != [] and is_state(workday_sensor_today,
    ''off'') %} {% set time_compare = time_up_early_non_workday if is_today_off else
    time_up_early %} {{ now() >= today_at(time_compare) }}'
  enabled: '{{ is_time_field_enabled }}'
  id: t_open_1
- trigger: template
  value_template: '{% set is_today_off = workday_sensor_today != [] and is_state(workday_sensor_today,
    ''off'') %} {% set early = time_up_early_non_workday if is_today_off else time_up_early
    %} {% set late = time_up_late_non_workday if is_today_off else time_up_late %}
    {{ early != late and now() >= today_at(late) }}'
  enabled: '{{ is_time_field_enabled }}'
  id: t_open_2
- trigger: template
  value_template: '{{ states(default_brightness_sensor) | float(default=brightness_up)
    > (brightness_up + brightness_hysteresis) }}'
  for:
    seconds: !input brightness_time_duration
  enabled: '{{ is_brightness_enabled and default_brightness_sensor != [] }}'
  id: t_open_4
- trigger: template
  value_template: "{% set mode = sun_elevation_mode %} {% set sensor = sun_elevation_up_sensor
    %} {% set fixed_value = sun_elevation_up | float %} {% set current_elevation =
    state_attr(default_sun_sensor, 'elevation') | float(0) %} {% set sensor_valid
    = sensor != [] and states(sensor) not in invalid_states and is_number(states(sensor))
    %} {% if mode == 'dynamic' %}\n  {% if sensor_valid %}\n    {% set threshold =
    states(sensor) | float %}\n  {% else %}\n    {% set threshold = fixed_value %}\n
    \ {% endif %}\n{% elif mode == 'hybrid' %}\n  {% if sensor_valid %}\n    {% set
    threshold = (states(sensor) | float) + fixed_value %}\n  {% else %}\n    {% set
    threshold = fixed_value %}\n  {% endif %}\n{% else %}\n  {% set threshold = fixed_value
    %}\n{% endif %} {{ current_elevation > threshold }}"
  for:
    seconds: !input sun_time_duration
  enabled: '{{ is_sun_elevation_enabled and default_sun_sensor != [] }}'
  id: t_open_5
- trigger: state
  entity_id: !input resident_sensor
  from: 'on'
  to: 'off'
  enabled: '{{ resident_sensor != [] }}'
  id: t_open_6
- trigger: state
  entity_id: !input auto_up_force
  from: 'off'
  to: 'on'
  enabled: '{{ auto_up_force != [] }}'
  id: t_force_enabled_open
- trigger: state
  entity_id: !input auto_up_force
  from: 'on'
  to: 'off'
  enabled: '{{ auto_up_force != [] }}'
  id: t_force_disabled_open
- trigger: template
  value_template: "{% set is_tomorrow_off = workday_sensor_tomorrow != [] and is_state(workday_sensor_tomorrow,
    'off') %} {% set is_tomorrow_on = workday_sensor_tomorrow != [] and is_state(workday_sensor_tomorrow,
    'on') %} {% set is_today_off = workday_sensor_today != [] and is_state(workday_sensor_today,
    'off') %} {% set time_compare =\n  time_down_early_non_workday if is_tomorrow_off
    else\n  time_down_early if is_tomorrow_on else\n  time_down_early_non_workday
    if is_today_off else\n  time_down_early %}\n{{ now() >= today_at(time_compare)
    }}"
  enabled: '{{ is_time_field_enabled }}'
  id: t_close_1
- trigger: template
  value_template: "{% set is_tomorrow_off = workday_sensor_tomorrow != [] and is_state(workday_sensor_tomorrow,
    'off') %} {% set is_tomorrow_on = workday_sensor_tomorrow != [] and is_state(workday_sensor_tomorrow,
    'on') %} {% set is_today_off = workday_sensor_today != [] and is_state(workday_sensor_today,
    'off') %} {% set time_compare =\n  time_down_late_non_workday if is_tomorrow_off
    else\n  time_down_late if is_tomorrow_on else\n  time_down_late_non_workday if
    is_today_off else\n  time_down_late %}\n{{ (time_down_early_non_workday != time_compare
    and time_down_early != time_compare) and now() >= today_at(time_compare) }}"
  enabled: '{{ is_time_field_enabled }}'
  id: t_close_2
- trigger: template
  value_template: '{{ states(default_brightness_sensor) | float(default=brightness_down)
    < (brightness_down - brightness_hysteresis) }}'
  for:
    seconds: !input brightness_time_duration
  enabled: '{{ is_brightness_enabled and default_brightness_sensor != [] }}'
  id: t_close_4
- trigger: template
  value_template: "{% set mode = sun_elevation_mode %} {% set sensor = sun_elevation_down_sensor
    %} {% set fixed_value = sun_elevation_down | float %} {% set current_elevation
    = state_attr(default_sun_sensor, 'elevation') | float(0) %} {% set sensor_valid
    = sensor != [] and states(sensor) not in invalid_states and is_number(states(sensor))
    %} {% if mode == 'dynamic' %}\n  {% if sensor_valid %}\n    {% set threshold =
    states(sensor) | float %}\n  {% else %}\n    {% set threshold = fixed_value %}\n
    \ {% endif %}\n{% elif mode == 'hybrid' %}\n  {% if sensor_valid %}\n    {% set
    threshold = (states(sensor) | float) + fixed_value %}\n  {% else %}\n    {% set
    threshold = fixed_value %}\n  {% endif %}\n{% else %}\n  {% set threshold = fixed_value
    %}\n{% endif %} {{ current_elevation < threshold }}"
  for:
    seconds: !input sun_time_duration
  enabled: '{{ is_sun_elevation_enabled and default_sun_sensor != [] }}'
  id: t_close_5
- trigger: state
  entity_id: !input resident_sensor
  from: 'off'
  to: 'on'
  enabled: '{{ resident_sensor != [] }}'
  id: t_close_6
- trigger: state
  entity_id: !input auto_down_force
  from: 'off'
  to: 'on'
  enabled: '{{ auto_down_force != [] }}'
  id: t_force_enabled_close
- trigger: state
  entity_id: !input auto_down_force
  from: 'on'
  to: 'off'
  enabled: '{{ auto_down_force != [] }}'
  id: t_force_disabled_close
- trigger: state
  entity_id: !input calendar_entity
  to: 'on'
  enabled: '{{ is_calendar_enabled }}'
  id: t_calendar_event_start
- trigger: state
  entity_id: !input calendar_entity
  to: 'off'
  enabled: '{{ is_calendar_enabled }}'
  id: t_calendar_event_end
- trigger: state
  entity_id: !input contact_window_tilted
  enabled: '{{ is_ventilation_enabled and contact_window_tilted != [] }}'
  id: t_contact_tilted_changed
  for:
    seconds: !input contact_delay_trigger
- trigger: state
  entity_id: !input contact_window_opened
  enabled: '{{ is_ventilation_enabled and contact_window_opened != [] }}'
  id: t_contact_opened_changed
  for:
    seconds: !input contact_delay_trigger
- trigger: state
  entity_id: !input auto_ventilate_force
  from: 'off'
  to: 'on'
  enabled: '{{ auto_ventilate_force != [] }}'
  id: t_force_enabled_ventilate
- trigger: state
  entity_id: !input auto_ventilate_force
  from: 'on'
  to: 'off'
  enabled: '{{ auto_ventilate_force != [] }}'
  id: t_force_disabled_ventilate
- trigger: template
  value_template: "{{\n  state_attr(default_sun_sensor, 'azimuth') | float(default=shading_azimuth_start)
    > shading_azimuth_start and\n  state_attr(default_sun_sensor, 'azimuth') | float(default=shading_azimuth_end)
    < shading_azimuth_end and\n  state_attr(default_sun_sensor, 'elevation') | float(default=shading_elevation_min)
    > shading_elevation_min and\n  state_attr(default_sun_sensor, 'elevation') | float(default=shading_elevation_max)
    < shading_elevation_max\n}}"
  enabled: '{{ is_shading_enabled and default_sun_sensor != [] }}'
  id: t_shading_start_pending_1
- trigger: template
  value_template: '{{ states(shading_brightness_sensor) not in invalid_states and
    states(shading_brightness_sensor) | float(default=shading_sun_brightness_start)
    > (shading_sun_brightness_start + shading_sun_brightness_hysteresis) }}'
  enabled: '{{ is_shading_enabled and shading_brightness_sensor != [] }}'
  id: t_shading_start_pending_2
- trigger: template
  value_template: '{{ states(shading_temperatur_sensor1) not in invalid_states and
    states(shading_temperatur_sensor1) | float(default=shading_min_temperatur1) >
    (shading_min_temperatur1 + shading_temperature_hysteresis1) }}'
  enabled: '{{ is_shading_enabled and shading_temperatur_sensor1 != [] }}'
  id: t_shading_start_pending_3
- trigger: template
  value_template: '{{ states(shading_temperatur_sensor2) not in invalid_states and
    states(shading_temperatur_sensor2) | float(default=shading_min_temperatur2) >
    (shading_min_temperatur2 + shading_temperature_hysteresis2) }}'
  enabled: '{{ is_shading_enabled and shading_temperatur_sensor2 != [] }}'
  id: t_shading_start_pending_4
- trigger: template
  value_template: '{{ states(shading_forecast_sensor) not in invalid_states and states(shading_forecast_sensor)
    in shading_weather_conditions }}'
  enabled: '{{ is_shading_enabled and shading_forecast_sensor != [] }}'
  id: t_shading_start_pending_5
- trigger: template
  value_template: '{{ states(shading_forecast_temp_sensor) not in invalid_states and
    states(shading_forecast_temp_sensor) | float(default=shading_forecast_temp) >
    (shading_forecast_temp + shading_forecast_temp_hysteresis) }}'
  enabled: '{{ is_shading_enabled and shading_forecast_temp_sensor != [] and shading_forecast_temp
    != [] }}'
  id: t_shading_start_pending_6
- trigger: template
  value_template: '{{ now() >= today_at([time_up_early, time_up_early_non_workday]
    | min) - timedelta(hours = 1) }}'
  enabled: '{{ is_shading_enabled }}'
  id: t_shading_start_pending_7
- trigger: template
  value_template: "{% set helper_state = states(cover_status_helper) %} {{\n  helper_state
    not in invalid_states and\n  helper_state | regex_match(\"((\\[[^\\}]+)?\\{s*[^\\}\\{]{3,}?:.*\\}([^\\{]+\\])?)\")
    and\n  helper_state | from_json | regex_search('shading') and\n  (helper_state
    | from_json).shading.p is defined and\n  (helper_state | from_json).shading.p
    > 0 and\n  now() >= ((helper_state | from_json).shading.p) | as_datetime | as_local\n}}"
  enabled: '{{ is_shading_enabled and cover_status_helper != [] }}'
  id: t_shading_start_execution
- trigger: state
  entity_id: !input auto_shading_start_force
  from: 'off'
  to: 'on'
  enabled: '{{ auto_shading_start_force != [] }}'
  id: t_force_enabled_shading
- trigger: state
  entity_id: !input auto_shading_start_force
  from: 'on'
  to: 'off'
  enabled: '{{ auto_shading_start_force != [] }}'
  id: t_force_disabled_shading
- trigger: template
  value_template: "{{\n  states(cover_status_helper) not in invalid_states and\n  states(cover_status_helper)
    | regex_search('\"shading\"\\s*:\\s*\\{[^}]*\"a\"\\s*:\\s*1') and\n  state_attr(default_sun_sensor,
    'elevation') < shading_tilt_elevation_1\n}}"
  enabled: '{{ is_shading_enabled and cover_status_helper != [] and is_cover_tilt_enabled
    and default_sun_sensor != [] }}'
  id: t_shading_tilt_1
- trigger: template
  value_template: "{{\n  states(cover_status_helper) not in invalid_states and\n  states(cover_status_helper)
    | regex_search('\"shading\"\\s*:\\s*\\{[^}]*\"a\"\\s*:\\s*1') and\n  state_attr(default_sun_sensor,
    'elevation') < shading_tilt_elevation_2 and\n  state_attr(default_sun_sensor,
    'elevation') >= shading_tilt_elevation_1\n}}"
  enabled: '{{ is_shading_enabled and cover_status_helper != [] and is_cover_tilt_enabled
    and default_sun_sensor != [] }}'
  id: t_shading_tilt_2
- trigger: template
  value_template: "{{\n  states(cover_status_helper) not in invalid_states and\n  states(cover_status_helper)
    | regex_search('\"shading\"\\s*:\\s*\\{[^}]*\"a\"\\s*:\\s*1') and\n  state_attr(default_sun_sensor,
    'elevation') < shading_tilt_elevation_3 and\n  state_attr(default_sun_sensor,
    'elevation') >= shading_tilt_elevation_2\n}}"
  enabled: '{{ is_shading_enabled and cover_status_helper != [] and is_cover_tilt_enabled
    and default_sun_sensor != [] }}'
  id: t_shading_tilt_3
- trigger: template
  value_template: "{{\n  states(cover_status_helper) not in invalid_states and\n  states(cover_status_helper)
    | regex_search('\"shading\"\\s*:\\s*\\{[^}]*\"a\"\\s*:\\s*1') and\n  state_attr(default_sun_sensor,
    'elevation') >= shading_tilt_elevation_3\n}}"
  enabled: '{{ is_shading_enabled and cover_status_helper != [] and is_cover_tilt_enabled
    and default_sun_sensor != [] }}'
  id: t_shading_tilt_4
- trigger: template
  value_template: '{{ states(shading_temperatur_sensor1) not in invalid_states and
    states(shading_temperatur_sensor1) | float(default=shading_min_temperatur1) <
    (shading_min_temperatur1 - shading_temperature_hysteresis1) }}'
  enabled: '{{ is_shading_enabled and cover_status_helper != [] and shading_temperatur_sensor1
    != [] }}'
  id: t_shading_end_pending_1
- trigger: template
  value_template: '{{ states(shading_temperatur_sensor2) not in invalid_states and
    states(shading_temperatur_sensor2) | float(default=shading_min_temperatur2) <
    (shading_min_temperatur2 - shading_temperature_hysteresis2) }}'
  enabled: '{{ is_shading_enabled and cover_status_helper != [] and shading_temperatur_sensor2
    != [] }}'
  id: t_shading_end_pending_2
- trigger: template
  value_template: '{{ states(shading_brightness_sensor) not in invalid_states and
    states(shading_brightness_sensor) | float(default=shading_sun_brightness_end)
    < (shading_sun_brightness_end - shading_sun_brightness_hysteresis) }}'
  enabled: '{{ is_shading_enabled and cover_status_helper != [] and shading_brightness_sensor
    != [] }}'
  id: t_shading_end_pending_3
- trigger: template
  value_template: '{{ states(shading_forecast_sensor) not in shading_weather_conditions
    }}'
  enabled: '{{ is_shading_enabled and cover_status_helper != [] and shading_weather_conditions
    != [] and shading_forecast_sensor != [] }}'
  id: t_shading_end_pending_4
- trigger: template
  value_template: "{{\n  (state_attr(default_sun_sensor, 'azimuth') | float(default=shading_azimuth_start)
    < shading_azimuth_start) or\n  (state_attr(default_sun_sensor, 'azimuth') | float(default=shading_azimuth_end)
    > shading_azimuth_end) or\n  (state_attr(default_sun_sensor, 'elevation') | float(default=shading_elevation_max)
    > shading_elevation_max) or\n  (state_attr(default_sun_sensor, 'elevation') |
    float(default=shading_elevation_min) < shading_elevation_min)\n}}"
  enabled: '{{ is_shading_enabled and cover_status_helper != [] and default_sun_sensor
    != [] }}'
  id: t_shading_end_pending_5
- trigger: template
  value_template: '{{ states(shading_forecast_temp_sensor) not in invalid_states and
    states(shading_forecast_temp_sensor) | float(default=shading_forecast_temp) <
    (shading_forecast_temp - shading_forecast_temp_hysteresis) }}'
  enabled: '{{ is_shading_enabled and cover_status_helper != [] and shading_forecast_temp_sensor
    != [] and shading_forecast_temp != [] }}'
  id: t_shading_end_pending_6
- trigger: template
  value_template: "{% set helper_state = states(cover_status_helper) %} {{\n  helper_state
    not in invalid_states and\n  helper_state | regex_match(\"((\\[[^\\}]+)?\\{s*[^\\}\\{]{3,}?:.*\\}([^\\{]+\\])?)\")
    and\n  helper_state | from_json | regex_search('shading') and\n  (helper_state
    | from_json).shading.q is defined and\n  (helper_state | from_json).shading.q
    > 0 and\n  now() >= ((helper_state | from_json).shading.q) | as_datetime | as_local\n}}"
  enabled: '{{ is_shading_enabled and cover_status_helper != [] }}'
  id: t_shading_end_execution
- trigger: template
  value_template: '{{ now() >= today_at(''23:55:00'') }}'
  id: t_shading_reset
  enabled: '{{ is_shading_enabled }}'
- trigger: state
  entity_id: !input blind
  attribute: current_position
  enabled: '{{ position_source == ''current_position_attr'' }}'
  id: t_manual_position
  for:
    seconds: 60
- trigger: state
  entity_id: !input blind
  attribute: position
  enabled: '{{ position_source == ''position_attr'' }}'
  id: t_manual_position
  for:
    seconds: 60
- trigger: state
  entity_id: !input custom_position_sensor
  enabled: '{{ position_source == ''custom_sensor'' and custom_position_sensor !=
    [] }}'
  id: t_manual_position
  for:
    seconds: 60
- trigger: state
  entity_id: !input blind
  attribute: current_tilt_position
  id: t_manual_tilt
  for:
    minutes: 1
  enabled: '{{ is_cover_tilt_enabled }}'
- trigger: template
  value_template: '{{ now() >= today_at(reset_override_time) }}'
  enabled: '{{ is_reset_fixed_time }}'
  id: t_reset_fixedtime
  for:
    minutes: 2
- trigger: template
  value_template: "{% set helper_state = states(cover_status_helper) %} {{\n  helper_state
    not in invalid_states and\n  helper_state | regex_match(\"((\\[[^\\}]+)?\\{s*[^\\}\\{]{3,}?:.*\\}([^\\{]+\\])?)\")
    and\n  helper_state | from_json | regex_search('manual') and\n  (helper_state
    | from_json).manual.t is defined and\n  (helper_state | from_json).manual.a is
    defined and\n  (helper_state | from_json).manual.a | bool is true and\n   now()
    >= ((helper_state | from_json).manual.t + 60 * reset_override_timeout) | as_datetime
    | as_local\n}}"
  enabled: '{{ is_reset_timeout and cover_status_helper != [] }}'
  id: t_reset_timeout
  for:
    seconds: 2
conditions:
- condition: !input auto_global_condition
- or:
  - '{{ trigger.to_state is not defined }}'
  - '{{ trigger.to_state is defined and trigger.to_state.state not in invalid_states
    }}'
- or:
  - '{{ trigger.id is not defined }}'
  - '{{ not trigger.id | regex_match(''^t_calendar_event'') }}'
  - and:
    - '{{ trigger.id | regex_match(''^t_calendar_event'') }}'
    - '{{ state_attr(calendar_entity, ''message'') is not none }}'
    - "{{\n  calendar_open_title_lc in (state_attr(calendar_entity, 'message') | lower)
      or\n  calendar_close_title_lc in (state_attr(calendar_entity, 'message') | lower)\n}}"
- condition: template
  value_template: "{% if is_status_helper_enabled %}\n  {% if trigger.id is match('^t_shading_start_pending_[1-6]$')
    %}\n    {{ states(cover_status_helper) | regex_search('\"shading\"\\s*:\\s*\\{[^}]*\"a\"\\s*:\\s*0')
    }}\n  {% elif trigger.id is match('^t_shading_end_pending_[1-6]$') %}\n    {{
    states(cover_status_helper) | regex_search('\"shading\"\\s*:\\s*\\{[^}]*\"a\"\\s*:\\s*1')
    }}\n  {% else %}\n    true\n  {% endif %}\n{% else %}\n  true\n{% endif %}"
actions:
- variables:
    cover_move_action:
      sequence:
      - condition: template
        value_template: '{{ not is_cover_movement_blocked.any or trigger.id is match(''^t_force_'')
          }}'
      - condition: template
        value_template: '{{ not prevent_flags.default_cover_actions }}'
      - repeat:
          for_each: '{{ blind_entities | list }}'
          sequence:
          - choose:
            - conditions: '{{ target_position | default(101) | int == 0 }}'
              sequence:
              - service: cover.close_cover
                target:
                  entity_id: '{{ repeat.item if repeat is defined else '''' }}'
            - conditions: '{{ target_position | default(101) | int == 100 }}'
              sequence:
              - service: cover.open_cover
                target:
                  entity_id: '{{ repeat.item if repeat is defined else '''' }}'
            - conditions: '{{ 0 < target_position | default(101) | int < 100 }}'
              sequence:
              - service: cover.set_cover_position
                data:
                  position: '{{ target_position | default(101) | int }}'
                target:
                  entity_id: '{{ repeat.item if repeat is defined else '''' }}'
          - delay:
              seconds: '{{ range(1, 3) | random }}'
    tilt_move_action:
      sequence:
      - condition: template
        value_template: '{{ not is_cover_movement_blocked.any or trigger.id is match(''^t_force_'')
          }}'
      - condition: template
        value_template: '{{ not prevent_flags.default_cover_actions and is_cover_tilt_enabled_and_possible
          }}'
      - repeat:
          for_each: '{{ blind_entities | list }}'
          sequence:
          - if: '{{ state_attr(repeat.item if repeat is defined else '''', ''current_tilt_position'')
              is defined }}'
            then:
            - if: '{{ tilt_first | default(false) }}'
              then:
              - service: cover.set_cover_tilt_position
                data:
                  tilt_position: 0
                target:
                  entity_id: '{{ repeat.item if repeat is defined else '''' }}'
              - delay:
                  seconds: &id002 !input tilt_delay
            - choose:
              - conditions: '{{ is_tilt_wait_idle_mode | default(false) }}'
                sequence:
                - wait_template: '{{ states(repeat.item if repeat is defined else
                    '''') in [''open'', ''closed''] }}'
                  timeout: '{{ tilt_wait_timeout | int }}'
                  continue_on_timeout: true
                - if: '{{ wait.completed if wait is defined else '''' }}'
                  then:
                  - delay: 1
              default:
              - delay:
                  seconds: &id003 !input tilt_delay
            - service: cover.set_cover_tilt_position
              data:
                tilt_position: '{{ target_tilt_position | default(101) }}'
              target:
                entity_id: '{{ repeat.item if repeat is defined else '''' }}'
            - delay:
                seconds: '{{ range(1, 3) | random }}'
    helper_update:
      if:
      - '{{ is_status_helper_enabled }}'
      then:
      - service: input_text.set_value
        data:
          entity_id: &id001 !input cover_status_helper
          value: '{% set dict_var = helper_json %}

            {% set dict_new = dict(dict_var, **(update_values | default({})) ) %}

            {{ dict_new | to_json }}'
- if:
  - '{{ is_shading_enabled }}'
  - '{{ forecast_source.use_weather and not forecast_source.prevent_service }}'
  - '{{ states(shading_forecast_sensor) not in invalid_states }}'
  - '{{ trigger.id is defined }}'
  - '{{ trigger.id | regex_match(''^(t_shading_start|t_open_1|t_open_3)'') }}'
  then:
  - action: weather.get_forecasts
    target:
      entity_id: !input shading_forecast_sensor
    data:
      type: !input shading_forecast_type
    response_variable: weather_forecast
    continue_on_error: true
- if:
  - '{{ is_calendar_enabled }}'
  - '{{ calendar_entity != [] }}'
  - '{{ states(calendar_entity) not in invalid_states }}'
  - '{{ trigger.id is defined }}'
  - or:
    - '{{ trigger.id | regex_match(''^t_open'') }}'
    - '{{ trigger.id | regex_match(''^t_close'') }}'
    - '{{ trigger.id | regex_match(''^t_shading_start'') }}'
    - '{{ trigger.id | regex_match(''^t_calendar_event'') }}'
  then:
  - action: calendar.get_events
    target:
      entity_id: !input calendar_entity
    data:
      start_date_time: '{{ today_at(''00:00:00'').isoformat() }}'
      end_date_time: '{{ (today_at(''23:59:59'') + timedelta(seconds=1)).isoformat()
        }}'
    response_variable: calendar_events
    continue_on_error: true
- variables:
    forecast_temp_raw: "{% set sensor = shading_forecast_temp_sensor %} {% set weather
      = shading_forecast_sensor %} {% if sensor != [] and states(sensor) not in invalid_states
      %}\n  {{ states(sensor) | float(default=None) }}\n{% elif weather == [] or states(weather)
      in invalid_states %}\n  {{ None }}\n{% elif 'weather_attributes' in shading_forecast_type
      %}\n  {{ state_attr(weather, 'temperature') | float(default=None) }}\n{% elif
      weather_forecast is defined and weather in weather_forecast %}\n  {{ weather_forecast[weather].forecast[0].temperature
      | default(None) | float(default=None) }}\n{% else %}\n  {{ None }}\n{% endif
      %}"
    forecast_weather_condition_raw: "{% set weather = shading_forecast_sensor %} {%
      if weather == [] or states(weather) in invalid_states %}\n  {{ None }}\n{% elif
      'weather_attributes' in shading_forecast_type %}\n  {{ state_attr(weather, 'condition')
      }}\n{% elif weather_forecast is defined and weather in weather_forecast %}\n
      \ {{ weather_forecast[weather].forecast[0].condition | default(None) }}\n{%
      else %}\n  {{ None }}\n{% endif %}"
    shading_start_condition_states:
      azimuth_valid: "{{\n  not is_shading_enabled or\n  not shading_start_condition_enabled.azimuth
        or\n  default_sun_sensor == [] or\n  (\n    current_sun_azimuth | float(default=0)
        > shading_azimuth_start and\n    current_sun_azimuth | float(default=0) <
        shading_azimuth_end\n  )\n}}"
      elevation_valid: "{{\n  not is_shading_enabled or\n  not shading_start_condition_enabled.elevation
        or\n  default_sun_sensor == [] or\n  (\n    current_sun_elevation | float(default=0)
        > shading_elevation_min and\n    current_sun_elevation | float(default=0)
        < shading_elevation_max\n  )\n}}"
      brightness_valid: "{{\n  not is_shading_enabled or\n  not shading_start_condition_enabled.brightness
        or\n  shading_brightness_sensor == [] or\n  (\n    states(shading_brightness_sensor)
        not in invalid_states and\n    states(shading_brightness_sensor) | float(default=shading_sun_brightness_start)
        > (shading_sun_brightness_start + shading_sun_brightness_hysteresis)\n  )\n}}"
      temp1_valid: "{{\n  not is_shading_enabled or\n  not shading_start_condition_enabled.temp1
        or\n  shading_temperatur_sensor1 == [] or\n  (\n    states(shading_temperatur_sensor1)
        not in invalid_states and\n    states(shading_temperatur_sensor1) | float(default=shading_min_temperatur1)
        > (shading_min_temperatur1 + shading_temperature_hysteresis1)\n  )\n}}"
      temp2_valid: "{{\n  not is_shading_enabled or\n  not shading_start_condition_enabled.temp2
        or\n  shading_temperatur_sensor2 == [] or\n  (\n    states(shading_temperatur_sensor2)
        not in invalid_states and\n    states(shading_temperatur_sensor2) | float(default=shading_min_temperatur2)
        > (shading_min_temperatur2 + shading_temperature_hysteresis2)\n  )\n}}"
      forecast_temp_valid: "{{\n  not is_shading_enabled or\n  not shading_start_condition_enabled.forecast_temp
        or\n  shading_forecast_temp == [] or\n  (\n    forecast_temp_raw is not none
        and\n    forecast_temp_raw > (shading_forecast_temp + shading_forecast_temp_hysteresis)\n
        \ ) or\n  (\n    'shading_compare_forecast_with_sensor2' in shading_config
        and\n    shading_temperatur_sensor2 != [] and\n    shading_forecast_temp !=
        [] and\n    (states(shading_temperatur_sensor2) | float(default=0) > (shading_forecast_temp
        + shading_forecast_temp_hysteresis))\n  )\n}}"
      forecast_weather_valid: "{{\n  not is_shading_enabled or\n  not shading_start_condition_enabled.forecast_weather
        or\n  shading_weather_conditions == [] or\n  forecast_source.use_sensor or\n
        \ (\n    forecast_weather_condition_raw is not none and\n    forecast_weather_condition_raw
        not in invalid_states and\n    forecast_weather_condition_raw in shading_weather_conditions\n
        \ )\n}}"
    shading_start_and_result: "{{\n  (\n    ('cond_azimuth' not in shading_conditions_start_and
      or\n    default_sun_sensor == [] or\n    shading_start_condition_states.azimuth_valid)\n
      \   and\n    ('cond_elevation' not in shading_conditions_start_and or\n    default_sun_sensor
      == [] or\n    shading_start_condition_states.elevation_valid)\n    and\n    ('cond_brightness'
      not in shading_conditions_start_and or\n    shading_brightness_sensor == []
      or\n    shading_start_condition_states.brightness_valid)\n    and\n    ('cond_temp1'
      not in shading_conditions_start_and or\n    shading_temperatur_sensor1 == []
      or\n    shading_start_condition_states.temp1_valid)\n    and\n    ('cond_temp2'
      not in shading_conditions_start_and or\n    shading_temperatur_sensor2 == []
      or\n    shading_start_condition_states.temp2_valid)\n    and\n    ('cond_forecast_temp'
      not in shading_conditions_start_and or\n    shading_forecast_temp == [] or\n
      \   shading_start_condition_states.forecast_temp_valid)\n    and\n    ('cond_forecast_weather'
      not in shading_conditions_start_and or\n    shading_weather_conditions == []
      or\n    shading_start_condition_states.forecast_weather_valid)\n  )\n}}"
    shading_start_or_result: "{{\n  (shading_conditions_start_or | count == 0) or\n
      \ (\n    ('cond_azimuth' in shading_conditions_start_or and\n    default_sun_sensor
      != [] and\n    shading_start_condition_states.azimuth_valid)\n    or\n    ('cond_elevation'
      in shading_conditions_start_or and\n    default_sun_sensor != [] and\n    shading_start_condition_states.elevation_valid)\n
      \   or\n    ('cond_brightness' in shading_conditions_start_or and\n    shading_brightness_sensor
      != [] and\n    shading_start_condition_states.brightness_valid)\n    or\n    ('cond_temp1'
      in shading_conditions_start_or and\n    shading_temperatur_sensor1 != [] and\n
      \   shading_start_condition_states.temp1_valid)\n    or\n    ('cond_temp2' in
      shading_conditions_start_or and\n    shading_temperatur_sensor2 != [] and\n
      \   shading_start_condition_states.temp2_valid)\n    or\n    ('cond_forecast_temp'
      in shading_conditions_start_or and\n    shading_forecast_temp != [] and\n    shading_start_condition_states.forecast_temp_valid)\n
      \   or\n    ('cond_forecast_weather' in shading_conditions_start_or and\n    shading_weather_conditions
      != [] and\n    shading_start_condition_states.forecast_weather_valid)\n  )\n}}"
    shading_start_conditions_met: "{{\n  is_shading_enabled and\n  shading_start_and_result
      and\n  shading_start_or_result\n}}"
    shading_end_condition_states:
      azimuth_invalid: "{{\n  is_shading_enabled and\n  shading_end_condition_enabled.azimuth
        and\n  default_sun_sensor != [] and\n  (\n    current_sun_azimuth | float(default=999)
        <= shading_azimuth_start or\n    current_sun_azimuth | float(default=0) >=
        shading_azimuth_end\n  )\n}}"
      elevation_invalid: "{{\n  is_shading_enabled and\n  shading_end_condition_enabled.elevation
        and\n  default_sun_sensor != [] and\n  (\n    current_sun_elevation | float(default=999)
        <= shading_elevation_min or\n    current_sun_elevation | float(default=0)
        >= shading_elevation_max\n  )\n}}"
      brightness_invalid: "{{\n  is_shading_enabled and\n  shading_end_condition_enabled.brightness
        and\n  shading_brightness_sensor != [] and\n  states(shading_brightness_sensor)
        not in invalid_states and\n  states(shading_brightness_sensor) | float(default=999999)
        < (shading_sun_brightness_end - shading_sun_brightness_hysteresis)\n}}"
      temp1_invalid: "{{\n  is_shading_enabled and\n  shading_end_condition_enabled.temp1
        and\n  shading_temperatur_sensor1 != [] and\n  states(shading_temperatur_sensor1)
        not in invalid_states and\n  states(shading_temperatur_sensor1) | float(default=999)
        < (shading_min_temperatur1 - shading_temperature_hysteresis1)\n}}"
      temp2_invalid: "{{\n  is_shading_enabled and\n  shading_end_condition_enabled.temp2
        and\n  shading_temperatur_sensor2 != [] and\n  states(shading_temperatur_sensor2)
        not in invalid_states and\n  states(shading_temperatur_sensor2) | float(default=999)
        < (shading_min_temperatur2 - shading_temperature_hysteresis2)\n}}"
      forecast_temp_invalid: "{{\n  is_shading_enabled and\n  shading_end_condition_enabled.forecast_temp
        and\n  shading_forecast_temp != [] and\n  forecast_temp_raw is not none and\n
        \ forecast_temp_raw < (shading_forecast_temp - shading_forecast_temp_hysteresis)\n}}"
      forecast_weather_invalid: "{{\n  is_shading_enabled and\n  shading_end_condition_enabled.forecast_weather
        and\n  shading_weather_conditions != [] and\n  (\n    forecast_weather_condition_raw
        is none or\n    forecast_weather_condition_raw in invalid_states or\n    forecast_weather_condition_raw
        not in shading_weather_conditions\n  )\n}}"
    shading_end_and_result: "{{\n  shading_conditions_end_and | count > 0 and\n  (\n
      \   ('cond_azimuth' not in shading_conditions_end_and or shading_end_condition_states.azimuth_invalid)\n
      \   and\n    ('cond_elevation' not in shading_conditions_end_and or shading_end_condition_states.elevation_invalid)\n
      \   and\n    ('cond_brightness' not in shading_conditions_end_and or shading_end_condition_states.brightness_invalid)\n
      \   and\n    ('cond_temp1' not in shading_conditions_end_and or shading_end_condition_states.temp1_invalid)\n
      \   and\n    ('cond_temp2' not in shading_conditions_end_and or shading_end_condition_states.temp2_invalid)\n
      \   and\n    ('cond_forecast_temp' not in shading_conditions_end_and or shading_end_condition_states.forecast_temp_invalid)\n
      \   and\n    ('cond_forecast_weather' not in shading_conditions_end_and or shading_end_condition_states.forecast_weather_invalid)\n
      \ )\n}}"
    shading_end_or_result: "{{\n  shading_conditions_end_or | count > 0 and\n  (\n
      \   shading_end_condition_states.azimuth_invalid or\n    shading_end_condition_states.elevation_invalid
      or\n    shading_end_condition_states.brightness_invalid or\n    shading_end_condition_states.temp1_invalid
      or\n    shading_end_condition_states.temp2_invalid or\n    shading_end_condition_states.forecast_temp_invalid
      or\n    shading_end_condition_states.forecast_weather_invalid\n  )\n}}"
    shading_end_conditions_met: "{{\n  is_shading_enabled and\n  (\n    shading_end_and_result
      or\n    shading_end_or_result\n  )\n}}"
    calendar_open_event: "{% set result = namespace(found=false, start=none, end=none)
      %} {% if is_calendar_enabled and calendar_events is defined and calendar_entity
      in calendar_events %}\n  {% set events = calendar_events[calendar_entity].events
      | default([]) %}\n  {% for event in events %}\n    {% set summary = (event.summary
      | default('')) | lower | trim %}\n    {% if calendar_open_title_lc != '' and
      calendar_open_title_lc in summary %}\n      {% set result.found = true %}\n
      \     {% set result.start = event.start %}\n      {% set result.end = event.end
      %}\n    {% endif %}\n  {% endfor %}\n{% endif %} {{ {\n  'found': result.found,\n
      \ 'start': result.start,\n  'end': result.end\n} }}"
    calendar_close_event: "{% set result = namespace(found=false, start=none, end=none)
      %} {% if is_calendar_enabled and calendar_events is defined and calendar_entity
      in calendar_events %}\n  {% set events = calendar_events[calendar_entity].events
      | default([]) %}\n  {% for event in events %}\n    {% set summary = (event.summary
      | default('')) | lower | trim %}\n    {% if calendar_close_title_lc != '' and
      calendar_close_title_lc in summary %}\n      {% set result.found = true %}\n
      \     {% set result.start = event.start %}\n      {% set result.end = event.end
      %}\n    {% endif %}\n  {% endfor %}\n{% endif %} {{ {\n  'found': result.found,\n
      \ 'start': result.start,\n  'end': result.end\n} }}"
    now_ts: '{{ as_timestamp(now()) }}'
    calendar_open_start: "{% if calendar_open_event.found and calendar_open_event.start
      is not none %}\n  {{ as_timestamp(calendar_open_event.start) }}\n{% else %}\n
      \ {{ none }}\n{% endif %}"
    calendar_open_end: "{% if calendar_open_event.found and calendar_open_event.end
      is not none %}\n  {{ as_timestamp(calendar_open_event.end) }}\n{% else %}\n
      \ {{ none }}\n{% endif %}"
    calendar_close_start: "{% if calendar_close_event.found and calendar_close_event.start
      is not none %}\n  {{ as_timestamp(calendar_close_event.start) }}\n{% else %}\n
      \ {{ none }}\n{% endif %}"
    calendar_close_end: "{% if calendar_close_event.found and calendar_close_event.end
      is not none %}\n  {{ as_timestamp(calendar_close_event.end) }}\n{% else %}\n
      \ {{ none }}\n{% endif %}"
    is_opening_phase: "{{\n  (\n    is_time_field_enabled and\n    now() >= today_at(time_up_early_today)
      and\n    now() < today_at(time_up_late_today)\n  ) or\n  (\n    is_calendar_enabled
      and\n    calendar_open_start is not none and\n    calendar_open_end is not none
      and\n    now_ts >= calendar_open_start and\n    now_ts < calendar_open_end\n
      \ )\n}}"
    is_daytime_phase: "{{\n  is_time_control_disabled or\n  (\n    is_time_field_enabled
      and\n    now() >= today_at(time_up_early_today) and\n    now() < today_at(time_down_early_today))
      or\n  (\n    is_calendar_enabled and\n    calendar_open_start is not none and\n
      \   calendar_close_start is not none and\n    now_ts >= calendar_open_start
      and\n    now_ts < calendar_close_start)\n}}"
    is_closing_phase: "{{\n  (\n    is_time_field_enabled and\n    now() >= today_at(time_down_early_today)
      and\n    now() < today_at(time_down_late_today)\n  ) or\n  (\n    is_calendar_enabled
      and\n    calendar_close_start is not none and\n    calendar_close_end is not
      none and\n    now_ts >= calendar_close_start and\n    now_ts < calendar_close_end\n
      \ )\n}}"
    is_evening_phase: "{{\n  not is_time_control_disabled and\n  (\n    (\n      is_time_field_enabled
      and\n      now() >= today_at(time_down_early_today)\n    ) or\n    (\n      is_calendar_enabled
      and\n      calendar_close_start is not none and\n      now_ts >= calendar_close_start\n
      \   )\n  )\n}}"
    is_time_up_late: "{{\n  (\n    is_time_field_enabled and\n    now() >= today_at(time_up_late_today)
      and\n    now() < today_at(time_down_early_today)\n  ) or\n  (\n    is_calendar_enabled
      and\n    calendar_open_end is not none and\n    calendar_close_start is not
      none and\n    now_ts >= calendar_open_end and\n    now_ts < calendar_close_start\n
      \ )\n}}"
    is_time_down_late: "{{\n  (\n    is_time_field_enabled and\n    now() >= today_at(time_down_late_today)\n
      \ ) or\n  (\n    is_calendar_enabled and\n    calendar_close_end is not none
      and\n    now_ts >= calendar_close_end\n  )\n}}"
    is_shading_allowed_window: "{{\n  is_time_control_disabled or\n  (\n    is_time_field_enabled
      and\n    now() >= today_at(time_up_early_today) and\n    now() <= today_at(time_down_late_today)
      + timedelta(seconds = 5)\n  ) or\n  (\n    is_calendar_enabled and\n    calendar_open_start
      is not none and\n    calendar_close_end is not none and\n    now_ts >= calendar_open_start
      and\n    now_ts <= calendar_close_end\n  )\n}}"
    environment_allows_opening: "{{\n  (\n    not is_brightness_enabled or\n    default_brightness_sensor
      == [] or\n    states(default_brightness_sensor) | float(default=brightness_up)
      > (brightness_up + brightness_hysteresis)\n  ) and\n  (\n    not is_sun_elevation_enabled
      or\n    default_sun_sensor == [] or\n    current_sun_elevation | float(default=sun_elevation_up_current)
      > sun_elevation_up_current\n  )\n}}"
    environment_allows_closing: "{{\n  (\n    is_brightness_enabled and\n    (\n      default_brightness_sensor
      == [] or\n      states(default_brightness_sensor) | float(default=brightness_down)
      < (brightness_down - brightness_hysteresis)\n    )\n  ) or\n  (\n    is_sun_elevation_enabled
      and\n    (\n      default_sun_sensor == [] or\n      current_sun_elevation |
      float(default=sun_elevation_down_current) < sun_elevation_down_current\n    )\n
      \ )\n}}"
    should_be_open_now: "{{\n  is_daytime_phase and\n  not is_evening_phase and\n
      \ (\n    (not is_brightness_enabled and not is_sun_elevation_enabled) or\n    environment_allows_opening\n
      \ )\n}}"
    should_be_closed_now: "{{\n  is_evening_phase and\n  (\n    (not is_brightness_enabled
      and not is_sun_elevation_enabled) or\n    environment_allows_closing\n  )\n}}"
- if:
  - '{{ ''cover_helper_enabled'' in cover_status_options }}'
  - '{{ cover_status_helper != [] }}'
  - or:
    - '{{ states(cover_status_helper) in invalid_states }}'
    - '{{ not states(cover_status_helper) | regex_match("((\[[^\}]+)?\{s*[^\}\{]{3,}?:.*\}([^\{]+\])?)")
      }}'
  then:
  - action: input_text.set_value
    data:
      entity_id: !input cover_status_helper
      value: '{{ helper_json | to_json }}'
- if:
  - '{{ is_status_helper_enabled }}'
  - '{{ helper_json.v != 5 }}'
  then:
  - variables:
      ts_now: '{{ as_timestamp(now()) | round(0) }}'
  - variables:
      update_values:
        open:
          a: '{{ helper_status.open | int | default(0) }}'
          t: '{{ helper_ts.open | default(ts_now) }}'
        close:
          a: '{{ helper_status.closed | int | default(0) }}'
          t: '{{ helper_ts.closed | default(ts_now) }}'
        shading:
          a: '{{ helper_status.shaded | int | default(0) }}'
          t: '{{ helper_ts.shaded | default(ts_now) }}'
          p: 0
          q: 0
        vpart:
          a: '{{ helper_status.vpart | int | default(0) }}'
          t: '{{ helper_ts.vpart | default(ts_now) }}'
        vfull:
          a: '{{ helper_status.vfull | int | default(0) }}'
          t: '{{ helper_ts.vfull | default(ts_now) }}'
        manual:
          a: '{{ helper_status.manual | int | default(0) }}'
          t: '{{ helper_ts.manual | default(ts_now) }}'
        v: 5
        t: '{{ helper_json.t | round(0) }}'
  - if:
    - '{{ is_status_helper_enabled }}'
    then:
    - service: input_text.set_value
      data:
        entity_id: *id001
        value: '{% set dict_var = helper_json %}

          {% set dict_new = dict(dict_var, **(update_values | default({})) ) %}

          {{ dict_new | to_json }}'
- choose:
  - alias: Check for opening
    conditions:
    - '{{ is_up_enabled }}'
    - '{{ trigger.id is defined }}'
    - '{{ trigger.id | regex_match(''^(t_open|t_calendar_event)'') }}'
    - condition: !input auto_up_condition
    - or:
      - '{{ is_auto_recover_enabled }}'
      - '{{ not is_cover_movement_blocked.open }}'
    - or:
      - '{{ is_status_helper_enabled and not helper_status.open }}'
      - '{{ not in_open_position }}'
    - '{{ not (is_status_helper_enabled and helper_status.manual and override_flags.opening)
      }}'
    - or:
      - '{{ not is_status_helper_enabled }}'
      - '{{ not prevent_flags.opening_multiple_times }}'
      - '{{ is_status_helper_enabled and prevent_flags.opening_multiple_times and
        ((now().day != helper_ts.open|timestamp_custom(''%-d'')|int) or helper_ts.manual
        <= helper_ts.open) }}'
    - or:
      - '{{ trigger.id != ''t_open_6'' }}'
      - and:
        - '{{ trigger.id == ''t_open_6'' }}'
        - '{{ resident_flags.opening_enabled }}'
        - '{{ should_be_open_now }}'
    - or:
      - '{{ resident_sensor == [] }}'
      - '{{ states(resident_sensor) in [''false'', ''off''] }}'
      - and:
        - '{{ resident_flags.allow_opening }}'
        - '{{ states(resident_sensor) in [''true'', ''on''] }}'
    - or:
      - '{{ is_time_control_disabled }}'
      - and:
        - '{{ is_time_up_late }}'
      - and:
        - '{{ is_opening_phase or is_daytime_phase }}'
        - '{{ not is_evening_phase }}'
        - '{{ environment_allows_opening }}'
    sequence:
    - delay:
        seconds: '{{ range(drive_delay_fix|int(0), drive_delay_fix|int(0) + drive_delay_random|int(0)
          +1) | random }}'
    - choose:
      - alias: Shading detected. Move to shading position
        conditions:
        - '{{ is_status_helper_enabled }}'
        - or:
          - '{{ helper_status.shaded }}'
          - '{{ helper_status.shading_start_pending }}'
        - '{{ not in_shading_position }}'
        sequence:
        - choose: []
          default: !input auto_shading_start_action_before
        - variables:
            target_position: !input shading_position
            target_tilt_position: '{{ shading_tilt_position | int }}'
            ts_now: '{{ as_timestamp(now()) | round(0) }}'
            update_values:
              open:
                a: 1
                t: '{{ ts_now }}'
              close:
                a: 0
                t: '{{ helper_json.close.t }}'
              shading:
                a: 1
                t: '{{ helper_json.shading.t }}'
                p: 0
                q: 0
              vpart:
                a: 0
                t: '{{ helper_json.vpart.t }}'
              vfull:
                a: 0
                t: '{{ helper_json.vfull.t }}'
              manual:
                a: 0
                t: '{{ helper_json.manual.t }}'
              t: '{{ ts_now }}'
        - if: '{{ not is_cover_movement_blocked.shading }}'
          then:
          - sequence:
            - condition: template
              value_template: '{{ not is_cover_movement_blocked.any or trigger.id
                is match(''^t_force_'') }}'
            - condition: template
              value_template: '{{ not prevent_flags.default_cover_actions }}'
            - repeat:
                for_each: '{{ blind_entities | list }}'
                sequence:
                - choose:
                  - conditions: '{{ target_position | default(101) | int == 0 }}'
                    sequence:
                    - service: cover.close_cover
                      target:
                        entity_id: '{{ repeat.item if repeat is defined else ''''
                          }}'
                  - conditions: '{{ target_position | default(101) | int == 100 }}'
                    sequence:
                    - service: cover.open_cover
                      target:
                        entity_id: '{{ repeat.item if repeat is defined else ''''
                          }}'
                  - conditions: '{{ 0 < target_position | default(101) | int < 100
                      }}'
                    sequence:
                    - service: cover.set_cover_position
                      data:
                        position: '{{ target_position | default(101) | int }}'
                      target:
                        entity_id: '{{ repeat.item if repeat is defined else ''''
                          }}'
                - delay:
                    seconds: '{{ range(1, 3) | random }}'
          - sequence:
            - condition: template
              value_template: '{{ not is_cover_movement_blocked.any or trigger.id
                is match(''^t_force_'') }}'
            - condition: template
              value_template: '{{ not prevent_flags.default_cover_actions and is_cover_tilt_enabled_and_possible
                }}'
            - repeat:
                for_each: '{{ blind_entities | list }}'
                sequence:
                - if: '{{ state_attr(repeat.item if repeat is defined else '''', ''current_tilt_position'')
                    is defined }}'
                  then:
                  - if: '{{ tilt_first | default(false) }}'
                    then:
                    - service: cover.set_cover_tilt_position
                      data:
                        tilt_position: 0
                      target:
                        entity_id: '{{ repeat.item if repeat is defined else ''''
                          }}'
                    - delay:
                        seconds: *id002
                  - choose:
                    - conditions: '{{ is_tilt_wait_idle_mode | default(false) }}'
                      sequence:
                      - wait_template: '{{ states(repeat.item if repeat is defined
                          else '''') in [''open'', ''closed''] }}'
                        timeout: '{{ tilt_wait_timeout | int }}'
                        continue_on_timeout: true
                      - if: '{{ wait.completed if wait is defined else '''' }}'
                        then:
                        - delay: 1
                    default:
                    - delay:
                        seconds: *id003
                  - service: cover.set_cover_tilt_position
                    data:
                      tilt_position: '{{ target_tilt_position | default(101) }}'
                    target:
                      entity_id: '{{ repeat.item if repeat is defined else '''' }}'
                  - delay:
                      seconds: '{{ range(1, 3) | random }}'
          - choose: []
            default: !input auto_shading_start_action
        - if:
          - '{{ is_auto_recover_enabled or not is_cover_movement_blocked.shading }}'
          then:
          - if:
            - '{{ is_status_helper_enabled }}'
            then:
            - service: input_text.set_value
              data:
                entity_id: *id001
                value: '{% set dict_var = helper_json %}

                  {% set dict_new = dict(dict_var, **(update_values | default({}))
                  ) %}

                  {{ dict_new | to_json }}'
        - stop: 'Opening skipped: Shading detected'
      - alias: Normal opening of the cover
        conditions:
        - '{{ not in_shading_position }}'
        - or:
          - '{{ is_status_helper_enabled and not helper_status.open }}'
          - '{{ not in_open_position }}'
        sequence:
        - choose: []
          default: !input auto_up_action_before
        - variables:
            target_position: !input open_position
            target_tilt_position: '{{ open_tilt_position | int }}'
            ts_now: '{{ as_timestamp(now()) | round(0) }}'
            update_values:
              open:
                a: 1
                t: '{{ ts_now }}'
              close:
                a: 0
                t: '{{ helper_json.close.t }}'
              shading:
                a: 0
                t: '{{ helper_json.shading.t }}'
                p: 0
                q: 0
              vpart:
                a: 0
                t: '{{ helper_json.vpart.t }}'
              vfull:
                a: 0
                t: '{{ helper_json.vfull.t }}'
              manual:
                a: 0
                t: '{{ helper_json.manual.t }}'
              t: '{{ ts_now }}'
        - if: '{{ not is_cover_movement_blocked.open }}'
          then:
          - sequence:
            - condition: template
              value_template: '{{ not is_cover_movement_blocked.any or trigger.id
                is match(''^t_force_'') }}'
            - condition: template
              value_template: '{{ not prevent_flags.default_cover_actions }}'
            - repeat:
                for_each: '{{ blind_entities | list }}'
                sequence:
                - choose:
                  - conditions: '{{ target_position | default(101) | int == 0 }}'
                    sequence:
                    - service: cover.close_cover
                      target:
                        entity_id: '{{ repeat.item if repeat is defined else ''''
                          }}'
                  - conditions: '{{ target_position | default(101) | int == 100 }}'
                    sequence:
                    - service: cover.open_cover
                      target:
                        entity_id: '{{ repeat.item if repeat is defined else ''''
                          }}'
                  - conditions: '{{ 0 < target_position | default(101) | int < 100
                      }}'
                    sequence:
                    - service: cover.set_cover_position
                      data:
                        position: '{{ target_position | default(101) | int }}'
                      target:
                        entity_id: '{{ repeat.item if repeat is defined else ''''
                          }}'
                - delay:
                    seconds: '{{ range(1, 3) | random }}'
          - sequence:
            - condition: template
              value_template: '{{ not is_cover_movement_blocked.any or trigger.id
                is match(''^t_force_'') }}'
            - condition: template
              value_template: '{{ not prevent_flags.default_cover_actions and is_cover_tilt_enabled_and_possible
                }}'
            - repeat:
                for_each: '{{ blind_entities | list }}'
                sequence:
                - if: '{{ state_attr(repeat.item if repeat is defined else '''', ''current_tilt_position'')
                    is defined }}'
                  then:
                  - if: '{{ tilt_first | default(false) }}'
                    then:
                    - service: cover.set_cover_tilt_position
                      data:
                        tilt_position: 0
                      target:
                        entity_id: '{{ repeat.item if repeat is defined else ''''
                          }}'
                    - delay:
                        seconds: *id002
                  - choose:
                    - conditions: '{{ is_tilt_wait_idle_mode | default(false) }}'
                      sequence:
                      - wait_template: '{{ states(repeat.item if repeat is defined
                          else '''') in [''open'', ''closed''] }}'
                        timeout: '{{ tilt_wait_timeout | int }}'
                        continue_on_timeout: true
                      - if: '{{ wait.completed if wait is defined else '''' }}'
                        then:
                        - delay: 1
                    default:
                    - delay:
                        seconds: *id003
                  - service: cover.set_cover_tilt_position
                    data:
                      tilt_position: '{{ target_tilt_position | default(101) }}'
                    target:
                      entity_id: '{{ repeat.item if repeat is defined else '''' }}'
                  - delay:
                      seconds: '{{ range(1, 3) | random }}'
          - choose: []
            default: !input auto_up_action
        - if:
          - '{{ is_auto_recover_enabled or not is_cover_movement_blocked.open }}'
          then:
          - if:
            - '{{ is_status_helper_enabled }}'
            then:
            - service: input_text.set_value
              data:
                entity_id: *id001
                value: '{% set dict_var = helper_json %}

                  {% set dict_new = dict(dict_var, **(update_values | default({}))
                  ) %}

                  {{ dict_new | to_json }}'
        - stop: Opening executed
  - alias: Check for closing cover
    conditions:
    - '{{ is_down_enabled }}'
    - '{{ trigger.id is defined }}'
    - '{{ trigger.id | regex_match(''^(t_close|t_calendar_event)'') }}'
    - condition: !input auto_down_condition
    - or:
      - '{{ is_auto_recover_enabled }}'
      - '{{ not is_cover_movement_blocked.close }}'
    - or:
      - '{{ is_status_helper_enabled and not helper_status.closed }}'
      - '{{ not in_close_position }}'
    - '{{ not (is_status_helper_enabled and helper_status.manual and override_flags.closing)
      }}'
    - or:
      - '{{ not is_status_helper_enabled }}'
      - '{{ not prevent_flags.closing_multiple_times }}'
      - '{{ is_status_helper_enabled and prevent_flags.closing_multiple_times and
        ((helper_ts.closed < today_at(time_down_early_today) | as_timestamp) or helper_ts.manual
        <= helper_ts.closed) }}'
    - or:
      - '{{ is_time_control_disabled }}'
      - and:
        - '{{ is_time_down_late }}'
      - and:
        - '{{ trigger.id == ''t_close_6'' }}'
        - '{{ resident_sensor != [] }}'
        - '{{ states(resident_sensor) in [''true'', ''on''] }}'
        - '{{ resident_flags.closing_enabled }}'
      - and:
        - '{{ is_closing_phase or is_evening_phase }}'
        - '{{ environment_allows_closing }}'
    sequence:
    - choose:
      - alias: Lockout protection when closing
        conditions:
        - '{{ is_ventilation_enabled }}'
        - '{{ is_status_helper_enabled }}'
        - or:
          - and:
            - '{{ contact_window_opened != [] }}'
            - '{{ states(contact_window_opened) in [''true'', ''on''] }}'
          - and:
            - '{{ lockout_tilted_when_closing }}'
            - '{{ contact_window_tilted != [] }}'
            - '{{ states(contact_window_tilted) in [''true'', ''on''] }}'
        sequence:
        - variables:
            ts_now: '{{ as_timestamp(now()) | round(0) }}'
            update_values:
              open:
                a: 0
                t: '{{ helper_json.open.t }}'
              close:
                a: 1
                t: '{{ ts_now }}'
              shading:
                a: 0
                t: '{{ helper_json.shading.t }}'
                p: 0
                q: 0
              vpart:
                a: 0
                t: '{{ helper_json.vpart.t }}'
              vfull:
                a: 1
                t: '{{ ts_now }}'
              manual:
                a: 0
                t: '{{ helper_json.manual.t }}'
              t: '{{ ts_now }}'
        - if:
          - '{{ is_status_helper_enabled }}'
          then:
          - service: input_text.set_value
            data:
              entity_id: *id001
              value: '{% set dict_var = helper_json %}

                {% set dict_new = dict(dict_var, **(update_values | default({})) )
                %}

                {{ dict_new | to_json }}'
        - stop: 'Closing skipped: Lockout enabled'
      - alias: Window tilted. No lockout. Move to ventilation position instead of
          closing
        conditions:
        - '{{ is_ventilation_enabled }}'
        - '{{ is_status_helper_enabled }}'
        - '{{ contact_window_tilted != [] }}'
        - '{{ states(contact_window_tilted) in [''true'', ''on''] }}'
        - '{{ not lockout_tilted_when_closing }}'
        - or:
          - '{{ contact_window_opened == [] }}'
          - '{{ states(contact_window_opened) in [''false'', ''off''] }}'
        sequence:
        - choose: []
