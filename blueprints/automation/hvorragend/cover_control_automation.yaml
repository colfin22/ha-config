  - alias: Reset shading status that is no longer required - but still saved
    conditions:
    - '{{ trigger.id is defined }}'
    - '{{ trigger.id == ''t_shading_reset'' }}'
    - '{{ is_status_helper_enabled }}'
    - or:
      - '{{ helper_status.shaded }}'
      - '{{ helper_status.shading_start_pending }}'
      - '{{ helper_status.shading_end_pending }}'
    sequence:
    - delay:
        seconds: '{{ (range(0, 60) | random | int) }}'
    - variables:
        update_values:
          shading:
            a: 0
            t: '{{ helper_json.shading.t }}'
            p: 0
            q: 0
          t: '{{ as_timestamp(now()) | round(0) }}'
    - if:
      - '{{ is_status_helper_enabled }}'
      then:
      - service: input_text.set_value
        data:
          entity_id: *id001
          value: '{% set dict_var = helper_json %}

            {% set dict_new = dict(dict_var, **(update_values | default({})) ) %}

            {{ dict_new | to_json }}'
    - stop: Midnight Reset executed
  default:
  - if:
    - '{{ check_config }}'
    then:
    - repeat:
        for_each:
        - condition: '{{ state_attr(blind, ''current_position'') is none }}'
          message: Cover entity is missing the required 'current_position' attribute
        - condition: '{{ state_attr(default_sun_sensor, ''elevation'') is none }}'
          message: Sun sensor is missing the required 'elevation' attribute
        - condition: '{{ state_attr(default_sun_sensor, ''azimuth'') is none }}'
          message: Sun sensor is missing the required 'azimuth' attribute
        - condition: '{{ resident_sensor != [] and states(resident_sensor) not in
            [''false'', ''off'', ''true'', ''on''] }}'
          message: 'resident_sensor has invalid state. Must be: on, off, true, or
            false'
        - condition: '{{ is_brightness_enabled and (default_brightness_sensor == []
            or not is_number(states(default_brightness_sensor))) }}'
          message: Brightness sensor not configured or has non-numeric state
        - condition: "{{\n  is_sun_elevation_enabled and\n  sun_elevation_mode ==
            'dynamic' and\n  sun_elevation_up_sensor == []\n}}"
          message: Sun Elevation Mode is 'dynamic' but Sun Elevation Up Sensor is
            not configured. Configure sensor or change mode to 'fixed'
        - condition: "{{\n  is_sun_elevation_enabled and\n  sun_elevation_mode ==
            'dynamic' and\n  sun_elevation_down_sensor == []\n}}"
          message: Sun Elevation Mode is 'dynamic' but Sun Elevation Down Sensor is
            not configured. Configure sensor or change mode to 'fixed'
        - condition: "{{\n  is_sun_elevation_enabled and\n  sun_elevation_mode ==
            'dynamic' and\n  sun_elevation_up_sensor != [] and\n  not is_number(states(sun_elevation_up_sensor))\n}}"
          message: Sun Elevation Up Sensor has non-numeric state. Sensor must provide
            numeric values in dynamic mode
        - condition: "{{\n  is_sun_elevation_enabled and\n  sun_elevation_mode ==
            'dynamic' and\n  sun_elevation_down_sensor != [] and\n  not is_number(states(sun_elevation_down_sensor))\n}}"
          message: Sun Elevation Down Sensor has non-numeric state. Sensor must provide
            numeric values in dynamic mode
        - condition: "{{\n  is_sun_elevation_enabled and\n  sun_elevation_mode ==
            'hybrid' and\n  sun_elevation_up_sensor == []\n}}"
          message: Sun Elevation Mode is 'hybrid' but Sun Elevation Up Sensor is not
            configured. Configure sensor or change mode to 'fixed'
        - condition: "{{\n  is_sun_elevation_enabled and\n  sun_elevation_mode ==
            'hybrid' and\n  sun_elevation_down_sensor == []\n}}"
          message: Sun Elevation Mode is 'hybrid' but Sun Elevation Down Sensor is
            not configured. Configure sensor or change mode to 'fixed'
        - condition: "{{\n  is_sun_elevation_enabled and\n  sun_elevation_mode ==
            'hybrid' and\n  sun_elevation_up_sensor != [] and\n  not is_number(states(sun_elevation_up_sensor))\n}}"
          message: Sun Elevation Up Sensor has non-numeric state. Sensor must provide
            numeric values in hybrid mode
        - condition: "{{\n  is_sun_elevation_enabled and\n  sun_elevation_mode ==
            'hybrid' and\n  sun_elevation_down_sensor != [] and\n  not is_number(states(sun_elevation_down_sensor))\n}}"
          message: Sun Elevation Down Sensor has non-numeric state. Sensor must provide
            numeric values in hybrid mode
        - condition: '{{ ''cover_helper_enabled'' in cover_status_options and state_attr(cover_status_helper,
            ''max'') < 254 }}'
          message: Cover status helper must have minimum length of 254 characters
        - condition: '{{ (is_shading_enabled or is_ventilation_enabled) and not is_status_helper_enabled
            }}'
          message: Shading and ventilation features require a cover status helper.
            Please configure one
        - condition: '{{ is_cover_tilt_enabled and state_attr(blind, ''current_tilt_position'')
            is none }}'
          message: Tilt position control enabled but cover does not support 'current_tilt_position'
            attribute. Disable tilt features or check cover integration
        - condition: "{{\n  workday_sensor_today not in [[], none] and\n  states(workday_sensor_today)
            not in ['on', 'off', 'unknown', 'unavailable']\n}}"
          message: 'Workday sensor today has invalid state. Expected: on or off'
        - condition: "{{\n  workday_sensor_tomorrow not in [[], none] and\n  states(workday_sensor_tomorrow)
            not in ['on', 'off', 'unknown', 'unavailable']\n}}"
          message: 'Workday sensor tomorrow has invalid state. Expected: on or off'
        - condition: "{{\n  auto_up_force not in [[], none] and\n  states(auto_up_force)
            not in ['on', 'off', 'true', 'false', 'unknown', 'unavailable']\n}}"
          message: 'Force Open entity has invalid state. Must be binary: on/off'
        - condition: "{{\n  auto_down_force not in [[], none] and\n  states(auto_down_force)
            not in ['on', 'off', 'true', 'false', 'unknown', 'unavailable']\n}}"
          message: 'Force Close entity has invalid state. Must be binary: on/off'
        - condition: "{{\n  auto_ventilate_force not in [[], none] and\n  states(auto_ventilate_force)
            not in ['on', 'off', 'true', 'false', 'unknown', 'unavailable']\n}}"
          message: 'Force Ventilate entity has invalid state. Must be binary: on/off'
        - condition: "{{\n  auto_shading_start_force not in [[], none] and\n  states(auto_shading_start_force)
            not in ['on', 'off', 'true', 'false', 'unknown', 'unavailable']\n}}"
          message: 'Force Shading entity has invalid state. Must be binary: on/off'
        - condition: "{{\n  [\n    auto_up_force not in [[], none] and states(auto_up_force)
            in ['on', 'true'],\n    auto_down_force not in [[], none] and states(auto_down_force)
            in ['on', 'true'],\n    auto_ventilate_force not in [[], none] and states(auto_ventilate_force)
            in ['on', 'true'],\n    auto_shading_start_force not in [[], none] and
            states(auto_shading_start_force) in ['on', 'true']\n  ].count(true) >
            1\n}}"
          message: 'CRITICAL: Multiple force entities are active. Only one force entity
            can be active at a time. Deactivate conflicting force entities'
        - condition: "{{\n  default_sun_sensor not in [[], none] and\n  states(default_sun_sensor)
            in ['unknown', 'unavailable']\n}}"
          message: Sun sensor is unavailable. Check sun integration is enabled
        - condition: '{{ forecast_source.use_weather and states(shading_forecast_sensor)
            in [''unknown'', ''unavailable''] }}'
          message: Weather entity is unavailable. Check weather integration
        - condition: '{{ forecast_source.use_sensor and states(shading_forecast_temp_sensor)
            in [''unknown'', ''unavailable''] }}'
          message: Forecast temperature sensor is unavailable
        - condition: '{{ forecast_source.use_sensor and not is_number(states(shading_forecast_temp_sensor))
            }}'
          message: Forecast temperature sensor is non-numeric
        - condition: "{{\n  sun_elevation_up_sensor != [] and\n  states(sun_elevation_up_sensor)
            in ['unknown', 'unavailable']\n}}"
          message: Dynamic sun elevation up sensor is unavailable. Check sensor configuration
        - condition: "{{\n  sun_elevation_up_sensor != [] and\n  states(sun_elevation_up_sensor)
            not in invalid_states and\n  not is_number(states(sun_elevation_up_sensor))\n}}"
          message: Dynamic sun elevation up sensor has non-numeric state
        - condition: "{{\n  sun_elevation_up_sensor != [] and\n  is_number(states(sun_elevation_up_sensor))
            and\n  (states(sun_elevation_up_sensor) | float < -90 or states(sun_elevation_up_sensor)
            | float > 90)\n}}"
          message: Dynamic sun elevation up sensor value is outside valid range (-90°
            to 90°)
        - condition: "{{\n  sun_elevation_down_sensor != [] and\n  states(sun_elevation_down_sensor)
            in ['unknown', 'unavailable']\n}}"
          message: Dynamic sun elevation down sensor is unavailable. Check sensor
            configuration
        - condition: "{{\n  sun_elevation_down_sensor != [] and\n  states(sun_elevation_down_sensor)
            not in invalid_states and\n  not is_number(states(sun_elevation_down_sensor))\n}}"
          message: Dynamic sun elevation down sensor has non-numeric state
        - condition: "{{\n  sun_elevation_down_sensor != [] and\n  is_number(states(sun_elevation_down_sensor))
            and\n  (states(sun_elevation_down_sensor) | float < -90 or states(sun_elevation_down_sensor)
            | float > 90)\n}}"
          message: Dynamic sun elevation down sensor value is outside valid range
            (-90° to 90°)
        - condition: "{{\n  sun_elevation_up_sensor != [] and\n  sun_elevation_down_sensor
            != [] and\n  is_number(states(sun_elevation_up_sensor)) and\n  is_number(states(sun_elevation_down_sensor))
            and\n  (states(sun_elevation_up_sensor) | float) <= (states(sun_elevation_down_sensor)
            | float)\n}}"
          message: Dynamic sun elevation up sensor should be higher than down sensor
        - condition: "{{\n  sun_elevation_up_sensor != [] and\n  sun_elevation_down_sensor
            == [] and\n  sun_elevation_up <= sun_elevation_down\n}}"
          message: 'WARNING: Using dynamic sensor for UP but fixed value for DOWN.
            Thresholds may be inconsistent'
        - condition: "{{\n  sun_elevation_up_sensor == [] and\n  sun_elevation_down_sensor
            != [] and\n  sun_elevation_up <= sun_elevation_down\n}}"
          message: 'WARNING: Using dynamic sensor for DOWN but fixed value for UP.
            Thresholds may be inconsistent'
        - condition: "{{\n  is_calendar_enabled and\n  calendar_entity != [] and\n
            \ states(calendar_entity) in ['unknown', 'unavailable']\n}}"
          message: Calendar entity is unavailable. Check calendar integration
        - condition: "{{\n  is_calendar_enabled and\n  calendar_entity != [] and\n
            \ state_attr(calendar_entity, 'message') is none\n}}"
          message: Calendar entity does not have 'message' attribute. Ensure it's
            a valid calendar entity
        - condition: "{{\n  position_source == 'position_attr' and\n  state_attr(blind,
            'position') is none\n}}"
          message: Position source set to 'position' attribute but cover doesn't have
            this attribute
        - condition: "{{\n  position_source == 'current_position_attr' and\n  state_attr(blind,
            'current_position') is none\n}}"
          message: Position source set to 'current_position' attribute but cover doesn't
            have this attribute (try 'position' or custom sensor)
        - condition: "{{\n  position_source == 'custom_sensor' and\n  (custom_position_sensor
            == [] or states(custom_position_sensor) in invalid_states)\n}}"
          message: Custom position sensor selected but not configured or unavailable
        - condition: "{{\n  position_source == 'custom_sensor' and\n  custom_position_sensor
            != [] and\n  not is_number(states(custom_position_sensor))\n}}"
          message: Custom position sensor has non-numeric value
        sequence:
        - if:
          - '{{ repeat.item.condition }}'
          then:
          - action: system_log.write
            data:
              level: '{{ check_config_debuglevel }}'
              message: 'CCA Config issue: {{ repeat.item.message }} - {{ this.entity_id
                }}'
              logger: blueprints.hvorragend.cca
  - stop: No operational branch matched (Opening, Closing, Shading, etc. conditions
      not met for current trigger)
