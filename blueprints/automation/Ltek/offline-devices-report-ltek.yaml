blueprint:
  name: ⛔ Offline Devices Report with Notification Actions
  description: "\n⛔ Offline Devices Report with Notification Actions\n\nAuthor: LTek\n\n\U0001F680
    Version 2026.04.20.49c\n\n- Fix: error when excluded entity no longer existed,
    now it ignores the missing entity\n- New: improved overall system performance
    (fewer entity checks when not needed)\n- recent add: Custom Actions option to
    run only when offline devices are detected\n- recent fix: Debug triggers, Template
    syntax errors, To-Do list output, Empty notifications, Button trigger fix\n\nDEBUG
    README... Real-Time Debug trigger code is commented out. To use, you need to uncomment
    'Real-Time Debug Code' section\n\n\U0001F4D6 Community Discussion, Help, and Details...
    https://community.home-assistant.io/t/offline-devices-report-easy-customize-includes-excludes-notifications-more/887859\n\n***Features***\n\U0001F4F1
    Device Notifications\n   - Send alerts to mobile devices via mobile_app integration\n
    \  - iOS and Android specific notification options\n   - Configurable interruption
    levels and sounds\n\n\U0001F4E2 Persistent Web UI Notifications\n   - Dashboard
    notifications for offline devices\n   - Optional \"no issues\" confirmation messages\n\n⚡
    Execution methods\n   - Schedule Time and Day(s)\n   - Manual trigger via button\n
    \  - Debug mode for immediate offline/unknown state changes\n\n\U0001F6AB️ Entity
    exclusion options\n   - Directly select specific entities\n   - Pattern-based
    exclusions using text strings\n   - Case-sensitive matching for precise control\n
    \  - Checkbox to exclude Hidden Entities\n   - **Note: Disabled entities are automatically
    excluded** (they are not loaded into the system)\n\n\U0001F4C8 Flexible display
    formats\n   - Friendly names only\n   - Entity IDs only\n   - Combined format
    (Friendly Name + Entity ID)\n\n\U0001F3AC Custom actions after report\n   - Add
    offline devices to To-Do list automatically\n   - Action buttons in notifications
    for manual control\n   - Custom automation actions integration\n   - {{ offline_devices
    }} variable returns a formatted list of offline devices\n   - {{ offline_devices_count
    }} variable returns the count of offline devices\t   \n\n\U0001F4E1 Smart device
    detection\n   - Automatic battery sensor identification\n   - Switch monitoring
    for offline states\n   - Combined or separate reporting options\n\n\U0001F4D6
    Logging\n   - Debug to Logbook\n   - Easy troubleshooting configuration\n\n\U0001F41B
    Real-Time Debug Mode (Short-term troubleshooting only - must enable in code, not
    just in the UI)\n   - Trigger on entity state changes to offline/unknown\n   -
    Configurable delay to confirm persistent offline state\n   - Uses same exclusions
    as scheduled reports\n\n\U0001F4E1 Monitored Domains\n   Monitors all sources...
    Zigbee, Z-Wave, WiFi, etc.\n   Will list entities from these domains...\n   -
    sensor.*\n   - binary_sensor.*\n   - switch.*\n\n   These domains are NOT monitored
    at all...\n   - climate.*\n   - light.*\n   - media_player.*\n   - device_tracker.*\n
    \  - input_*\n   - automation.*\n   - script.*\n   - scene.*\n   - weather.*\n
    \  - camera.*\n   - person.*\n   - zone.*\n   - sun.*\n   - timer.*\n   - counter.*\n
    \  - calendar.*\n\n**Variables available for Custom Actions and Notifications**\n\n-
    {{ offline_devices }} — formatted bulleted list of offline devices\n- {{ offline_devices_count
    }} — integer count of offline devices\n- {{ _offline_devices }} — raw array of
    offline devices\n- {{ _battery_sensors }} — raw array of offline battery sensors\n-
    {{ _switches }} — raw array of offline switches\n- {{ sensors_names }} — newline-separated
    offline sensor names\n- {{ switches_names }} — newline-separated offline switch
    names\n- {{ all_sensors }} — formatted string: all offline devices with count
    header\n- {{ sensors }} — formatted string: battery sensors only\n- {{ switches
    }} — formatted string: switches only\n- {{ easy_notify_message }} — the full notification
    body text\n- {{ to_do_description }} — comma-separated device list (max 250 chars)\n-
    {{ notify_title }} — your configured notification title\n- {{ notify_tag }} —
    your configured notification tag\n"
  domain: automation
  input:
    trigger_settings:
      name: ⚙️ Trigger Settings
      collapsed: true
      input:
        include_button:
          name: Use Button Trigger?
          default: disable_button_trigger
          selector:
            select:
              options:
              - label: Enabled
                value: enable_button_trigger
              - label: Disabled
                value: disable_button_trigger
              custom_value: false
              multiple: false
              sort: false
        button_entity:
          name: Set Button Trigger
          default: input_button.none
          selector:
            entity:
              domain:
              - input_button
              - button
              multiple: false
              reorder: false
        include_time:
          name: Use an Automatic Reoccuring Report?
          default: time_disabled
          selector:
            select:
              options:
              - label: Enabled
                value: time_enabled
              - label: Disabled
                value: time_disabled
              custom_value: false
              multiple: false
              sort: false
        time:
          name: Set Reoccuring Time
          default: 05:00:00
          selector:
            time: {}
        weekday_options:
          name: Set Reoccuring Days
          default:
          - mon
          - tue
          - wed
          - thu
          - fri
          - sat
          - sun
          selector:
            select:
              multiple: true
              mode: list
              options:
              - label: Monday
                value: mon
              - label: Tuesday
                value: tue
              - label: Wednesday
                value: wed
              - label: Thursday
                value: thu
              - label: Friday
                value: fri
              - label: Saturday
                value: sat
              - label: Sunday
                value: sun
              custom_value: false
              sort: false
    device_settings:
      name: "\U0001F6AB Exclusion Settings"
      collapsed: true
      input:
        exclude_hidden_entities:
          name: Exclude Hidden Entities
          default: true
          selector:
            boolean: {}
        exclude_entities:
          name: Individual Entities
          default: []
          selector:
            entity:
              multiple: true
              reorder: false
        exclude_strings:
          name: Text Pattern Exclusions
          default: ''
          selector:
            text:
              multiline: true
              multiple: false
    notification_settings:
      name: "\U0001F4E2 Notification Settings"
      collapsed: true
      input:
        include_easy_notify:
          name: Device Notifications
          default: disabled_easy_notify
          selector:
            select:
              options:
              - label: Disabled
                value: disabled_easy_notify
              - label: Enabled - notify only if offline devices found
                value: enable_easy_notify
              - label: Enabled - notify even if no offline devices found
                value: enable_easy_okay_notify
              custom_value: false
              multiple: false
              sort: false
        notify_device:
          name: Devices to Notify
          default: []
          selector:
            device:
              integration: mobile_app
              multiple: true
        notify_title:
          name: Notification Title
          default: Offline Devices Report
          selector:
            text:
              multiline: false
              multiple: false
        notify_message:
          name: Message Format
          default: all_sensors
          selector:
            select:
              options:
              - label: All Offline Devices
                value: all_sensors
              - label: Only Battery Sensors
                value: sensors
              - label: Only Switches
                value: switches
              custom_value: false
              multiple: false
              sort: false
        notify_okay_message:
          name: Message when No Offline Devices found
          default: No offline devices detected
          selector:
            text:
              multiline: false
              multiple: false
        notify_interruption_level:
          name: iOS Interruption Level
          default: active
          selector:
            select:
              options:
              - label: Default
                value: active
              - label: Critical Notifications
                value: critical
              - label: Time Sensitive
                value: time-sensitive
              - label: Quiet
                value: passive
              custom_value: false
              multiple: false
              sort: false
        notify_sound:
          name: iOS Notification Sound
          default: ''
          selector:
            text:
              multiline: false
              multiple: false
        notify_data:
          name: Android Options
          default: []
          selector:
            select:
              multiple: true
              options:
              - label: High Priority
                value: high_priority
              - label: Sticky Notification
                value: sticky
              - label: Notification Channel
                value: channel
              custom_value: false
              sort: false
        notify_channel:
          name: Android Notification Channel
          default: ''
          selector:
            text:
              multiline: false
              multiple: false
        include_persistent_notification:
          name: Persistent UI Notifications
          default: disabled_persistent_notification
          selector:
            select:
              options:
              - label: Disabled
                value: disabled_persistent_notification
              - label: Notify only when offline devices are found
                value: enable_persistent_notification
              - label: Notify always - even if no offline devices found
                value: enable_persistent_okay_notification
              custom_value: false
              multiple: false
              sort: false
        display_options:
          name: Display Options
          default: friendly_names
          selector:
            select:
              options:
              - label: Entity IDs
                value: entity_ids
              - label: Friendly Names
                value: friendly_names
              - label: Both
                value: both
              custom_value: false
              multiple: false
              sort: false
    action_buttons_settings:
      name: "\U0001F680 Action Buttons"
      collapsed: true
      input:
        auto_add_to_do:
          name: Automatically Add to To-Do List
          default: disable_auto_add_to_do
          selector:
            select:
              options:
              - label: Disabled
                value: disable_auto_add_to_do
              - label: Enabled
                value: enable_auto_add_to_do
              custom_value: false
              multiple: false
              sort: false
        notify_tag:
          name: Notification Action Tag
          default: offline_devices_report_action
          selector:
            text:
              multiline: false
              multiple: false
        notify_action_buttons:
          name: Action Buttons
          default: disabled_notify_action_buttons
          selector:
            select:
              options:
              - label: Disabled
                value: disabled_notify_action_buttons
              - label: Add To-Do Button
                value: enable_to_do_list_button
              - label: Add To-Do with Confirmation
                value: enable_to_do_list_button_and_confirmation
              custom_value: false
              multiple: false
              sort: false
        to_do_list:
          name: To-Do List
          default: []
          selector:
            entity:
              domain:
              - todo
              multiple: false
              reorder: false
        to_do_task_title:
          name: Task Title
          default: Check Offline Devices
          selector:
            text:
              multiline: false
              multiple: false
        action_button_to_do:
          name: Action Button Text
          default: Add to To-Do List
          selector:
            text:
              multiline: false
              multiple: false
        action_button_cancel:
          name: Cancel Button Text
          default: Cancel
          selector:
            text:
              multiline: false
              multiple: false
        action_button_confirmation_title:
          name: Confirmation Title
          default: Action Confirmation
          selector:
            text:
              multiline: false
              multiple: false
        action_button_confirmation_message:
          name: Confirmation Message
          default: Task added to To-Do list
          selector:
            text:
              multiline: false
              multiple: false
        cancel_action_button_confirmation_message:
          name: Cancel Confirmation Message
          default: Action cancelled
          selector:
            text:
              multiline: false
              multiple: false
    custom_actions_settings:
      name: ⚡ Custom Actions
      collapsed: true
      input:
        include_custom_actions:
          name: Enable Custom Actions
          default: disable_custom_actions
          selector:
            select:
              options:
              - label: Never
                value: disable_custom_actions
              - label: Only when offline devices are found
                value: enable_custom_actions_offline_only
              - label: Always (even if no offline devices found)
                value: enable_custom_actions_always
              custom_value: false
              multiple: false
              sort: false
        custom_actions:
          name: Custom Actions
          default: []
          selector:
            action: {}
    global_conditions_settings:
      name: "\U0001F30D Global Conditions"
      collapsed: true
      input:
        global_conditions:
          name: Conditions
          default: []
          selector:
            condition: {}
    debug_settings:
      name: "\U0001F41B Debug Settings"
      collapsed: true
      input:
        include_debug:
          name: Real-Time Debug Mode?
          default: debug_disabled
          selector:
            select:
              options:
              - label: Enabled
                value: debug_enabled
              - label: Disabled
                value: debug_disabled
              custom_value: false
              multiple: false
              sort: false
        debug_offline_delay:
          name: Wait Time Confirmation
          default: 00:03:00
          selector:
            duration:
              enable_second: true
        include_logbook_debug:
          name: Logbook Debug Messages
          default: logbook_realtime_only
          selector:
            select:
              options:
              - label: Enabled (All Runs)
                value: logbook_enabled_all
              - label: Real-Time Debug Only
                value: logbook_realtime_only
              - label: Disabled
                value: logbook_disabled
              custom_value: false
              multiple: false
              sort: false
        include_system_log_debug:
          name: System Log Debug Messages
          default: systemlog_realtime_only
          selector:
            select:
              options:
              - label: Enabled (All Runs)
                value: systemlog_enabled_all
              - label: Real-Time Debug Only
                value: systemlog_realtime_only
              - label: Disabled
                value: systemlog_disabled
              custom_value: false
              multiple: false
              sort: false
        include_debug_persistent_notification:
          name: Persistent UI Notifications
          default: persistent_realtime_only
          selector:
            select:
              options:
              - label: Enabled
                value: persistent_realtime_only
              - label: Disabled
                value: persistent_disabled
              custom_value: false
              multiple: false
              sort: false
  source_url: https://gist.github.com/Ltek/0c9cecf632b9c32915130680d834bcf7
variables:
  include_button: !input include_button
  button_entity: !input button_entity
  include_time: !input include_time
  include_debug: !input include_debug
  debug_offline_delay: !input debug_offline_delay
  include_logbook_debug: !input include_logbook_debug
  include_system_log_debug: !input include_system_log_debug
  include_debug_persistent_notification: !input include_debug_persistent_notification
  debug_offline_delay_seconds: "{% set delay = debug_offline_delay %} {% if delay
    is string %}\n  {% set parts = delay.split(':') %}\n  {% set hours = parts[0]
    | int %}\n  {% set minutes = parts[1] | int if parts|length > 1 else 0 %}\n  {%
    set seconds = parts[2] | int if parts|length > 2 else 0 %}\n  {{ (hours * 3600
    + minutes * 60 + seconds) | int }}\n{% elif delay is mapping and 'hours' in delay
    %}\n  {{ (delay.hours * 3600 + delay.minutes * 60 + delay.seconds) | int }}\n{%
    else %}\n  180\n{% endif %}\n"
  weekday_options: !input weekday_options
  exclude_hidden_entities: !input exclude_hidden_entities
  exclude_entities: !input exclude_entities
  exclude_strings: !input exclude_strings
  display_options: !input display_options
  include_easy_notify: !input include_easy_notify
  notify_device: !input notify_device
  notify_title: !input notify_title
  notify_message: !input notify_message
  notify_okay_message: !input notify_okay_message
  notify_interruption_level: !input notify_interruption_level
  notify_sound: !input notify_sound
  notify_data: !input notify_data
  notify_channel: !input notify_channel
  include_persistent_notification: !input include_persistent_notification
  notify_action_buttons: !input notify_action_buttons
  auto_add_to_do: !input auto_add_to_do
  notify_tag: !input notify_tag
  to_do_list: !input to_do_list
  to_do_task_title: !input to_do_task_title
  action_button_to_do: !input action_button_to_do
  action_button_cancel: !input action_button_cancel
  action_button_confirmation_title: !input action_button_confirmation_title
  action_button_confirmation_message: !input action_button_confirmation_message
  cancel_action_button_confirmation_message: !input cancel_action_button_confirmation_message
  include_custom_actions: !input include_custom_actions
  exclude_regex: "{% if exclude_strings is defined %}\n  {% set patterns = exclude_strings.split('\\n')
    | map('trim') | reject('eq', '') | list %}\n  {{ patterns | join('|') if patterns
    else 'a^' }}\n{% else %}\n  a^\n{% endif %}\n"
  all_exclude_entities: '{{ exclude_entities if exclude_entities is defined else []
    }}

    '
  _offline_devices: "{% set exclude_entities_list = all_exclude_entities %} {# Disabled
    entities are automatically excluded as they don't appear in states #} {% set entities
    = states | map(attribute='entity_id') | reject('search', 'cloud') | reject('in',
    exclude_entities_list) | reject('search', exclude_regex) | list %} {% if exclude_hidden_entities
    == true %}\n  {% set entities = entities | reject('is_hidden_entity') | list %}\n{%
    endif %} {% set sensors = entities | select('search', '^(sensor|binary_sensor)')
    | list %} {% set battery_entities = sensors | select('is_state_attr', 'device_class',
    'battery') | reject('has_value') | list %} {% set switches = entities | select('search',
    '^switch') | reject('has_value') | list %} {% set offline_entities = (battery_entities
    + switches) | unique %} {% if display_options == 'entity_ids' %}\n  {{ offline_entities
    | list }}\n{% elif display_options == 'friendly_names' %}\n  {{ offline_entities
    | map('state_attr', 'friendly_name') | reject('none') | list }}\n{% elif display_options
    == 'both' %}\n  {% set result = namespace(items=[]) %}\n  {% for e in offline_entities
    %}\n    {% set friendly_name = state_attr(e, 'friendly_name') %}\n    {% set item
    = friendly_name ~ ' (' ~ e ~ ')' if friendly_name else e %}\n    {% set result.items
    = result.items + [item] %}\n  {% endfor %}\n  {{ result.items | reject('none')
    | list }}\n{% else %}\n  []\n{% endif %}\n"
  offline_devices: "{% if _offline_devices | length > 0 %}\n  {{ '- ' ~ (_offline_devices
    | reject('none') | map('string') | sort | join('\\n- ')) }}\n{% else %}\n  No
    offline devices detected.\n{% endif %}\n"
  offline_devices_count: '{{ _offline_devices | length }}

    '
  _battery_sensors: "{% set exclude_entities_list = all_exclude_entities %} {# Disabled
    entities are automatically excluded as they don't appear in states #} {% set entities
    = states | map(attribute='entity_id') | reject('search', 'cloud') | reject('in',
    exclude_entities_list) | reject('search', exclude_regex) | list %} {% if exclude_hidden_entities
    == true %}\n  {% set entities = entities | reject('is_hidden_entity') | list %}\n{%
    endif %} {% set sensors = entities | select('search', '^(sensor|binary_sensor)')
    | list %} {% set battery_entities = sensors | select('is_state_attr', 'device_class',
    'battery') | reject('has_value') | list %} {{ battery_entities }}\n"
  _switches: "{% set exclude_entities_list = all_exclude_entities %} {# Disabled entities
    are automatically excluded as they don't appear in states #} {% set entities =
    states | map(attribute='entity_id') | reject('search', 'cloud') | reject('in',
    exclude_entities_list) | reject('search', exclude_regex) | list %} {% if exclude_hidden_entities
    == true %}\n  {% set entities = entities | reject('is_hidden_entity') | list %}\n{%
    endif %} {% set switches = entities | select('search', '^switch') | reject('has_value')
    | list %} {{ switches }}\n"
  all_sensors: "{% if _offline_devices | length > 0 %}\n  {{ offline_devices_count
    ~ ' Offline Devices\\n\\n' ~ ('- ' ~ (_offline_devices | reject('none') | map('string')
    | sort | join('\\n- '))) }}\n{% else %}\n  ''\n{% endif %}\n"
  sensors: "{% if _battery_sensors | length > 0 %}\n  {{ '\U0001F50B ' ~ _battery_sensors
    | length ~ ' Offline Battery Sensor(s):\\n\\n' ~ ('- ' ~ (_battery_sensors | reject('none')
    | map('string') | sort | join('\\n- '))) }}\n{% else %}\n  ''\n{% endif %}\n"
  switches: "{% if _switches | length > 0 %}\n  {{ '\U0001F50C ' ~ _switches | length
    ~ ' Offline Switch(es):\\n\\n' ~ ('- ' ~ (_switches | reject('none') | map('string')
    | sort | join('\\n- '))) }}\n{% else %}\n  ''\n{% endif %}\n"
  easy_notify_message: "{% if notify_message == 'all_sensors' %}\n  {{ all_sensors
    }}\n{% elif notify_message == 'sensors' %}\n  {{ sensors }}\n{% elif notify_message
    == 'switches' %}\n  {{ switches }}\n{% else %}\n  ''\n{% endif %}\n"
  to_do_description: "{% set device_list = _offline_devices | join(', ') %} {% set
    cleaned = device_list | regex_replace('\\\\s*\\\\([^)]+\\\\)', '') %} {% if cleaned
    | length > 250 %}\n  {{ cleaned[:250] ~ '...' }}\n{% else %}\n  {{ cleaned }}\n{%
    endif %}\n"
  sensors_names: "{% if _battery_sensors | length > 0 %}\n  {{ (_battery_sensors |
    reject('none') | map('string') | list | sort | join('\\n')) }}\n{% else %}\n  ''\n{%
    endif %}\n"
  switches_names: "{% if _switches | length > 0 %}\n  {{ (_switches | reject('none')
    | map('string') | list | sort | join('\\n')) }}\n{% else %}\n  ''\n{% endif %}\n"
  device_message_data: "{% set message = namespace(data={}) %} {% set push = namespace(data={})
    %} {% if notify_interruption_level in ['active', 'critical', 'time-sensitive',
    'passive'] %}\n  {% set push.data = dict(push.data, **{ 'interruption-level':
    notify_interruption_level }) %}\n{% endif %} {% if notify_sound != '' %}\n  {%
    set push.data = dict(push.data, **{ 'sound': notify_sound }) %}\n{% endif %} {%
    if push.data %}\n  {% set message.data = dict(message.data, **{ 'push': push.data
    }) %}\n{% endif %} {% if 'high_priority' in notify_data %}\n  {% set message.data
    = dict(message.data, **{ 'ttl': 0, 'priority': 'high' }) %}\n{% endif %} {% if
    'channel' in notify_data %}\n  {% set message.data = dict(message.data, **{ 'channel':
    notify_channel }) %}\n{% endif %} {% if 'sticky' in notify_data %}\n  {% set message.data
    = dict(message.data, **{ 'sticky': \"true\" }) %}\n{% endif %} {% set message.data
    = dict(message.data, **{ 'tag': notify_tag }) %} {{ message.data }}\n"
  device_message_data_action_button: "{% set message = namespace(data={}) %} {% set
    push = namespace(data={}) %} {% if notify_interruption_level in ['active', 'critical',
    'time-sensitive', 'passive'] %}\n  {% set push.data = dict(push.data, **{ 'interruption-level':
    notify_interruption_level }) %}\n{% endif %} {% if notify_sound != '' %}\n  {%
    set push.data = dict(push.data, **{ 'sound': notify_sound }) %}\n{% endif %} {%
    if push.data %}\n  {% set message.data = dict(message.data, **{ 'push': push.data
    }) %}\n{% endif %} {% if 'high_priority' in notify_data %}\n  {% set message.data
    = dict(message.data, **{ 'ttl': 0, 'priority': 'high' }) %}\n{% endif %} {% if
    'channel' in notify_data %}\n  {% set message.data = dict(message.data, **{ 'channel':
    notify_channel }) %}\n{% endif %} {% if 'sticky' in notify_data %}\n  {% set message.data
    = dict(message.data, **{ 'sticky': \"true\" }) %}\n{% endif %} {% set actions
    = [{'action': action_button_to_do, 'title': action_button_to_do}, {'action': action_button_cancel,
    'title': action_button_cancel}] %} {% set message.data = dict(message.data, **{
    'actions': actions, 'tag': notify_tag }) %} {{ message.data }}\n"
  device_confirmation_message_data: "{% set message = namespace(data={}) %} {% set
    push = namespace(data={}) %} {% if notify_interruption_level in ['active', 'critical',
    'time-sensitive', 'passive'] %}\n  {% set push.data = dict(push.data, **{ 'interruption-level':
    notify_interruption_level }) %}\n{% endif %} {% if notify_sound != '' %}\n  {%
    set push.data = dict(push.data, **{ 'sound': notify_sound }) %}\n{% endif %} {%
    if push.data %}\n  {% set message.data = dict(message.data, **{ 'push': push.data
    }) %}\n{% endif %} {% if 'high_priority' in notify_data %}\n  {% set message.data
    = dict(message.data, **{ 'ttl': 0, 'priority': 'high' }) %}\n{% endif %} {% if
    'channel' in notify_data %}\n  {% set message.data = dict(message.data, **{ 'channel':
    notify_channel }) %}\n{% endif %} {% if 'sticky' in notify_data %}\n  {% set message.data
    = dict(message.data, **{ 'sticky': \"true\" }) %}\n{% endif %} {% set message.data
    = dict(message.data, **{ 'tag': notify_tag }) %} {{ message.data }}\n"
mode: single
triggers:
- platform: time
  at: !input time
  id: time_trigger
- platform: state
  entity_id: !input button_entity
  id: button_trigger
actions:
- choose:
  - conditions:
    - condition: trigger
      id: debug_trigger
    - condition: template
      value_template: '{{ include_debug == "debug_enabled" }}'
    sequence:
    - if:
      - condition: template
        value_template: '{{ include_system_log_debug in ["systemlog_enabled_all",
          "systemlog_realtime_only"] }}'
      then:
      - service: system_log.write
        data:
          message: Debug mode triggered by state_changed event
          level: warning
    - variables:
        debug_entity: '{{ trigger.event.data.entity_id }}'
        debug_entity_state: '{{ trigger.event.data.new_state.state }}'
        debug_entity_name: '{{ trigger.event.data.new_state.attributes.friendly_name
          or trigger.event.data.entity_id }}'
        old_state: '{{ trigger.event.data.old_state.state if trigger.event.data.old_state
          else '''' }}'
    - if:
      - condition: template
        value_template: '{{ include_system_log_debug in ["systemlog_enabled_all",
          "systemlog_realtime_only"] }}'
      then:
      - service: system_log.write
        data:
          message: 'Debug checking entity: {{ debug_entity }}, new_state: {{ debug_entity_state
            }}, old_state: {{ old_state }}'
          level: warning
    - if:
      - condition: template
        value_template: '{{ debug_entity_state not in ["unknown", "unavailable"] or
          old_state in ["unknown", "unavailable"] }}'
      then:
      - if:
        - condition: template
          value_template: '{{ include_system_log_debug in ["systemlog_enabled_all",
            "systemlog_realtime_only"] }}'
        then:
        - service: system_log.write
          data:
            message: 'Debug stopped: Not a change TO unknown/unavailable for {{ debug_entity
              }}'
            level: info
      - stop: Not a change TO unknown/unavailable state
    - variables:
        entity_excluded: "{% if debug_entity in all_exclude_entities %}\n  true\n{%
          elif exclude_regex != 'a^' and debug_entity is search(exclude_regex) %}\n
          \ true\n{% elif exclude_hidden_entities == true and is_hidden_entity(debug_entity)
          %}\n  true\n{% elif debug_entity is search('cloud') %}\n  true\n{% else
          %}\n  false\n{% endif %}\n"
    - if:
      - condition: template
        value_template: '{{ include_system_log_debug in ["systemlog_enabled_all",
          "systemlog_realtime_only"] }}'
      then:
      - service: system_log.write
        data:
          message: 'Debug exclusion check for {{ debug_entity }}: excluded={{ entity_excluded
            }}'
          level: info
    - if:
      - condition: template
        value_template: '{{ entity_excluded == true }}'
      then:
      - if:
        - condition: template
          value_template: '{{ include_logbook_debug in ["logbook_enabled_all", "logbook_realtime_only"]
            }}'
        then:
        - service: logbook.log
          data:
            name: Offline Devices Debug Mode
            message: 'Debug ignored: {{ debug_entity_name }} is excluded'
      - if:
        - condition: template
          value_template: '{{ include_system_log_debug in ["systemlog_enabled_all",
            "systemlog_realtime_only"] }}'
        then:
        - service: system_log.write
          data:
            message: 'Debug ignored: {{ debug_entity_name }} ({{ debug_entity }})
              is excluded from monitoring'
            level: info
      - if:
        - condition: template
          value_template: '{{ include_debug_persistent_notification == "persistent_realtime_only"
            }}'
        then:
        - service: persistent_notification.create
          data:
            title: "\U0001F41B Debug: Entity Excluded"
            message: 'Debug ignored: {{ debug_entity_name }} is excluded from monitoring'
            notification_id: debug_excluded_{{ debug_entity | replace(".", "_") }}
      - stop: Entity excluded from debug
    - if:
      - condition: template
        value_template: '{{ include_logbook_debug in ["logbook_enabled_all", "logbook_realtime_only"]
          }}'
      then:
      - service: logbook.log
        data:
          name: Offline Devices Debug Mode
          message: 'Debug triggered: {{ debug_entity_name }} ({{ debug_entity }})
            changed from {{ old_state }} to {{ debug_entity_state }}'
    - if:
      - condition: template
        value_template: '{{ include_system_log_debug in ["systemlog_enabled_all",
          "systemlog_realtime_only"] }}'
      then:
      - service: system_log.write
        data:
          message: "\U0001F41B DEBUG ALERT: {{ debug_entity_name }} ({{ debug_entity
            }}) went {{ debug_entity_state }}"
          level: warning
    - if:
      - condition: template
        value_template: '{{ include_debug_persistent_notification in ["persistent_enabled_all",
          "persistent_realtime_only"] }}'
      then:
      - service: persistent_notification.create
        data:
          title: "\U0001F41B Debug: Entity Offline Detected"
          message: '{{ debug_entity_name }} ({{ debug_entity }}) changed from {{ old_state
            }} to {{ debug_entity_state }}'
          notification_id: debug_trigger_{{ debug_entity | replace(".", "_") }}
    - wait_template: '{{ states(debug_entity) in ["unknown","unavailable"] }}'
      timeout: '{{ debug_offline_delay_seconds }}'
      continue_on_timeout: false
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ wait is defined and wait.timed_out == true }}'
        sequence:
        - if:
          - condition: template
            value_template: '{{ include_logbook_debug in ["logbook_enabled_all", "logbook_realtime_only"]
              }}'
          then:
          - service: logbook.log
            data:
              name: Offline Devices Debug Mode
              message: '{{ debug_entity_name }} ({{ debug_entity }}) stayed {{ debug_entity_state
                }} for {{ debug_offline_delay }}'
        - if:
          - condition: template
            value_template: '{{ include_debug_persistent_notification in ["persistent_enabled_all",
              "persistent_realtime_only"] }}'
          then:
          - service: persistent_notification.create
            data:
              title: "\U0001F41B Debug: Entity Confirmed Offline"
              message: '{{ debug_entity_name }} ({{ debug_entity }}) stayed {{ debug_entity_state
                }} for {{ debug_offline_delay }}'
              notification_id: debug_confirmed_{{ debug_entity | replace(".", "_")
                }}
        - stop: Debug complete - entity stayed offline
      - conditions:
        - condition: template
          value_template: '{{ wait is defined and wait.timed_out == false }}'
        sequence:
        - if:
          - condition: template
            value_template: '{{ include_logbook_debug in ["logbook_enabled_all", "logbook_realtime_only"]
              }}'
          then:
          - service: logbook.log
            data:
              name: Offline Devices Debug Mode
              message: '{{ debug_entity_name }} ({{ debug_entity }}) came back online
                during wait period'
        - if:
          - condition: template
            value_template: '{{ include_debug_persistent_notification in ["persistent_enabled_all",
              "persistent_realtime_only"] }}'
          then:
          - service: persistent_notification.create
            data:
              title: "\U0001F41B Debug: Entity Back Online"
              message: '{{ debug_entity_name }} ({{ debug_entity }}) came back online
                during wait period'
              notification_id: debug_online_{{ debug_entity | replace(".", "_") }}
        - stop: Debug cancelled - entity came back online
- if:
  - condition: template
    value_template: '{{ include_logbook_debug == "logbook_enabled_all" or (include_logbook_debug
      == "logbook_realtime_only" and trigger.id == "debug_trigger") }}'
  then:
  - service: logbook.log
    data:
      name: Offline Devices Report Debug
      message: 'Initial: include_easy_notify: {{ include_easy_notify | default(''undefined'')
        }},

        include_persistent_notification: {{ include_persistent_notification | default(''undefined'')
        }},

        notify_device: {{ notify_device | default(''undefined'') }},

        offline_devices_count: {{ offline_devices_count | default(''0'') }},

        _battery_sensors_count: {{ _battery_sensors | length | default(''0'') }},

        _switches_count: {{ _switches | length | default(''0'') }},

        easy_notify_message length: {{ easy_notify_message | default('''') | length
        }},

        to_do_description length: {{ to_do_description | default('''') | length }},

        to_do_list: {{ to_do_list | default(''undefined'') }},

        exclude_hidden_entities: {{ exclude_hidden_entities | default(''undefined'')
        }}

        '
- choose:
  - alias: Use the easy notify options
    conditions:
    - condition: template
      value_template: '{{ include_easy_notify == "enable_easy_notify" or include_easy_notify
        == "enable_easy_okay_notify" }}'
    - condition: template
      value_template: '{{ notify_device | length > 0 }}'
    - condition: template
      value_template: '{{ trigger.id != "debug_trigger" }}'
    sequence:
    - alias: Send a notification to each device
      repeat:
        for_each: '{{ notify_device | default([]) }}'
        sequence:
        - choose:
          - alias: Offline devices have been found
            conditions:
            - condition: template
              value_template: '{{ offline_devices_count > 0 }}'
            sequence:
            - choose:
              - alias: Easy notify with no action button
                conditions:
                - condition: template
                  value_template: '{{ notify_action_buttons == "disabled_notify_action_buttons"
                    or auto_add_to_do == "enable_auto_add_to_do" }}'
                sequence:
                - service: notify.mobile_app_{{ device_attr(repeat.item, 'name') |
                    slugify }}
                  data:
                    title: !input notify_title
                    message: '{{ easy_notify_message }}'
                    data: '{{ device_message_data }}'
                - if:
                  - condition: template
                    value_template: '{{ include_logbook_debug == "logbook_enabled_all"
                      }}'
                  then:
                  - service: logbook.log
                    data:
                      name: Offline Devices Report Debug
                      message: 'Sent notification without action buttons to device:
                        {{ device_attr(repeat.item, "name") | slugify }}, service:
                        notify.mobile_app_{{ device_attr(repeat.item, "name") | slugify
                        }}, tag: {{ notify_tag }}, message length: {{ easy_notify_message
                        | length }}'
              - alias: Easy notify with action button
                conditions:
                - condition: template
                  value_template: '{{ notify_action_buttons != "disabled_notify_action_buttons"
                    and auto_add_to_do != "enable_auto_add_to_do" }}'
                sequence:
                - service: notify.mobile_app_{{ device_attr(repeat.item, 'name') |
                    slugify }}
                  data:
                    title: !input notify_title
                    message: '{{ easy_notify_message }}'
                    data: '{{ device_message_data_action_button }}'
                - if:
                  - condition: template
                    value_template: '{{ include_logbook_debug == "logbook_enabled_all"
                      }}'
                  then:
                  - service: logbook.log
                    data:
                      name: Offline Devices Report Debug
                      message: 'Sent notification with action buttons to device: {{
                        device_attr(repeat.item, "name") | slugify }}, service: notify.mobile_app_{{
                        device_attr(repeat.item, "name") | slugify }}, tag: {{ notify_tag
                        }}, actions: {{ device_message_data_action_button }}'
          - alias: No offline devices have been found
            conditions:
            - condition: template
              value_template: '{{ offline_devices_count == 0 }}'
            - condition: template
              value_template: '{{ include_easy_notify == "enable_easy_okay_notify"
                }}'
            sequence:
            - service: notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify
                }}
              data:
                title: !input notify_title
                message: '{{ notify_okay_message }}'
                data: '{{ device_message_data }}'
            - if:
              - condition: template
                value_template: '{{ include_logbook_debug == "logbook_enabled_all"
                  }}'
              then:
              - service: logbook.log
                data:
                  name: Offline Devices Report Debug
                  message: 'Sent no-issues notification to device: {{ device_attr(repeat.item,
                    "name") | slugify }}, service: notify.mobile_app_{{ device_attr(repeat.item,
                    "name") | slugify }}, tag: {{ notify_tag }}, message: {{ notify_okay_message
                    }}'
- choose:
  - alias: Use the easy notify persistent notification options
    conditions:
    - condition: template
      value_template: '{{ include_persistent_notification == "enable_persistent_notification"
        or include_persistent_notification == "enable_persistent_okay_notification"
        }}'
    - condition: template
      value_template: '{{ trigger.id != "debug_trigger" }}'
    sequence:
    - choose:
      - alias: Offline devices have been found
        conditions:
        - condition: template
          value_template: '{{ offline_devices_count > 0 }}'
        sequence:
        - service: persistent_notification.create
          data:
            title: ⛔ {{ notify_title }}
            message: '{{ easy_notify_message }}'
            notification_id: offline_devices_report
        - if:
          - condition: template
            value_template: '{{ include_logbook_debug == "logbook_enabled_all" }}'
          then:
          - service: logbook.log
            data:
              name: Offline Devices Report Debug
              message: 'Created persistent notification, id: offline_devices_report,
                message length: {{ easy_notify_message | length }}'
      - alias: No offline devices have been found
        conditions:
        - condition: template
          value_template: '{{ offline_devices_count == 0 }}'
        - condition: template
          value_template: '{{ include_persistent_notification == "enable_persistent_okay_notification"
            }}'
        sequence:
        - service: persistent_notification.create
          data:
            title: ⛔ {{ notify_title }}
            message: '{{ notify_okay_message }}'
            notification_id: offline_devices_report_ok
        - if:
          - condition: template
            value_template: '{{ include_logbook_debug == "logbook_enabled_all" }}'
          then:
          - service: logbook.log
            data:
              name: Offline Devices Report Debug
              message: 'Created persistent no-issues notification, id: offline_devices_report_ok,
                message: {{ notify_okay_message }}'
- choose:
  - alias: Auto-add to To-Do list when enabled
    conditions:
    - condition: template
      value_template: '{{ auto_add_to_do == "enable_auto_add_to_do" and to_do_description
        != "" }}'
    - condition: template
      value_template: '{{ to_do_list | length > 0 and is_state(to_do_list, "unknown")
        == false and is_state(to_do_list, "unavailable") == false }}'
    - condition: template
      value_template: '{{ trigger.id != "debug_trigger" }}'
    sequence:
    - service: todo.add_item
      data:
        entity_id: '{{ to_do_list }}'
        item: !input to_do_task_title
        description: '{{ to_do_description }}'
      continue_on_error: true
    - if:
      - condition: template
        value_template: '{{ include_logbook_debug == "logbook_enabled_all" }}'
      then:
      - service: logbook.log
        data:
          name: Offline Devices Report Debug
          message: 'Auto-added To-Do item to {{ to_do_list }}: title={{ to_do_task_title
            }}, description length={{ to_do_description | length }}'
- choose:
  - alias: Check if the To-Do action button is enabled
    conditions:
    - condition: template
      value_template: '{{ include_easy_notify == "enable_easy_notify" or include_easy_notify
        == "enable_easy_okay_notify" }}'
    - condition: template
      value_template: '{{ notify_action_buttons == "enable_to_do_list_button" or notify_action_buttons
        == "enable_to_do_list_button_and_confirmation" }}'
    - condition: template
      value_template: '{{ auto_add_to_do != "enable_auto_add_to_do" }}'
    - condition: template
      value_template: '{{ notify_device | length > 0 }}'
    - condition: template
      value_template: '{{ to_do_list | length > 0 and is_state(to_do_list, "unknown")
        == false and is_state(to_do_list, "unavailable") == false }}'
    - condition: template
      value_template: '{{ trigger.id != "debug_trigger" }}'
    sequence:
    - alias: Wait for a response from the action buttons
      wait_for_trigger:
      - platform: event
        event_type: mobile_app_notification_action
        event_data:
          action: '{{ action_button_to_do }}'
      - platform: event
        event_type: mobile_app_notification_action
        event_data:
          action: '{{ action_button_cancel }}'
      timeout: 00:15:00
      continue_on_timeout: true
    - if:
      - condition: template
        value_template: '{{ include_logbook_debug == "logbook_enabled_all" }}'
      then:
      - service: logbook.log
        data:
          name: Offline Devices Report Debug
          message: 'Wait for trigger result: {{ wait.trigger | default("no trigger
            received", true) }}, action: {{ wait.trigger.event.data.action if wait.trigger
            else "none" }}, tag: {{ notify_tag if wait.trigger else "none" }}, event_data:
            {{ wait.trigger.event.data if wait.trigger else "none" }}'
    - choose:
      - alias: Check if confirmation message is disabled
        conditions:
        - condition: template
          value_template: '{{ notify_action_buttons == "enable_to_do_list_button"
            }}'
        sequence:
        - if:
          - condition: template
            value_template: '{{ wait.trigger is not none and wait.trigger.event.data.action
              == action_button_to_do }}'
          then:
          - service: todo.add_item
            data:
              entity_id: '{{ to_do_list }}'
              item: !input to_do_task_title
              description: '{{ to_do_description }}'
            continue_on_error: true
          - if:
            - condition: template
              value_template: '{{ include_logbook_debug == "logbook_enabled_all" }}'
            then:
            - service: logbook.log
              data:
                name: Offline Devices Report Debug
                message: 'Added To-Do item to {{ to_do_list }}: title={{ to_do_task_title
                  }}, description length={{ to_do_description | length }}'
        - if:
          - condition: template
            value_template: '{{ wait.trigger is not none and wait.trigger.event.data.action
              == action_button_cancel }}'
          then:
          - if:
            - condition: template
              value_template: '{{ include_logbook_debug == "logbook_enabled_all" }}'
            then:
            - service: logbook.log
              data:
                name: Offline Devices Report Debug
                message: 'Action cancelled for tag: {{ notify_tag }}'
          - stop: Action cancelled
      - alias: Check if confirmation message is enabled
        conditions:
        - condition: template
          value_template: '{{ notify_action_buttons == "enable_to_do_list_button_and_confirmation"
            }}'
        sequence:
        - if:
          - condition: template
            value_template: '{{ wait.trigger is not none and wait.trigger.event.data.action
              == action_button_to_do }}'
          then:
          - service: todo.add_item
            data:
              entity_id: '{{ to_do_list }}'
              item: !input to_do_task_title
              description: '{{ to_do_description }}'
            continue_on_error: true
          - if:
            - condition: template
              value_template: '{{ include_logbook_debug == "logbook_enabled_all" }}'
            then:
            - service: logbook.log
              data:
                name: Offline Devices Report Debug
                message: 'Added To-Do item to {{ to_do_list }}: title={{ to_do_task_title
                  }}, description length={{ to_do_description | length }}'
          - repeat:
              for_each: '{{ notify_device | default([]) }}'
              sequence:
              - service: notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify
                  }}
                data:
                  title: !input action_button_confirmation_title
                  message: !input action_button_confirmation_message
                  data: '{{ device_confirmation_message_data }}'
                continue_on_error: true
              - if:
                - condition: template
                  value_template: '{{ include_logbook_debug == "logbook_enabled_all"
                    }}'
                then:
                - service: logbook.log
                  data:
                    name: Offline Devices Report Debug
                    message: 'Sent confirmation notification to device: {{ device_attr(repeat.item,
                      "name") | slugify }}, service: notify.mobile_app_{{ device_attr(repeat.item,
                      "name") | slugify }}, tag: {{ notify_tag }}, message: {{ action_button_confirmation_message
                      }}'
        - if:
          - condition: template
            value_template: '{{ wait.trigger is not none and wait.trigger.event.data.action
              == action_button_cancel }}'
          then:
          - repeat:
              for_each: '{{ notify_device | default([]) }}'
              sequence:
              - service: notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify
                  }}
                data:
                  title: !input action_button_confirmation_title
                  message: !input cancel_action_button_confirmation_message
                  data: '{{ device_message_data }}'
                continue_on_error: true
              - if:
                - condition: template
                  value_template: '{{ include_logbook_debug == "logbook_enabled_all"
                    }}'
                then:
                - service: logbook.log
                  data:
                    name: Offline Devices Report Debug
                    message: 'Sent cancel confirmation notification to device: {{
                      device_attr(repeat.item, "name") | slugify }}, service: notify.mobile_app_{{
                      device_attr(repeat.item, "name") | slugify }}, tag: {{ notify_tag
                      }}, message: {{ cancel_action_button_confirmation_message }}'
- choose:
  - alias: Perform the custom actions
    conditions:
    - condition: template
      value_template: "{{ include_custom_actions == \"enable_custom_actions_always\"
        or\n   (include_custom_actions == \"enable_custom_actions_offline_only\" and
        offline_devices_count | int > 0) }}"
    - condition: template
      value_template: '{{ trigger.id != "debug_trigger" }}'
    sequence: !input custom_actions
conditions:
- condition: or
  conditions:
  - condition: and
    conditions:
    - condition: trigger
      id: button_trigger
    - condition: template
      value_template: '{{ include_button == "enable_button_trigger" }}'
    - condition: template
      value_template: '{{ button_entity is not none and button_entity != "" }}'
    - condition: template
      value_template: '{{ trigger.id == "button_trigger" and trigger.to_state.entity_id
        == button_entity }}'
    - condition: template
      value_template: '{{ trigger.id == "button_trigger" and trigger.to_state.state
        not in ["unknown", "unavailable", "off"] }}'
  - condition: and
    conditions:
    - condition: trigger
      id: time_trigger
    - condition: template
      value_template: '{{ include_time == "time_enabled" }}'
    - condition: template
      value_template: '{{ now().strftime("%a").lower() in weekday_options }}'
  - condition: and
    conditions:
    - condition: trigger
      id: debug_trigger
    - condition: template
      value_template: '{{ include_debug == "debug_enabled" }}'
    - condition: template
      value_template: "{{ trigger.event.data.new_state is not none \n   and trigger.event.data.new_state.state
        in [\"unavailable\", \"unknown\"]\n   and (trigger.event.data.old_state is
        none \n        or trigger.event.data.old_state.state not in [\"unavailable\",
        \"unknown\"]) }}\n"
- condition: and
  conditions: !input global_conditions
